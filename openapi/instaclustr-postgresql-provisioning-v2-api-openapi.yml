          description: 'Version of Postgresql to run on the cluster. Available versions: <ul> <li>`18.6.0`</li> <li>`17.11.0`</li> </ul>'
          example: 1.2.3
          x-terraform-force-new: true
        description:
          type: string
          description: A description of the cluster
          example: Cluster managed by the integration team.
          x-terraform-computed: true
        twoFactorDelete:
          maxItems: 1
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/TwoFactorDeleteSettingsV2'
          x-terraform-computed: true
        backupRetentionDays:
          type: integer
          description: Number of days for which backups are retained, to a maximum of 36. Retention can be changed to between 7 and 36 days, and only on AWS_VPC clusters.
          format: int32
          example: 7
        defaultUserPassword:
          type: string
          description: Password of the default user created for the PostgreSQL cluster.
          readOnly: true
          x-terraform-sensitive: true
        extensions:
