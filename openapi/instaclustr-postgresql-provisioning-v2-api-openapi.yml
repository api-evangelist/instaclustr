openapi: 3.2.0
info:
  title: Instaclustr PostgreSQL Provisioning V2 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged PostgreSQL Provisioning V2 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: PostgreSQL Provisioning V2
  description: Operations related to managing a Postgresql cluster
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/data-sources/applications/postgresql/clusters/v2/{clusterId}/list-backups/v2/:
    parameters:
    - name: clusterId
      in: path
      description: ID of the cluster.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - PostgreSQL Provisioning V2
      summary: List recent cluster backup events
      description: List backups and restores for each node in a given PostgreSQL cluster, for the last 7 days.
      operationId: listPostgreSQLClusterBackupsV2
      responses:
        '200':
          description: List backups and restores for each node in a given cluster, for the retention period configured on the cluster's backup storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresqlClusterBackupEventsV2'
              example:
                clusterDataCentres:
                - id: a8c32b20-c8f0-11e7-abc4-cec278b6b50a
                  name: AWS_VPC_US_EAST_1
                  nodes:
                  - events:
                    - end: 1510585212265
                      progress: 0.5
                      start: 1510585212265
                      state: ACTIVE
                      type: snapshot-upload
                    id: cb986e08-f6be-4d08-8de2-4352c2cfaf1f
                    privateAddress: 10.0.0.1
                    publicAddress: 50.0.0.1
                clusterSnapshots:
                - clusterSnapshotId: a8c32b20-c8f0-11e7-abc4
                  createdTime: '2023-12-21T04:03:32Z'
                  progress: 0.5
                  state: ACTIVE
                - clusterSnapshotId: 92873dse-c8f0-11e7-abc4
                  createdTime: '2023-12-01T02:06:22Z'
                  progress: 1
                  state: COMPLETED
                id: 77b5a4e1-c422-4a78-b551-d8fa5c42ad95
                name: example-cluster
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/data-sources/applications/postgresql/compatible-node-sizes/v2/:
    parameters:
    - name: pgbouncerRequired
      in: query
      description: Specifies whether node sizes are also compatible with PgBouncer.
      required: false
      style: form
      explode: true
      schema:
        type: boolean
    get:
      tags:
      - PostgreSQL Provisioning V2
      summary: List compatible node sizes for PostgreSQL and any specified addon applications
      responses:
        '200':
          description: Successfully retrieved compatible node sizes for PostgreSQL.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CloudProviderNodeSizesListV2'
      operationId: getClusterManagementV2DataSourcesApplicationsPostgresqlCompatibleNodeSizesV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/data-sources/applications/postgresql/compatible-versions/v2/{version}:
    parameters:
    - name: version
      in: path
      description: A PostgreSQL version.
      required: true
      style: simple
      explode: false
      schema:
        pattern: '[0-9]+\.[0-9]+\.[0-9]+'
        type: string
    get:
      tags:
      - PostgreSQL Provisioning V2
      summary: List all versions of applications compatible with a PostgreSQL version
      responses:
        '200':
          description: Successfully retrieved versions of applications compatible with a PostgreSQL version.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompatibleVersionListV2'
      operationId: getClusterManagementV2DataSourcesApplicationsPostgresqlCompatibleVersionsV2ByVersion
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/data-sources/applications/postgresql/versions/v2/:
    get:
      tags:
      - PostgreSQL Provisioning V2
      summary: List all PostgreSQL applications and versions
      responses:
        '200':
          description: Successfully retrieved applications and versions for PostgreSQL.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationVersionListV2'
      operationId: getClusterManagementV2DataSourcesApplicationsPostgresqlVersionsV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/postgresql/clusters/v2/:
    x-terraform-resource-name: postgresql_cluster_v2
    post:
      tags:
      - PostgreSQL Provisioning V2
      summary: Create a Postgresql cluster
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostgresqlClusterV2'
        required: true
      responses:
        '202':
          description: PostgreSQL Cluster provisioning requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresqlClusterV2'
              example:
                currentClusterOperationStatus: NO_OPERATION
                dataCentres:
                - clientToClusterEncryption: true
                  cloudProvider: AWS_VPC
                  id: 4650aa98-e894-4675-9614-558915d5837a
                  intraDataCentreReplication:
                  - replicationMode: SYNCHRONOUS
                  name: dc_1
                  network: 10.1.0.0/16
                  nodeSize: PGS-DEV-t4g.small-5
                  nodes:
                  - id: 94c1ad54-c6f1-4f2e-8634-be9f5fb47fad
                    nodeRoles:
                    - POSTGRESQL
                    nodeSize: PGS-DEV-t4g.small-5
                    privateAddress: 10.0.5.23
                    publicAddress: 24.135.55.176
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: cc317853-be79-4100-898f-c12e4610a892
                    nodeRoles:
                    - POSTGRESQL
                    nodeSize: PGS-DEV-t4g.small-5
                    privateAddress: 10.0.128.45
                    publicAddress: 193.146.159.238
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: b401b5bb-8a6f-4aa7-99c4-12fe445941c3
                    nodeRoles:
                    - POSTGRESQL
                    nodeSize: PGS-DEV-t4g.small-5
                    privateAddress: 10.0.200.78
                    publicAddress: 108.21.43.134
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  numberOfNodes: 2
                  region: US_EAST_1
                  status: RUNNING
                extensions:
                - PG_CRON
                - PG_PARTMAN
                id: 4650aa98-e894-4675-9614-558915d5837a
                name: test_apiv2_postgresql_create
                pciComplianceMode: false
                postgresqlVersion: '[x.y.z]'
                privateNetworkCluster: false
                slaTier: NON_PRODUCTION
                status: RUNNING
                synchronousModeStrict: false
          x-terraform-resource-poll-completed-statuses: NO_OPERATION
          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: OPERATION_IN_PROGRESS
      x-codegen-request-body-name: body
      x-terraform-resource-timeout: 99999m
      operationId: postClusterManagementV2ResourcesApplicationsPostgresqlClustersV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/postgresql/clusters/v2/{clusterId}/:
    parameters:
    - name: clusterId
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - PostgreSQL Provisioning V2
      summary: Get PostgreSQL cluster details
      description: Get PostgreSQL cluster details.
      operationId: getPostgreSQLClusterV2
      responses:
        '200':
          description: PostgreSQL cluster details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresqlClusterV2'
              example:
                currentClusterOperationStatus: NO_OPERATION
                dataCentres:
                - clientToClusterEncryption: true
                  cloudProvider: AWS_VPC
                  id: 4650aa98-e894-4675-9614-558915d5837a
                  intraDataCentreReplication:
                  - replicationMode: SYNCHRONOUS
                  name: dc_1
                  network: 10.1.0.0/16
                  nodeSize: PGS-DEV-t4g.small-5
                  nodes:
                  - id: 94c1ad54-c6f1-4f2e-8634-be9f5fb47fad
                    nodeRoles:
                    - POSTGRESQL
                    nodeSize: PGS-DEV-t4g.small-5
                    privateAddress: 10.0.5.23
                    publicAddress: 24.135.55.176
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: cc317853-be79-4100-898f-c12e4610a892
                    nodeRoles:
                    - POSTGRESQL
                    nodeSize: PGS-DEV-t4g.small-5
                    privateAddress: 10.0.128.45
                    publicAddress: 193.146.159.238
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: b401b5bb-8a6f-4aa7-99c4-12fe445941c3
                    nodeRoles:
                    - POSTGRESQL
                    nodeSize: PGS-DEV-t4g.small-5
                    privateAddress: 10.0.200.78
                    publicAddress: 108.21.43.134
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  numberOfNodes: 2
                  region: US_EAST_1
                  status: RUNNING
                extensions:
                - PG_CRON
                - PG_PARTMAN
                id: 4650aa98-e894-4675-9614-558915d5837a
                name: test_apiv2_postgresql_create
                pciComplianceMode: false
                postgresqlVersion: '[x.y.z]'
                privateNetworkCluster: false
                slaTier: NON_PRODUCTION
                status: RUNNING
                synchronousModeStrict: false
    put:
      tags:
      - PostgreSQL Provisioning V2
      summary: Update PostgreSQL cluster details
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostgresqlClusterUpdateV2'
        required: true
      responses:
        '202':
          description: PostgreSQL cluster update request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresqlClusterV2'
              example:
                currentClusterOperationStatus: NO_OPERATION
                dataCentres:
                - clientToClusterEncryption: true
                  cloudProvider: AWS_VPC
                  id: 4650aa98-e894-4675-9614-558915d5837a
                  intraDataCentreReplication:
                  - replicationMode: SYNCHRONOUS
                  name: dc_1
                  network: 10.1.0.0/16
                  nodeSize: PGS-DEV-t4g.small-5
                  nodes:
                  - id: 94c1ad54-c6f1-4f2e-8634-be9f5fb47fad
                    nodeRoles:
                    - POSTGRESQL
                    nodeSize: PGS-DEV-t4g.small-5
                    privateAddress: 10.0.5.23
                    publicAddress: 24.135.55.176
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: cc317853-be79-4100-898f-c12e4610a892
                    nodeRoles:
                    - POSTGRESQL
                    nodeSize: PGS-DEV-t4g.small-5
                    privateAddress: 10.0.128.45
                    publicAddress: 193.146.159.238
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: b401b5bb-8a6f-4aa7-99c4-12fe445941c3
                    nodeRoles:
                    - POSTGRESQL
                    nodeSize: PGS-DEV-t4g.small-5
                    privateAddress: 10.0.200.78
                    publicAddress: 108.21.43.134
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  numberOfNodes: 2
                  region: US_EAST_1
                  status: RUNNING
                extensions:
                - PG_CRON
                - PG_PARTMAN
                id: 4650aa98-e894-4675-9614-558915d5837a
                name: test_apiv2_postgresql_create
                pciComplianceMode: false
                postgresqlVersion: '[x.y.z]'
                privateNetworkCluster: false
                slaTier: NON_PRODUCTION
                status: RUNNING
                synchronousModeStrict: false
        '404':
          description: PostgreSQL cluster not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      x-codegen-request-body-name: body
      x-terraform-resource-timeout: 99999m
      operationId: putClusterManagementV2ResourcesApplicationsPostgresqlClustersV2ByClusterId
      x-operation-id-source: derived
    delete:
      tags:
      - PostgreSQL Provisioning V2
      summary: Delete cluster
      description: Delete an active cluster.
      responses:
        '204':
          description: Cluster delete requested.
          content: {}
      x-terraform-resource-poll-enabled: true
      operationId: deleteClusterManagementV2ResourcesApplicationsPostgresqlClustersV2ByClusterId
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    ProviderAzureSettingsV2:
      type: object
      properties:
        resourceGroup:
          type: string
          description: The name of the Azure Resource Group into which the Data Centre will be provisioned.
          x-insta-unchangeable: true
        customVirtualNetworkId:
          type: string
          description: VNet ID into which the Data Centre will be provisioned. The VNet must have an available address space for the Data Centre's network allocation to be appended to the VNet. Currently supported for PostgreSQL clusters only.
          example: /subscriptions/{subscription-id}/resourceGroups/{resource-group-name}/providers/Microsoft.Network/virtualNetworks/{virtual-network-name}
          x-insta-unchangeable: true
        storageNetwork:
          type: string
          description: 'The private network address block to be used for the storage network. This is only used for certain node sizes, currently limited to those which use Azure NetApp Files: for all other node sizes, this field should not be provided. The network must have a prefix length between /16 and /28, and must be part of a private address range.'
          example: 192.168.1.0/24
          x-insta-unchangeable: true
      description: ''
    PostgresqlInterDataCentreReplicationDetailsV2:
      required:
      - isPrimaryDataCentre
      type: object
      properties:
        isPrimaryDataCentre:
          type: boolean
          description: Is this Data centre considered to be the primary (only required if multiple data centres defined).
          example: true
          x-insta-unchangeable: true
      description: Defines data replication configuration within a Data centre
    PgBouncerDetailsV2:
      required:
      - pgBouncerVersion
      - poolMode
      type: object
      properties:
        pgBouncerVersion:
          pattern: '[0-9]+\.[0-9]+\.[0-9]+'
          type: string
          description: 'Version of Pg Bouncer to run on the cluster. Available versions: <ul> <li>`1.26.0`</li> </ul>'
          example: 1.2.3
          x-insta-unchangeable: true
        poolMode:
          $ref: '#/components/schemas/PgBouncerPoolModeEnumV2'
      description: Defines PgBouncer configuration
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    NodeDetailsV2:
      type: object
      properties:
        nodeRoles:
          type: array
          description: The roles or purposes of the node. Useful for filtering for nodes that have a specific role.
          readOnly: true
          items:
            $ref: '#/components/schemas/NodeRolesV2'
        rack:
          type: string
          description: Rack name in which the node is located.
          readOnly: true
        nodeSize:
          type: string
          description: Size of the node.
          readOnly: true
        privateAddress:
          type: string
          description: Private IP address of the node.
          readOnly: true
          example: 10.131.60.142
        deletionTime:
          type: string
          description: Deletion time of the node as a UTC timestamp
          readOnly: true
          example: '2019-08-24T14:15:22Z'
        publicAddress:
          type: string
          description: Public IP address of the node.
          readOnly: true
          example: 52.0.5.140
        startTime:
          type: string
          description: Start time of the node as a UTC timestamp
          readOnly: true
          example: '2019-08-24T14:15:22Z'
        id:
          type: string
          description: ID of the node.
          readOnly: true
          example: 9a27373a-0451-4121-94ba-873fc441f313
        status:
          type: string
          description: Provisioning status of the node.
          readOnly: true
          example: RUNNING
      description: ''
    PostgresqlClusterSnapshotV2:
      type: object
      properties:
        clusterSnapshotId:
          type: string
          description: ''
          format: uuid
        createdTime:
          type: string
          description: ''
          format: date-time
          example: '2023-12-21T04:03:32Z'
        progress:
          type: number
          format: float
          example: 0.5
        state:
          type: string
          description: ''
          example: ACTIVE
          enum:
          - ACTIVE
          - COMPLETED
          - FAILED
          - DELETING
          - DELETED
      description: ''
      example:
      - clusterSnapshotId: a8c32b20-c8f0-11e7-abc4
        createdTime: '2023-12-21T04:03:32Z'
        progress: 0.5
        state: ACTIVE
      - clusterSnapshotId: 92873dse-c8f0-11e7-adw4
        createdTime: '2023-12-02T02:05:23Z'
        progress: 1
        state: COMPLETED
    ProviderTagV2:
      required:
      - key
      type: object
      properties:
        value:
          type: string
          description: Value of the custom tag.
          example: myTagValue
        key:
          type: string
          description: Key of the custom tag.
          example: myTagKey
          x-insta-unchangeable: true
      description: Custom tag for cloud provider resources.
    FsxFileSystemMappingV2:
      required:
      - fsxFileSystemId
      - rackName
      type: object
      properties:
        rackName:
          type: string
          description: The rack/availability zone name (e.g., 'us-east-1a').
          example: us-east-1a
        fsxFileSystemId:
          type: string
          description: The FSx File System ID (e.g., 'fs-0123456789abcdef0').
          example: fs-0123456789abcdef0
      description: A mapping of a rack name to an FSx File System ID for BYO FSx provisioning.
    CompatibleApplicationGroupV2:
      type: object
      properties:
        compatibleApplicationGroup:
          type: array
          description: List of application and its versions.
          items:
            $ref: '#/components/schemas/SingleApplicationVersionV2'
      description: Object containing a combination of addon applications and their versions compatible with a primary application version.
    TwoFactorDeleteSettingsV2:
      required:
      - confirmationEmail
      type: object
      properties:
        confirmationPhoneNumber:
          pattern: ^(?![\s])[\-\s\(\)\+0-9]*$
          type: string
          description: The phone number which will be contacted when the cluster is requested to be delete.
          x-terraform-computed: true
        confirmationEmail:
          pattern: ^(([\s]*[^<>()\[\]\\.,;:@\s"]+(\.[^<>()\[\]\\.,;:\s@"]+)*))@((\[\d{1,3}(\.\d{1,3}){3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}[\s]*))$
          type: string
          description: The email address which will be contacted when the cluster is requested to be deleted.
          x-terraform-computed: true
      description: ''
    ResizeSettingsV2:
      type: object
      properties:
        notifySupportContacts:
          type: boolean
          description: Setting this property to `true` will notify the Instaclustr Account's designated support contacts on resize completion.
          x-terraform-write-only: true
        downsizeAcknowledged:
          type: boolean
          description: Set to `true` when the user has acknowledged that this resize reduces resource capacity and may cause node instability.
          x-terraform-write-only: true
        concurrency:
          type: integer
          description: Number of concurrent nodes to resize during a resize operation.
          x-terraform-write-only: true
      description: Settings to determine how resize requests will be performed for the cluster.
    SlaTierV2:
      type: string
      description: SLA Tier of the cluster. Non-production clusters may receive lower priority support and reduced SLAs. Production tier is not available when using Developer class nodes. See [SLA Tier](https://www.instaclustr.com/support/documentation/useful-information/sla-tier/) for more information.
      example: NON_PRODUCTION
      enum:
      - PRODUCTION
      - NON_PRODUCTION
      x-terraform-force-new: true
    ApplicationVersionsV2:
      type: object
      properties:
        application:
          $ref: '#/components/schemas/ApplicationEnumV2'
        versions:
          type: array
          description: List of sematic versions.
          example:
          - 1.0.0
          - 1.0.1
          items:
            pattern: '[0-9]+\.[0-9]+\.[0-9]+'
            type: string
      description: Object containing a single application and its available versions.
    CloudProviderNodeSizesListV2:
      type: object
      properties:
        cloudProviderNodeSizes:
          type: array
          description: List of all compatible cloud provider node sizes.
          items:
            $ref: '#/components/schemas/CloudProviderNodeSizesV2'
      description: Object containing list of node sizes grouped by cloud provider.
    SingleApplicationVersionV2:
      type: object
      properties:
        application:
          $ref: '#/components/schemas/ApplicationEnumV2'
        version:
          type: string
          description: A sematic version.
          example: 1.0.0
      description: Object containing a single application and a version.
    CommonClusterBackupEventNodeEventV2:
      title: Root Type for CommonClusterBackupNodeEventV2
      type: object
      properties:
        start:
          type: number
          description: Timestamp of when the event was triggered
          example: 0.5
        progress:
          type: number
          description: Event progress [0..1]
          format: float
          example: 0.5
        end:
          type: number
          description: Timestamp of when the event was completed. Can be null.
          example: 1510585212265
        state:
          type: string
          description: State of the event
          example: ACTIVE
          enum:
          - ACTIVE
          - COMPLETED
          - FAILED
        type:
          type: string
          description: Type of event
          example: snapshot-upload
      description: ''
      example:
        end: 1510585212265
        progress: 0.5
        start: 1510585212265
        state: ACTIVE
        type: snapshot-upload
    CurrentClusterOperationStatusV2:
      type: string
      description: Indicates if the cluster is currently performing any restructuring operation such as being created or resized
      example: OPERATION_IN_PROGRESS
      enum:
      - NO_OPERATION
      - OPERATION_IN_PROGRESS
      - OPERATION_FAILED
      x-insta-tf-import-hidden: true
      x-terraform-field-status: true
    PostgresqlProviderAwsSettingsV2:
      type: object
      properties:
        ebsEncryptionKey:
          type: string
          description: ID of a KMS encryption key to encrypt data on nodes. KMS encryption key must be set in Cluster Resources through the Instaclustr Console before provisioning an encrypted Data Centre.
          format: uuid
          example: 9a27373a-0451-4121-94ba-873fc441f313
          x-insta-unchangeable: true
        addSecondaryCidrToVpc:
          type: boolean
          description: When true and a custom VPC is specified, the Data Centre's network will be associated as a secondary CIDR block to the VPC. The association will be removed when the Data Centre is deleted. Only valid when customVirtualNetworkId is set and fsxFileSystemMappings are provided for BYO FSx provisioning. Only applicable for PostgreSQL clusters.
          default: false
          x-insta-unchangeable: true
        customVirtualNetworkId:
          type: string
          description: VPC ID into which the Data Centre will be provisioned. The Data Centre's network allocation must match the IPv4 CIDR block of the specified VPC.
          x-insta-unchangeable: true
          x-terraform-computed: true
        storageNetwork:
          type: string
