openapi: 3.2.0
info:
  title: Instaclustr PostgreSQL Configuration V2 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged PostgreSQL Configuration V2 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: PostgreSQL Configuration V2
  description: Operations related to PostgreSQL configuration properties.
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/data-sources/postgresql_cluster/{clusterId}/configurations:
    parameters:
    - name: clusterId
      in: path
      description: ID of the PostgreSQL cluster.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    x-terraform-resource-name: configurations_v2
    get:
      tags:
      - PostgreSQL Configuration V2
      summary: Get cluster configurations
      description: Get a list of applied configurations for the specified cluster.
      responses:
        '200':
          description: Successfully retrieved a list of the configuration properties applied to the cluster.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostgresqlConfigurationPropertiesV2'
      operationId: getClusterManagementV2DataSourcesPostgresqlClusterByClusterIdConfigurations
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/postgresql/configurations/v2/:
    x-terraform-resource-name: postgresql_configuration_v2
    post:
      tags:
      - PostgreSQL Configuration V2
      summary: Create configuration
      description: Create a cluster configuration with the provided input. If the specified configuration has not been set, it will be created. Cluster nodes will need to be manually reloaded to apply configuration changes.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostgresqlConfigurationPropertyV2'
        required: true
      responses:
        '202':
          description: Configuration property created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresqlConfigurationPropertyV2'
              example:
                clusterId: b997a00d-5bd4-4774-9bd7-5c0ad6189246
                id: b997a00d-5bd4-4774-9bd7-5c0ad6189246|idle_in_transaction_session_timeout
                name: idle_in_transaction_session_timeout
                value: '1'
        '404':
          description: PostgreSQL cluster not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
      x-codegen-request-body-name: body
      operationId: postClusterManagementV2ResourcesApplicationsPostgresqlConfigurationsV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/postgresql/configurations/v2/{configurationId}:
    parameters:
    - name: configurationId
      in: path
      description: 'Instaclustr identifier for the PostgreSQL configuration property. The value of this property has the form: [cluster-id]|[configuration_name]'
      required: true
      style: simple
      explode: false
      schema:
        type: string
    get:
      tags:
      - PostgreSQL Configuration V2
      summary: Get configuration
      description: Get a configuration applied to the cluster.
      responses:
        '202':
          description: configuration property successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresqlConfigurationPropertyV2'
              example:
                clusterId: b997a00d-5bd4-4774-9bd7-5c0ad6189246
                id: b997a00d-5bd4-4774-9bd7-5c0ad6189246|idle_in_transaction_session_timeout
                name: idle_in_transaction_session_timeout
                value: '1'
        '404':
          description: PostgreSQL cluster not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
      operationId: getClusterManagementV2ResourcesApplicationsPostgresqlConfigurationsV2ByConfigurationId
      x-operation-id-source: derived
    put:
      tags:
      - PostgreSQL Configuration V2
      summary: Update configuration
      description: Update an applied configuration to the cluster. Cluster nodes will need to be manually reloaded to apply configuration changes.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostgresqlConfigurationPropertyUpdateV2'
        required: true
      responses:
        '202':
          description: configuration property successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresqlConfigurationPropertyV2'
              example:
                clusterId: b997a00d-5bd4-4774-9bd7-5c0ad6189246
                id: b997a00d-5bd4-4774-9bd7-5c0ad6189246|idle_in_transaction_session_timeout
                name: idle_in_transaction_session_timeout
                value: '1'
        '404':
          description: PostgreSQL cluster not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
      x-codegen-request-body-name: body
      operationId: putClusterManagementV2ResourcesApplicationsPostgresqlConfigurationsV2ByConfigurationId
      x-operation-id-source: derived
    delete:
      tags:
      - PostgreSQL Configuration V2
      summary: Reset a configuration
      description: Restore an altered configuration property to its default value. Cluster nodes will need to be manually reloaded to apply configuration changes.
      responses:
        '204':
          description: Successfully reset the cluster configuration.
          content: {}
        '404':
          description: PostgreSQL cluster not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
      operationId: deleteClusterManagementV2ResourcesApplicationsPostgresqlConfigurationsV2ByConfigurationId
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
    PostgresqlConfigurationPropertyUpdateV2:
      required:
      - value
      type: object
      properties:
        value:
          type: string
          description: Value of the configuration property.
      description: PostgreSQL configuration property. Cluster nodes will need to be manually [reloaded](https://www.instaclustr.com/support/documentation/postgresql/postgresql-operations/reloading-a-node/) to apply configuration changes.
      example:
        value: '1'
    PostgresqlConfigurationPropertiesV2:
      required:
      - configurationProperties
      type: object
      properties:
        clusterId:
          type: string
          description: ID of the PostgreSQL cluster
          x-terraform-id: true
        configurationProperties:
          type: array
          description: List of configuration properties
          items:
            $ref: '#/components/schemas/PostgresqlConfigurationPropertyV2'
          x-terraform-ignore-order: true
      description: PostgreSQL configuration properties
      example:
        clusterId: b997a00d-5bd4-4774-9bd7-5c0ad6189246
        configurationProperties:
        - clusterId: b997a00d-5bd4-4774-9bd7-5c0ad6189246
          name: 'statement_timeout  '
          value: '1'
        - clusterId: b997a00d-5bd4-4774-9bd7-5c0ad6189246
          name: idle_in_transaction_session_timeout
          value: '1'
    PostgresqlConfigurationPropertyV2:
      required:
      - clusterId
      - name
      - value
      type: object
      properties:
        name:
          type: string
          description: Name of the configuration property.
          x-terraform-force-new: true
        clusterId:
          type: string
          description: Id of the PostgreSQL cluster.
          x-terraform-force-new: true
        id:
          type: string
          description: 'Instaclustr identifier for the PostgreSQL configuration property. The value of this property has the form: [cluster-id]|[configuration_name]'
          readOnly: true
        value:
          type: string
          description: Value of the configuration property.
      description: PostgreSQL configuration property. Cluster nodes will need to be manually [reloaded](https://www.instaclustr.com/support/documentation/postgresql/postgresql-operations/reloading-a-node/) to apply configuration changes.
      example:
        clusterId: b997a00d-5bd4-4774-9bd7-5c0ad6189246
        name: idle_in_transaction_session_timeout
        value: '1'
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
x-refined-from:
- instaclustr-current-openapi.json
- instaclustr-openapi.yml
