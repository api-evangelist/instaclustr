openapi: 3.2.0
info:
  title: Instaclustr Azure Vnet Peer V2 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Azure Vnet Peer V2 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Azure Vnet Peer V2
  description: Operations related to Azure Vnet Peering with Cluster Data Centers.
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/data-sources/providers/azure/vnet-peers/v2:
    x-terraform-resource-name: azure_vnet_peers_v2
    get:
      tags:
      - Azure Vnet Peer V2
      summary: List all Azure VNet Peering requests
      responses:
        '200':
          description: Successfully retrieved Azure VNet Peering requests.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountAzureVnetPeersV2'
      operationId: getClusterManagementV2DataSourcesProvidersAzureVnetPeersV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/providers/azure/vnet-peers/v2:
    x-terraform-resource-name: azure_vnet_peer_v2
    post:
      tags:
      - Azure Vnet Peer V2
      summary: Create Azure Vnet Peering Request
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AzureVnetPeerV2'
        required: true
      responses:
        '202':
          description: Azure Vnet Peering request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureVnetPeerV2'
              example:
                cdcId: f3eab841-6952-430d-ba90-1bfc3f15da10
                dataCentreResourceGroup: f3eab841-6952-430d-ba90-1bfc3f15da10
                dataCentreSubscriptionId: 8715641f-79a1-4573-9915-132e0e163c29
                dataCentreVirtualNetworkName: f3eab841-6952-430d-ba90-1bfc3f15da10
                id: cdb99c24-2918-437d-91f1-c542513702e8
                name: null,
                peerAdObjectId: 00000000-0000-0000-0000-000000000000
                peerResourceGroup: example-resource-group-123
                peerSubnets:
                - 10.1.0.0/16
                - 10.2.0.0/16
                peerSubscriptionId: 00000000-0000-0000-0000-000000000000
                peerVirtualNetworkName: network-aabb-1122
                statusCode: GENESIS
      x-codegen-request-body-name: body
      operationId: postClusterManagementV2ResourcesProvidersAzureVnetPeersV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/providers/azure/vnet-peers/v2/{vpcPeerId}:
    parameters:
    - name: vpcPeerId
      in: path
      description: ID of the VPC Peering Connection
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Azure Vnet Peer V2
      summary: Get Azure Vnet Peering Connection info
      description: Fetches the details for a given Azure Vnet Peering Connection.
      responses:
        '200':
          description: Azure Vnet Peering Connection info retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureVnetPeerV2'
              example:
                cdcId: f3eab841-6952-430d-ba90-1bfc3f15da10
                dataCentreResourceGroup: f3eab841-6952-430d-ba90-1bfc3f15da10
                dataCentreSubscriptionId: 8715641f-79a1-4573-9915-132e0e163c29
                dataCentreVirtualNetworkName: f3eab841-6952-430d-ba90-1bfc3f15da10
                id: cdb99c24-2918-437d-91f1-c542513702e8
                name: null,
                peerAdObjectId: 00000000-0000-0000-0000-000000000000
                peerResourceGroup: example-resource-group-123
                peerSubnets:
                - 10.1.0.0/16
                - 10.2.0.0/16
                peerSubscriptionId: 00000000-0000-0000-0000-000000000000
                peerVirtualNetworkName: network-aabb-1122
                statusCode: GENESIS
        '404':
          description: VPC Peering Connection not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: getClusterManagementV2ResourcesProvidersAzureVnetPeersV2ByVpcPeerId
      x-operation-id-source: derived
    delete:
      tags:
      - Azure Vnet Peer V2
      summary: Delete Azure Vnet Peering Connection
      responses:
        '204':
          description: Azure Vnet Peering request deleted
          content: {}
        '404':
          description: VPC Peering Connection not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: deleteClusterManagementV2ResourcesProvidersAzureVnetPeersV2ByVpcPeerId
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    AzureVnetPeerV2:
      title: Root Type for AzureVnetPeerV2
      required:
      - cdcId
      - peerResourceGroup
      - peerSubnets
      - peerSubscriptionId
      - peerVirtualNetworkName
      type: object
      properties:
        dataCentreResourceGroup:
          type: string
          description: Resource Group Name of the Data Centre Virtual Network.
          readOnly: true
          example: My Azure Vnet Peering connection
        peerVirtualNetworkName:
          type: string
          description: The name of the VPC Network you wish to peer to.
          example: network-aabb1122
          x-terraform-force-new: true
        peerSubnets:
          type: array
          description: The subnets for the peering VPC.
          example:
          - 10.1.0.0/16
          - 10.2.0.0/16
          items:
            type: string
          x-terraform-force-new: true
          x-terraform-ignore-order: true
        peerResourceGroup:
          type: string
          description: Resource Group Name of the Virtual Network.
          example: My Azure Vnet Peering connection
          x-terraform-force-new: true
        failureReason:
          type: string
          description: Reason for Peering Connection Failure.
          readOnly: true
          example: An IP range in the peer network (10.5.128.0/18) overlaps with an IP range in the local network (10.5.128.0/18)
        name:
          type: string
          description: Name of the Vpc Peering Connection.
          readOnly: true
          example: instaclustr-project-123
        peerAdObjectId:
          type: string
          description: ID of the Active Directory Object to give peering permissions to, required for cross subscription peering.
          example: 00000000-0000-0000-0000-000000000000
          x-terraform-force-new: true
        id:
          type: string
          description: ID of the VPC peering connection.
          readOnly: true
          example: 068c447e-8475-49b2-974b-ca1c91702ed4
        dataCentreSubscriptionId:
          type: string
          description: Subscription ID of the Data Centre Virtual Network.
          readOnly: true
          example: 00000000-0000-0000-0000-000000000000
        peerSubscriptionId:
          type: string
          description: Subscription ID of the Virtual Network.
          example: 00000000-0000-0000-0000-000000000000
          x-terraform-force-new: true
        statusCode:
          type: string
          description: Status of the VPC Peering Connection. Values can be `GENESIS`, `PROVISIONING`, `FAILED`, `INACTIVE`, `CONNECTED` or `UNKNOWN`.
          readOnly: true
          example: active
        cdcId:
          type: string
          description: ID of the Cluster Data Centre.
          format: uuid
          example: aabc665c-8916-40ae-978c-96d39a3a1364
          x-terraform-force-new: true
        dataCentreVirtualNetworkName:
          type: string
          description: The name of the Data Centre Virtual Network.
          readOnly: true
          example: network-aabb1122
      description: Definition of an Azure Virtual Network Peering request to allow privately routed connections to a target data centre.
      example:
        cdcId: f3eab841-6952-430d-ba90-1bfc3f15da10
        peerAdObjectId: 00000000-0000-0000-0000-000000000000
        peerResourceGroup: example-resource-group-123
        peerSubnets:
        - 10.1.0.0/16
        - 10.2.0.0/16
        peerSubscriptionId: 00000000-0000-0000-0000-000000000000
        peerVirtualNetworkName: network-aabb-1122
    AzureVnetPeerSummaryV2:
      title: Root Type for AzureVnetPeerSummaryV2
      required:
      - cdcId
      - peerResourceGroup
      - peerSubnets
      - peerSubscriptionId
      - peerVirtualNetworkName
      type: object
      properties:
        dataCentreResourceGroup:
          type: string
          description: Resource Group Name of the Data Centre Virtual Network.
          readOnly: true
          example: My Azure Vnet Peering connection
        peerVirtualNetworkName:
          type: string
          description: The name of the VPC Network you wish to peer to.
          example: network-aabb1122
          x-terraform-force-new: true
        peerSubnets:
          type: array
          description: The subnets for the peering VPC.
          example:
          - 10.1.0.0/16
          - 10.2.0.0/16
          items:
            type: string
          x-terraform-force-new: true
          x-terraform-ignore-order: true
        name:
          type: string
          description: Name of the Vpc Peering Connection.
          readOnly: true
          example: instaclustr-project-123
        peerAdObjectId:
          type: string
          description: ID of the Active Directory Object to give peering permissions to, required for cross subscription peering.
          example: 00000000-0000-0000-0000-000000000000
          x-terraform-force-new: true
        id:
          type: string
          description: ID of the VPC peering connection.
          readOnly: true
          example: 068c447e-8475-49b2-974b-ca1c91702ed4
        dataCentreSubscriptionId:
          type: string
          description: Subscription ID of the Data Centre Virtual Network.
          readOnly: true
          example: 00000000-0000-0000-0000-000000000000
        peerResourceGroup:
          type: string
          description: Resource Group Name of the Virtual Network.
          example: My Azure Vnet Peering connection
          x-terraform-force-new: true
        peerSubscriptionId:
          type: string
          description: Subscription ID of the Virtual Network.
          example: 00000000-0000-0000-0000-000000000000
          x-terraform-force-new: true
        cdcId:
          type: string
          description: ID of the Cluster Data Centre.
          format: uuid
          example: aabc665c-8916-40ae-978c-96d39a3a1364
          x-terraform-force-new: true
        dataCentreVirtualNetworkName:
          type: string
          description: The name of the Data Centre Virtual Network.
          readOnly: true
          example: network-aabb1122
      description: ''
    AccountAzureVnetPeersV2:
      type: object
      properties:
        accountId:
          type: string
          description: UUID of the Instaclustr Account.
          x-terraform-id: true
        peeringRequests:
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/AzureVnetPeerSummaryV2'
      description: A listable data source of all Azure Virtual Network Peering requests in an Instaclustr Account.
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
