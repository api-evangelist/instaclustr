tags:
- name: AWS Prefix List Firewall Rules V1
  description: Operations related to bulk AWS prefix list firewall rule operations for a cluster data centre
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/resources/providers/aws/cluster-data-centre-prefix-list-firewall-rules/v1:
    x-terraform-resource-name: aws_cluster_data_centre_prefix_list_firewall_rules_v1
    post:
      tags:
      - AWS Prefix List Firewall Rules V1
      summary: Add multiple AWS prefix list firewall rules in the cluster data centre
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterDataCentreAllAwsPrefixListFirewallRulesV1'
        required: true
      responses:
        '202':
          description: Successfully added AWS prefix list firewall rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterDataCentreAllAwsPrefixListFirewallRulesV1'
              example:
                clusterDataCentreId: 91346037-b969-4c4d-8112-59e1d2aa67e9
                firewallRules:
                - deferredReason: ''
                  id: 44ff0751-ea69-4154-810a-99aedc6d23fd
                  prefixListId: pl-903004f01234567ab
                  type: CASSANDRA_CQL
                - deferredReason: ''
                  id: 361fc2b9-0acf-49d3-8cac-a703d2ef9cd2
                  prefixListId: pl-903004f61234567cd
                  type: CASSANDRA_CQL
                id: 91346037-b969-4c4d-8112-59e1d2aa67e9
                status: RUNNING
          x-terraform-resource-poll-completed-statuses: RUNNING
          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: GENESIS,PROVISIONING
        '409':
          description: A duplicate or matching firewall rule exists for the prefix list in the cluster data centre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
      x-codegen-request-body-name: body
      x-terraform-resource-timeout: 99999m
      operationId: postClusterManagementV2ResourcesProvidersAwsClusterDataCentrePrefixListFirewallRulesV1
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/providers/aws/cluster-data-centre-prefix-list-firewall-rules/v1/{clusterDataCentreId}:
    parameters:
    - name: clusterDataCentreId
      in: path
      description: ID of the cluster data centre
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - AWS Prefix List Firewall Rules V1
      summary: Get AWS prefix list firewall rules for the cluster data centre
      responses:
        '200':
          description: Retrieved AWS prefix list firewall rules for the cluster data centre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterDataCentreAllAwsPrefixListFirewallRulesV1'
              example:
                clusterDataCentreId: 91346037-b969-4c4d-8112-59e1d2aa67e9
                firewallRules:
                - deferredReason: ''
                  id: 44ff0751-ea69-4154-810a-99aedc6d23fd
                  prefixListId: pl-903004f01234567ab
                  type: CASSANDRA_CQL
                - deferredReason: ''
                  id: 361fc2b9-0acf-49d3-8cac-a703d2ef9cd2
                  prefixListId: pl-903004f61234567cd
                  type: CASSANDRA_CQL
                id: 91346037-b969-4c4d-8112-59e1d2aa67e9
                status: RUNNING
        '404':
          description: Cluster data centre not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: getClusterManagementV2ResourcesProvidersAwsClusterDataCentrePrefixListFirewallRulesV1ByClusterDataCentreId
      x-operation-id-source: derived
    put:
      tags:
      - AWS Prefix List Firewall Rules V1
      summary: Update multiple AWS prefix list firewall rules in the cluster data centre
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterDataCentreAllAwsPrefixListFirewallRulesV1'
        required: true
      responses:
        '202':
          description: Successfully updated AWS prefix list firewall rules for the cluster data centre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterDataCentreAllAwsPrefixListFirewallRulesV1'
              example:
                clusterDataCentreId: 91346037-b969-4c4d-8112-59e1d2aa67e9
                firewallRules:
                - deferredReason: ''
                  id: 44ff0751-ea69-4154-810a-99aedc6d23fd
                  prefixListId: pl-903004f01234567ab
                  type: CASSANDRA_CQL
                - deferredReason: ''
                  id: 361fc2b9-0acf-49d3-8cac-a703d2ef9cd2
                  prefixListId: pl-903004f61234567cd
                  type: CASSANDRA_CQL
                id: 91346037-b969-4c4d-8112-59e1d2aa67e9
                status: RUNNING
          x-terraform-resource-poll-completed-statuses: RUNNING
          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: GENESIS,PROVISIONING
        '404':
          description: Cluster data centre not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
        '409':
          description: A duplicate or matching firewall rule exists for the prefix list in the cluster data centre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
      x-codegen-request-body-name: body
      x-terraform-resource-timeout: 99999m
      operationId: putClusterManagementV2ResourcesProvidersAwsClusterDataCentrePrefixListFirewallRulesV1ByClusterDataCentreId
      x-operation-id-source: derived
    delete:
      tags:
      - AWS Prefix List Firewall Rules V1
      summary: Delete AWS prefix list firewall rules for the cluster data centre
      responses:
        '204':
          description: AWS prefix list firewall rules for the cluster data centre successfully deleted
          content: {}
        '404':
          description: Cluster data centre not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: deleteClusterManagementV2ResourcesProvidersAwsClusterDataCentrePrefixListFirewallRulesV1ByClusterDataCentreId
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    ClusterDataCentreAllAwsPrefixListFirewallRuleV1:
      required:
      - prefixListId
      - type
      type: object
      properties:
        deferredReason:
          type: string
          description: The reason (if needed) for the deferred status of the AWS prefix list firewall rule.
          readOnly: true
          example: RETRY_LATER
        prefixListId:
          type: string
          description: The prefix list ID of the AWS prefix list firewall rule.
          example: pl-01abc2345defg6789
          x-insta-unchangeable: true
        id:
          type: string
          description: ID of the AWS prefix list firewall rule.
          format: uuid
          readOnly: true
          example: 47ac0d3e-1b2f-4e8a-9c3d-5e6f708192a4
        type:
          $ref: '#/components/schemas/ClusterAllFirewallRuleTypesV2'
      description: Definition of an AWS Prefix List based firewall rule to be applied to a cluster data centre. Only supported for Bring Your Own Cloud (BYOC) data centres.
      example:
        prefixListId: pl-01abc2345defg6789
        type: CASSANDRA_CQL
    ClusterAllFirewallRuleTypesV2:
      type: string
      description: The type of firewall rule.
      example: CASSANDRA_CQL
      enum:
      - APACHE_ZOOKEEPER
      - CADENCE
      - CADENCE_GRPC
      - CADENCE_HTTP_API
      - CADENCE_WEB
      - CASSANDRA
      - CASSANDRA_CQL
      - CLICKHOUSE
      - CLICKHOUSE_WEB
      - ELASTICSEARCH
      - KAFKA
      - KAFKA_CONNECT
      - KAFKA_ENCRYPTION
      - KAFKA_MTLS
      - KAFKA_NO_ENCRYPTION
      - KAFKA_PRIVATE_SASL_PLAINTEXT_LISTENER
      - KAFKA_PUBLIC_SASL_PLAINTEXT_LISTENER
      - KAFKA_PRIVATE_PLAINTEXT_LISTENER
      - KAFKA_PUBLIC_PLAINTEXT_LISTENER
      - KAFKA_PRIVATE_SSL_LISTENER
      - KAFKA_PUBLIC_SSL_LISTENER
      - KAFKA_REST_PROXY
      - KAFKA_SCHEMA_REGISTRY
      - KARAPACE_REST_PROXY
      - KARAPACE_SCHEMA_REGISTRY
      - OPENSEARCH
      - OPENSEARCH_DASHBOARDS
      - PGBOUNCER
      - POSTGRESQL
      - REDIS
      - VALKEY
      - SEARCH_DASHBOARDS
      - SECURE_APACHE_ZOOKEEPER
      - SPARK
      - SPARK_JOBSERVER
      - SHOTOVER_PROXY
      - MCP_GATEWAY
      - KAFKA_DISKLESS
      x-insta-unchangeable: true
    ClusterDataCentreAllAwsPrefixListFirewallRulesV1:
      required:
      - clusterDataCentreId
      - firewallRules
      type: object
      properties:
        clusterDataCentreId:
          type: string
          description: ID of the cluster data centre
          format: uuid
          example: 91346037-b969-4c4d-8112-59e1d2aa67e9
          x-insta-unchangeable: true
        id:
          type: string
          description: ID of the cluster data centre prefix list firewall rules resource
          format: uuid
          readOnly: true
          example: 91346037-b969-4c4d-8112-59e1d2aa67e9
        firewallRules:
          type: array
          description: AWS prefix list firewall rules for the cluster data centre
          items:
            $ref: '#/components/schemas/ClusterDataCentreAllAwsPrefixListFirewallRuleV1'
          x-terraform-field-name: firewall_rule
          x-terraform-ignore-order: true
        status:
          type: string
          description: Aggregate status of the AWS prefix list firewall rules.
          readOnly: true
          example: RUNNING
          x-terraform-field-status: true
      description: A resource containing all AWS Prefix List based firewall rules in an Instaclustr managed cluster data centre. Only supported for Bring Your Own Cloud (BYOC) data centres.
      example:
        clusterDataCentreId: 91346037-b969-4c4d-8112-59e1d2aa67e9
        firewallRules:
        - prefixListId: pl-903004f01234567ab
          type: CASSANDRA_CQL
        - prefixListId: pl-903004f61234567cd
          type: CASSANDRA_CQL
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
