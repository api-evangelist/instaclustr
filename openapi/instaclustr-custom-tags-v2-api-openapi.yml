openapi: 3.2.0
info:
  title: Instaclustr Custom Tags V2 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Custom Tags V2 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Custom Tags V2
  description: Operations related to managing custom tags
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/operations/clusters/v2/{clusterId}/tags/v2:
    parameters:
    - name: clusterId
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    patch:
      tags:
      - Custom Tags V2
      summary: Manage custom tags for all data centres in the cluster
      description: Create, update and delete custom tags for all data centres in the cluster using the JSON Merge Patch format.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderTagListV2'
        required: true
      responses:
        '202':
          description: Patch request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonClusterCustomTagsV2'
        '400':
          description: Invalid patch request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
        '404':
          description: No data centre found in the cluster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      x-codegen-request-body-name: body
      operationId: patchClusterManagementV2OperationsClustersV2ByClusterIdTagsV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    CommonDataCentreCustomTagsV2:
      required:
      - id
      - name
      - tags
      type: object
      properties:
        name:
          type: string
          description: ''
        id:
          type: string
          description: ''
        tags:
          type: array
          description: List of tags applied to the Data Centre. Tags are metadata labels which allow you to identify, categorize and filter clusters. This can be useful for grouping together clusters into applications, environments, or any category that you require.
          items:
            $ref: '#/components/schemas/ProviderTagV2'
      description: ''
      example:
        id: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
        name: AWS_VPC_US_EAST_1
        tags:
        - key: myTagKey_1
          value: myTagValue_1
        - key: myTagKey_2
          value: myTagValue_2
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    ProviderTagV2:
      required:
      - key
      type: object
      properties:
        value:
          type: string
          description: Value of the custom tag.
          example: myTagValue
        key:
          type: string
          description: Key of the custom tag.
          example: myTagKey
          x-insta-unchangeable: true
      description: Custom tag for cloud provider resources.
    CommonClusterCustomTagsV2:
      required:
      - dataCentres
      - id
      type: object
      properties:
        dataCentres:
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/CommonDataCentreCustomTagsV2'
        id:
          type: string
          description: ''
      description: ''
      example:
        dataCentres:
        - id: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
          name: AWS_VPC_US_EAST_1
          tags:
          - key: myTagKey_1
            value: myTagValue_1
          - key: myTagKey_2
            value: myTagValue_2
        id: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
    ProviderTagListV2:
      required:
      - tags
      type: object
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ProviderTagV2'
      description: List of custom tags.
      example:
        tags:
        - key: myTagKey_1
          value: myTagValue_1
        - key: myTagKey_2
          value: myTagValue_2
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
