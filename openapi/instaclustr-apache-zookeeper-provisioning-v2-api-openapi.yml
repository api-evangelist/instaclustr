            $ref: '#/components/schemas/ApplicationVersionsV2'
      description: Object containing all applications and their versions relating to a primary application.
    CdcNetworkDetailsV2:
      type: object
      properties:
        cidr:
          type: string
          description: Network CIDR in notation, for example 10.0.0.0/16.
          readOnly: true
          example: 10.1.0.0/16
        primary:
          type: boolean
          description: True when this entry is the data centre primary network.
          readOnly: true
          example: false
        status:
          type: string
          description: Provisioning status of the network registration.
          readOnly: true
          example: RUNNING
      description: A network CIDR associated with the data centre (primary or expanded secondary).
    ProviderAwsSettingsV2:
      type: object
      properties:
        ebsEncryptionKey:
          type: string
          description: ID of a KMS encryption key to encrypt data on nodes. KMS encryption key must be set in Cluster Resources through the Instaclustr Console before provisioning an encrypted Data Centre.
          format: uuid
          example: 9a27373a-0451-4121-94ba-873fc441f313
          x-insta-unchangeable: true
        customVirtualNetworkId:
          type: string
          description: VPC ID into which the Data Centre will be provisioned. The Data Centre's network allocation must match the IPv4 CIDR block of the specified VPC.
          x-insta-unchangeable: true
          x-terraform-computed: true
        storageNetwork:
          type: string
          description: 'The private network address block to be used for the storage network. This is only used for certain node sizes, currently limited to those which use AWS FSx ONTAP: for all other node sizes, this field should not be provided. The network must have a prefix length between /16 and /28, and must be part of a private address range.'
          example: 192.168.1.0/24
          x-insta-unchangeable: true
      description: ''
