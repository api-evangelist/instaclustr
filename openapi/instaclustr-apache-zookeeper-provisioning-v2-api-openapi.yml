openapi: 3.2.0
info:
  title: Instaclustr Apache Zookeeper Provisioning V2 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Apache Zookeeper Provisioning V2 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Apache Zookeeper Provisioning V2
  description: ''
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/data-sources/applications/zookeeper/compatible-node-sizes/v2/:
    get:
      tags:
      - Apache Zookeeper Provisioning V2
      summary: List compatible node sizes for Zookeeper
      responses:
        '200':
          description: Successfully retrieved compatible node sizes for Zookeeper.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CloudProviderNodeSizesListV2'
      operationId: getClusterManagementV2DataSourcesApplicationsZookeeperCompatibleNodeSizesV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/data-sources/applications/zookeeper/versions/v2/:
    get:
      tags:
      - Apache Zookeeper Provisioning V2
      summary: List all Zookeeper versions
      responses:
        '200':
          description: Successfully retrieved versions for Zookeeper.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationVersionListV2'
      operationId: getClusterManagementV2DataSourcesApplicationsZookeeperVersionsV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/operations/applications/zookeeper/clusters/v2/{clusterId}/certificate/v2/:
    parameters:
    - name: clusterId
      in: path
      description: ID of the cluster
      required: true
      style: simple
      explode: false
      schema:
        type: string
    get:
      tags:
      - Apache Zookeeper Provisioning V2
      summary: Download Zookeeper cluster X.509 Certificate Authority certificates
      description: Zookeeper cluster certificates are returned as a .zip file. The file contains an X.509 cluster Certificate Authority certificate in JKS file, an X.509 cluster Certificate Authority certificate in PEM-encoded (ASCII) format, and an X.509 cluster Certificate Authority certificate in DER-encoded (binary) format.
      responses:
        '200':
          description: Successfully create the Zookeeper cluster's certificate
          content:
            application/zip:
              schema:
                type: string
                format: binary
      operationId: getClusterManagementV2OperationsApplicationsZookeeperClustersV2ByClusterIdCertificateV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/zookeeper/clusters/v2:
    x-terraform-resource-name: zookeeper_cluster_v2
    post:
      tags:
      - Apache Zookeeper Provisioning V2
      summary: Create a Zookeeper cluster
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApacheZookeeperClusterV2'
        required: true
      responses:
        '202':
          description: Zookeeper Cluster provisioning requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApacheZookeeperClusterV2'
              example:
                currentClusterOperationStatus: NO_OPERATION
                dataCentres:
                - clientToServerEncryption: true
                  cloudProvider: AWS_VPC
                  id: 94c1ad54-c6f1-4f2e-8634-be9f5fb47fad
                  name: MyTestDataCentre1
                  network: 10.0.0.0/16
                  nodeSize: ZKR-PRD-m5d.large-75
                  nodes:
                  - id: 94c1ad54-c6f1-4f2e-8634-be9f5fb47fad
                    nodeRoles:
                    - APACHE_ZOOKEEPER
                    nodeSize: ZKR-PRD-m5d.large-75
                    privateAddress: 10.0.5.23
                    publicAddress: 24.135.55.176
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: cc317853-be79-4100-898f-c12e4610a892
                    nodeRoles:
                    - APACHE_ZOOKEEPER
                    nodeSize: ZKR-PRD-m5d.large-75
                    privateAddress: 10.0.128.45
                    publicAddress: 193.146.159.238
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: b401b5bb-8a6f-4aa7-99c4-12fe445941c3
                    nodeRoles:
                    - APACHE_ZOOKEEPER
                    nodeSize: ZKR-PRD-m5d.large-75
                    privateAddress: 10.0.200.78
                    publicAddress: 108.21.43.134
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  numberOfNodes: 3
                  region: US_EAST_1
                  status: RUNNING
                id: 4650aa98-e894-4675-9614-558915d5837a
                name: MyZookeeperCluster
                privateNetworkCluster: false
                slaTier: PRODUCTION
                status: RUNNING
                zookeeperVersion: '[x.y.z]'
          x-terraform-resource-poll-completed-statuses: NO_OPERATION
          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: OPERATION_IN_PROGRESS
      x-codegen-request-body-name: body
      x-terraform-resource-timeout: 99999m
      operationId: postClusterManagementV2ResourcesApplicationsZookeeperClustersV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/zookeeper/clusters/v2/{clusterId}:
    parameters:
    - name: clusterId
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Apache Zookeeper Provisioning V2
      summary: Get Zookeeper cluster details
      responses:
        '200':
          description: Zookeeper cluster details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApacheZookeeperClusterV2'
              example:
                currentClusterOperationStatus: NO_OPERATION
                dataCentres:
                - clientToServerEncryption: true
                  cloudProvider: AWS_VPC
                  id: 94c1ad54-c6f1-4f2e-8634-be9f5fb47fad
                  name: MyTestDataCentre1
                  network: 10.0.0.0/16
                  nodeSize: ZKR-PRD-m5d.large-75
                  nodes:
                  - id: 94c1ad54-c6f1-4f2e-8634-be9f5fb47fad
                    nodeRoles:
                    - APACHE_ZOOKEEPER
                    nodeSize: ZKR-PRD-m5d.large-75
                    privateAddress: 10.0.5.23
                    publicAddress: 24.135.55.176
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: cc317853-be79-4100-898f-c12e4610a892
                    nodeRoles:
                    - APACHE_ZOOKEEPER
                    nodeSize: ZKR-PRD-m5d.large-75
                    privateAddress: 10.0.128.45
                    publicAddress: 193.146.159.238
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: b401b5bb-8a6f-4aa7-99c4-12fe445941c3
                    nodeRoles:
                    - APACHE_ZOOKEEPER
                    nodeSize: ZKR-PRD-m5d.large-75
                    privateAddress: 10.0.200.78
                    publicAddress: 108.21.43.134
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  numberOfNodes: 3
                  region: US_EAST_1
                  status: RUNNING
                id: 4650aa98-e894-4675-9614-558915d5837a
                name: MyZookeeperCluster
                privateNetworkCluster: false
                slaTier: PRODUCTION
                status: RUNNING
                zookeeperVersion: '[x.y.z]'
      operationId: getClusterManagementV2ResourcesApplicationsZookeeperClustersV2ByClusterId
      x-operation-id-source: derived
    delete:
      tags:
      - Apache Zookeeper Provisioning V2
      summary: Delete cluster
      description: Delete an active cluster.
      responses:
        '204':
          description: Cluster delete requested.
          content: {}
      x-terraform-resource-poll-enabled: true
      operationId: deleteClusterManagementV2ResourcesApplicationsZookeeperClustersV2ByClusterId
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    SlaTierV2:
      type: string
      description: SLA Tier of the cluster. Non-production clusters may receive lower priority support and reduced SLAs. Production tier is not available when using Developer class nodes. See [SLA Tier](https://www.instaclustr.com/support/documentation/useful-information/sla-tier/) for more information.
      example: NON_PRODUCTION
      enum:
      - PRODUCTION
      - NON_PRODUCTION
      x-terraform-force-new: true
    ProviderAzureSettingsV2:
      type: object
      properties:
        resourceGroup:
          type: string
          description: The name of the Azure Resource Group into which the Data Centre will be provisioned.
          x-insta-unchangeable: true
        customVirtualNetworkId:
          type: string
          description: VNet ID into which the Data Centre will be provisioned. The VNet must have an available address space for the Data Centre's network allocation to be appended to the VNet. Currently supported for PostgreSQL clusters only.
          example: /subscriptions/{subscription-id}/resourceGroups/{resource-group-name}/providers/Microsoft.Network/virtualNetworks/{virtual-network-name}
          x-insta-unchangeable: true
        storageNetwork:
          type: string
          description: 'The private network address block to be used for the storage network. This is only used for certain node sizes, currently limited to those which use Azure NetApp Files: for all other node sizes, this field should not be provided. The network must have a prefix length between /16 and /28, and must be part of a private address range.'
          example: 192.168.1.0/24
          x-insta-unchangeable: true
      description: ''
    ApplicationVersionsV2:
      type: object
      properties:
        application:
          $ref: '#/components/schemas/ApplicationEnumV2'
        versions:
          type: array
          description: List of sematic versions.
          example:
          - 1.0.0
          - 1.0.1
          items:
            pattern: '[0-9]+\.[0-9]+\.[0-9]+'
            type: string
      description: Object containing a single application and its available versions.
    CloudProviderEnumV2:
      type: string
      description: Name of a cloud provider service.
      example: AWS_VPC
      enum:
      - AWS_VPC
      - GCP
      - AZURE
      - AZURE_AZ
      - ONPREMISES
      x-insta-unchangeable: true
    ApacheZookeeperClusterV2:
      required:
      - dataCentres
      - name
      - privateNetworkCluster
      - slaTier
      - zookeeperVersion
      type: object
      properties:
        dataCentres:
          maxItems: 1
          minItems: 1
          type: array
          description: List of data centre settings.
          items:
            $ref: '#/components/schemas/ApacheZookeeperDataCentreV2'
          x-terraform-field-name: data_centre
        currentClusterOperationStatus:
          $ref: '#/components/schemas/CurrentClusterOperationStatusV2'
        zookeeperVersion:
          pattern: '[0-9]+\.[0-9]+\.[0-9]+'
          type: string
          description: 'Version of Apache Zookeeper to run on the cluster. Available versions: <ul> </ul>'
          example: 3.8.4
          x-terraform-force-new: true
        privateNetworkCluster:
          type: boolean
          description: Creates the cluster with private network only, see [Private Network Clusters](https://www.instaclustr.com/support/documentation/useful-information/private-network-clusters/).
          example: true
          x-terraform-force-new: true
        name:
          maxLength: 48
          minLength: 3
          pattern: '[a-zA-Z0-9][a-zA-Z0-9_-]*'
          type: string
          description: Name of the cluster.
          example: exampleCluster
          x-terraform-force-new: true
        description:
          type: string
          description: A description of the cluster
          example: Cluster managed by the integration team.
          x-terraform-computed: true
        twoFactorDelete:
          maxItems: 1
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/TwoFactorDeleteSettingsV2'
          x-terraform-computed: true
        id:
          type: string
          description: ID of the cluster.
          readOnly: true
          example: 4650aa98-e894-4675-9614-558915d5837a
        slaTier:
          $ref: '#/components/schemas/SlaTierV2'
        status:
          type: string
          description: Status of the cluster.
          readOnly: true
          example: RUNNING
      description: Definition of a managed Apache Zookeeper cluster that can be provisioned in Instaclustr.
      example:
        dataCentres:
        - clientToServerEncryption: true
          cloudProvider: AWS_VPC
          name: MyTestDataCentre1
          network: 10.0.0.0/16
          nodeSize: ZKR-PRD-m5d.large-75
          numberOfNodes: 3
          region: US_EAST_1
        name: MyZookeeperCluster
        privateNetworkCluster: false
        slaTier: PRODUCTION
        zookeeperVersion: '[x.y.z]'
    CloudProviderNodeSizesListV2:
      type: object
      properties:
        cloudProviderNodeSizes:
          type: array
          description: List of all compatible cloud provider node sizes.
          items:
            $ref: '#/components/schemas/CloudProviderNodeSizesV2'
      description: Object containing list of node sizes grouped by cloud provider.
    NodeDetailsV2:
      type: object
      properties:
        nodeRoles:
          type: array
          description: The roles or purposes of the node. Useful for filtering for nodes that have a specific role.
          readOnly: true
          items:
            $ref: '#/components/schemas/NodeRolesV2'
        rack:
          type: string
          description: Rack name in which the node is located.
          readOnly: true
        nodeSize:
          type: string
          description: Size of the node.
          readOnly: true
        privateAddress:
          type: string
          description: Private IP address of the node.
          readOnly: true
          example: 10.131.60.142
        deletionTime:
          type: string
          description: Deletion time of the node as a UTC timestamp
          readOnly: true
          example: '2019-08-24T14:15:22Z'
        publicAddress:
          type: string
          description: Public IP address of the node.
          readOnly: true
          example: 52.0.5.140
        startTime:
          type: string
          description: Start time of the node as a UTC timestamp
          readOnly: true
          example: '2019-08-24T14:15:22Z'
        id:
          type: string
          description: ID of the node.
          readOnly: true
          example: 9a27373a-0451-4121-94ba-873fc441f313
        status:
          type: string
          description: Provisioning status of the node.
          readOnly: true
          example: RUNNING
      description: ''
    CurrentClusterOperationStatusV2:
      type: string
      description: Indicates if the cluster is currently performing any restructuring operation such as being created or resized
      example: OPERATION_IN_PROGRESS
      enum:
      - NO_OPERATION
      - OPERATION_IN_PROGRESS
      - OPERATION_FAILED
      x-insta-tf-import-hidden: true
      x-terraform-field-status: true
    ProviderTagV2:
      required:
      - key
      type: object
      properties:
        value:
          type: string
          description: Value of the custom tag.
          example: myTagValue
        key:
          type: string
          description: Key of the custom tag.
          example: myTagKey
          x-insta-unchangeable: true
      description: Custom tag for cloud provider resources.
    ApacheZookeeperDataCentreV2:
      required:
      - cloudProvider
      - name
      - network
      - nodeSize
      - numberOfNodes
      - region
      type: object
      properties:
        deletedNodes:
          type: array
          description: List of deleted nodes in the data centre
          readOnly: true
          items:
            $ref: '#/components/schemas/NodeDetailsV2'
        awsSettings:
          maxItems: 1
          type: array
          description: AWS specific settings for the Data Centre. Cannot be provided with GCP or Azure settings.
          items:
            $ref: '#/components/schemas/ProviderAwsSettingsV2'
          x-insta-comment: due to a bug with the terraform provider openapi plugin this has to be a list instead of a nested object. Also has to be computed because terraform defaults lists to empty arrays when skipped, whereas the API returns null
          x-insta-unchangeable: true
          x-terraform-computed: true
        tagManagementEnabled:
          type: boolean
          description: (Optional) Enable tag management for the data centre, allowing you to create, update and delete custom tags on the data centre via Instaclustr Terraform Provider v2, Cluster Management API or Management Console. Tag management is only available for RIYOA clusters and cannot be disabled once enabled. If not specified, the current value will remain unchanged.
          x-terraform-computed: true
          x-terraform-field-name: tag_management_enabled
        enforceAuthSchemes:
          maxItems: 1
          type: array
          description: A list of authentication schemes to enforce when enforce.auth.enabled=true.
          example:
          - SASL
          items:
            type: string
            enum:
            - NONE
            - SASL
          x-insta-unchangeable: true
          x-terraform-computed: true
        numberOfNodes:
          type: integer
          description: Total number of Zookeeper nodes in the Data Centre.
          example: 3
          x-terraform-force-new: true
        networks:
          type: array
          description: All network CIDR blocks for this data centre, including the primary network and any expanded secondary CIDRs.
          readOnly: true
          items:
            $ref: '#/components/schemas/CdcNetworkDetailsV2'
        customSubjectAlternativeNames:
          type: array
          description: List of Subject Alternative Names FQDNs as per RFC 1035.  Used by the applications with self signed certificates in keystores of nodes in the datacenter.
          example: '["www.abc.com.au", "www.instaclustr.com"]'
          items:
            type: string
          x-insta-unchangeable: true
          x-terraform-computed: true
        enforceAuthEnabled:
          type: boolean
          description: Enables Enforced SASL Authentication.
          example: true
          x-insta-unchangeable: true
          x-terraform-computed: true
        network:
          type: string
          description: The private network address block for the Data Centre specified using CIDR address notation. The network must have a prefix length between `/16` and `/26` and must be part of a private address space.
          example: 192.168.0.0/18
          x-insta-unchangeable: true
        tags:
          type: array
          description: 'List of tags to apply to the Data Centre. Tags are metadata labels which allow you to identify, categorize and filter clusters. This can be useful for grouping together clusters into applications, environments, or any category that you require. Note: Tags will be returned sorted by key in alphabetical order regardless of input order. Terraform users: `tag` is not supported in terraform lifecycle `ignore_changes`.'
          items:
            $ref: '#/components/schemas/ProviderTagV2'
          x-terraform-field-name: tag
          x-terraform-ignore-order: true
        zeroInboundAccess:
          type: boolean
          description: Zero Inbound Access gateways eliminate the requirement for any public IP addresses in cluster deployment.
          example: true
          x-terraform-computed: true
          x-terraform-field-name: zero_inbound_access
        gcpSettings:
          maxItems: 1
          type: array
          description: GCP specific settings for the Data Centre. Cannot be provided with AWS or Azure settings.
          items:
            $ref: '#/components/schemas/ProviderGcpSettingsV2'
          x-insta-comment: See x-insta-comment on awsSettings
          x-insta-unchangeable: true
          x-terraform-computed: true
        nodeSize:
