openapi: 3.2.0
info:
  title: Instaclustr Scale Cluster API
  version: Deprecated
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Scale Cluster across 2 of this provider''s published API definitions: instaclustr-deprecated-openapi.json, instaclustr-deprecated-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Scale Cluster
  description: Operations related to scaling a cluster. Includes adding a new data centre and resizing a cluster.
  x-insta-tag-group: Provisioning V1
  x-priority: 3
paths:
  /provisioning/v1/{clusterId}/cluster-data-centres:
    x-priority: 1
    post:
      tags:
      - Scale Cluster
      summary: Add new Cluster Data Centre
      description: Provision new cluster data centre to existing cluster.
      operationId: addClusterDataCentre
      parameters:
      - name: clusterId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        example: 64223f17-7c9b-4986-8e2e-a44a91a26635
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataCentreRequest'
      responses:
        '202':
          description: Successfully created Cluster Data Centre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                message: Cluster Data Centre created in the specified cluster
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not Authorized
          content:
            application/json: {}
        '403':
          description: Forbidden
          content:
            application/json: {}
        '404':
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: 'Unsupported media type: returned when the payload is in an unsupported format.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: 'Too many requests: returned when more than 35 requests per second are being received by your user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      deprecated: false
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /provisioning/v1/{clusterId}/{clusterDataCentreId}/resize:
    get:
      tags:
      - Scale Cluster
      summary: Get resize operations for a CDC
      operationId: getResizeOps
      parameters:
      - name: clusterId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        example: 64223f17-7c9b-4986-8e2e-a44a91a26635
      - name: clusterDataCentreId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          pattern: '[\w]{8}-[\w]{4}-[\w]{4}-[\w]{4}-[\w]{12}'
          type: string
          format: uuid
        example: 796c69d8-98c5-45aa-a82e-56609e84145f
      - name: activeOnly
        in: query
        description: Return active operation only
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          format: boolean
          default: false
      - name: mostRecent
        in: query
        description: Return most recent
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          format: boolean
          default: false
      responses:
        '200':
          description: Successfully returned the cdc resize operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResizeClusterDataCentreOperation'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not Authorized
          content:
            application/json: {}
        '403':
          description: Forbidden
          content:
            application/json: {}
        '404':
          description: Cluster/CDC not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: 'Unsupported media type: returned when the payload is in an unsupported format.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: 'Too many requests: returned when more than 35 requests per second are being received by your user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      deprecated: false
    post:
      tags:
      - Scale Cluster
      summary: Resize an instance
      description: Nodes in a cluster data centre can be resized in-place via the Console or by issuing an API request. Resizing nodes let you scale the CPU core count and memory quota to meet changing demands and is significantly faster than adding additional Cassandra nodes.
      operationId: resizeDataCentre
      parameters:
      - name: clusterId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        example: 64223f17-7c9b-4986-8e2e-a44a91a26635
      - name: clusterDataCentreId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          pattern: '[\w]{8}-[\w]{4}-[\w]{4}-[\w]{4}-[\w]{12}'
          type: string
          format: uuid
        example: 796c69d8-98c5-45aa-a82e-56609e84145f
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeDataCentreRequest'
        required: true
      responses:
        '202':
          description: Successfully created resize request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                message: instance resize request accepted
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not Authorized
          content:
            application/json: {}
        '403':
          description: Forbidden
          content:
            application/json: {}
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '409':
          description: A resize operation already exists for the specified data centre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '412':
          description: Precondition failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResizePreconditionFailureMessage'
        '415':
          description: 'Unsupported media type: returned when the payload is in an unsupported format.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: 'Too many requests: returned when more than 35 requests per second are being received by your user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      deprecated: false
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /provisioning/v1/{clusterId}/{clusterDataCentreId}/resize/node_size:
    get:
      tags:
      - Scale Cluster
      summary: Retrieve compatible node sizes for resize
      description: Retrieve a map between NodePurpose with a list of their valid node sizes for resize.
      operationId: getNodeSizeForResize
      parameters:
      - name: clusterId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        example: 64223f17-7c9b-4986-8e2e-a44a91a26635
      - name: clusterDataCentreId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          pattern: '[\w]{8}-[\w]{4}-[\w]{4}-[\w]{4}-[\w]{12}'
          type: string
          format: uuid
        example: 796c69d8-98c5-45aa-a82e-56609e84145f
      responses:
        '200':
          description: Successfully retrieved all NodePurpose with their valid node sizes supported for resize.
          content:
            application/json:
              schema:
                type: string
              example: '{"ELASTICSEARCH_MASTER":["m5l-250"],"ELASTICSEARCH_KIBANA":["m5l-250"]}'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not Authorized
          content:
            application/json: {}
        '403':
          description: Forbidden
          content:
            application/json: {}
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: 'Unsupported media type: returned when the payload is in an unsupported format.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: 'Too many requests: returned when more than 35 requests per second are being received by your user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      deprecated: false
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /provisioning/v1/{clusterId}/{clusterDataCentreId}/resize/{opId}:
    get:
      tags:
      - Scale Cluster
      summary: Get details for a resize operation
      operationId: getResizeOperationDetails
      parameters:
      - name: clusterId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        example: 64223f17-7c9b-4986-8e2e-a44a91a26635
      - name: clusterDataCentreId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          pattern: '[\w]{8}-[\w]{4}-[\w]{4}-[\w]{4}-[\w]{12}'
          type: string
          format: uuid
        example: 796c69d8-98c5-45aa-a82e-56609e84145f
      - name: opId
        in: path
        description: Id of the resize cluster data centre operation.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successfully returned the cdc resize operation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterDataCentreResizeOperationDetails'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not Authorized
          content:
            application/json: {}
        '403':
          description: Forbidden
          content:
            application/json: {}
        '404':
          description: Operation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: 'Unsupported media type: returned when the payload is in an unsupported format.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: 'Too many requests: returned when more than 35 requests per second are being received by your user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      deprecated: false
    delete:
      tags:
      - Scale Cluster
      summary: Cancel resize CDC operation
      description: Cancel an active resize cluster data centre operation.
      operationId: cancelResizeCDCOperation
      parameters:
      - name: clusterId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        example: 64223f17-7c9b-4986-8e2e-a44a91a26635
      - name: clusterDataCentreId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          pattern: '[\w]{8}-[\w]{4}-[\w]{4}-[\w]{4}-[\w]{12}'
          type: string
          format: uuid
        example: 796c69d8-98c5-45aa-a82e-56609e84145f
      - name: opId
        in: path
        description: Id of the resize cluster data centre operation.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Node Purposes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  enum:
                  - ELASTICSEARCH_DATA_AND_INGEST
                  - ELASTICSEARCH_MASTER
                  - ELASTICSEARCH_KIBANA
                  - ELASTICSEARCH_COORDINATOR
                  - OPENSEARCH_DASHBOARDS
                  - OPENSEARCH_COORDINATOR
                  - OPENSEARCH_MASTER
                  - OPENSEARCH_INGEST
                  - OPENSEARCH_DATA
                  - OPENSEARCH_DATA_AND_INGEST
                  - OPENSEARCH_VECTOR_INDEX_BUILDER
                  - KAFKA_BROKER
                  - KAFKA_DEDICATED_ZOOKEEPER
                  - KAFKA_DEDICATED_KRAFT_CONTROLLER
                  - KAFKA_DISKLESS_BROKER
                  - KAFKA_DISKLESS_DEDICATED_KRAFT_CONTROLLER
                  - REDIS
                  - VALKEY
                  - CASSANDRA
                  - CASSANDRA_SHOTOVER_PROXY
                  - CADENCE
                  - POSTGRESQL
                  - MONGODB
                  - CLICKHOUSE_SERVER
                  - CLICKHOUSE_KEEPER
                  - CLICKHOUSE_SERVER_AND_KEEPER
                  - COUCHBASE
                  - KAFKA_SHOTOVER_PROXY
                  - MCP_GATEWAY_SERVER
                  - NETAPP_SEARCH_SERVER
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not Authorized
          content:
            application/json: {}
        '403':
          description: Forbidden
          content:
            application/json: {}
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '415':
          description: 'Unsupported media type: returned when the payload is in an unsupported format.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: 'Too many requests: returned when more than 35 requests per second are being received by your user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      deprecated: false
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    ApacheZookeeperOptionsSchema:
      type: object
      properties:
        clientEncryption:
          type: boolean
          description: Accepts true/false. Enables Client ⇄ Server Encryption
          default: false
        zookeeperNodeCount:
          type: integer
          description: Number of Zookeeper nodes; must be 3 or 5.
          format: int32
          default: 3
    KafkaOptionsSchema:
      type: object
      properties:
        clientEncryption:
          type: boolean
          description: Accepts true/false. Enables Client ⇄ Node Encryption.
          default: false
        numberPartitions:
          type: integer
          description: Default number of partitions to be assigned per topic.
          format: int32
        autoCreateTopics:
          type: boolean
          description: Enable to allow brokers to automatically create a topic, if it does not already exist, when messages are published to it.
          default: true
        deleteTopics:
          type: boolean
          description: Enable to allow topics to be deleted via the ic-kafka-topics tool.
          default: true
        dedicatedZookeeper:
          type: boolean
          description: Enable to provision dedicated zookeeper nodes.
          default: false
        zookeeperNodeSize:
          type: string
          description: Dedicated Zookeeper node size.
        zookeeperNodeCount:
          type: integer
          description: Number of dedicated Zookeeper node count, it must be 3 or 5.
          format: int32
          default: 3
        advertisedHostName:
          type: string
          description: Advertised HostName is required for PrivateLink.
        kraftMode:
          type: string
          description: Create KRaft Mode with COLOCATED
          example: COLOCATED
          enum:
          - NONE
          - COLOCATED
          - COLLOCATED_WITH_SEPARATE_PROCESSES
          - DEDICATED
          - NONE
          - COLOCATED
        kraftControllerNodeCount:
          type: string
          description: Number of KRaft Controller Node count
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    ErrorMessage:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        errorDetails:
          type: object
        code:
          type:
          - integer
          - 'null'
          format: int32
        link:
          type:
          - string
          - 'null'
    BundleRequest:
      required:
      - bundle
      - version
      type: object
      properties:
        bundle:
          type: string
          description: "Instaclustr refers to the base applications running on a cluster as bundles. Addon bundles are additional applications which can be previsioned alongside the base applications. Addons cannot be provisioned by themselves. \n<b>Note:</b> The bundle versions listed are defaults for most accounts, additional versions may be available for your account. You can consult the Instaclustr Console for information about which bundle versions are available for you.\n\n<h3>Base Application Addon Compatibility</h3>\n<b>APACHE_CASSANDRA</b>\n<ul>\n    <li>SPARK</li>\n    <li>LUCENE</li>\n    <li>CONTINUOUS_BACKUP</li>\n</ul>\n<b>Note:</b> PCI compliance is not compatible with Spark or Lucene, see <a href=\"https://www.instaclustr.com/support/documentation/useful-information/pci-compliance/\" target=\"_blank\">here</a> for more details\n\n<b>KAFKA</b>\n<ul>\n    <li>KAFKA_REST_PROXY</li>\n    <li>KAFKA_SCHEMA_REGISTRY</li>\n    <li>KARAPACE_SCHEMA_REGISTRY</li>\n    <li>KARAPACE_REST_PROXY</li>\n</ul>\n"
          example: APACHE_CASSANDRA
          enum:
          - APACHE_CASSANDRA
          - KAFKA
          - KAFKA_CONNECT
          - ELASTICSEARCH
          - OPENSEARCH
          - REDIS
          - VALKEY
          - SPARK
          - KAFKA_REST_PROXY
          - KAFKA_SCHEMA_REGISTRY
          - APACHE_ZOOKEEPER
          - POSTGRESQL
          - PGBOUNCER
          - KARAPACE_SCHEMA_REGISTRY
          - CADENCE
          - KARAPACE_REST_PROXY
        version:
          type: string
          description: "<h3>Accepted Bundle Versions</h3>\n<b>APACHE_CASSANDRA</b>\nNote: PCI is supported on the latest non-preview version of Cassandra.<ul>\n    <li>3.11.8</li>\n    <li>4.0.1</li>\n</ul>\n<b>KAFKA</b>\n<ul>\n    <li>4.1.1</li>\n    <li>3.9.1</li>\n</ul>\n<b>KAFKA_CONNECT</b>\n<ul>\n    <li>4.1.1</li>\n    <li>3.9.1</li>\n</ul>\n<b>ELASTICSEARCH (For Legacy Support Only)</b>\n<ul>\n    <li>1.13.3</li>\n</ul>\n<b>OPENSEARCH</b>\n<ul>\n    <li>1.3.15</li>\n    <li>2.16.0</li>\n</ul>\n<b>REDIS</b>\n<ul>\n    <li>7.0.14</li>\n</ul>\n<b>VALKEY</b>\n<ul>\n    <li>7.2.8</li>\n</ul>\n<b>SPARK</b>\n<ul>\n    <li>2.1.3</li>\n    <li>2.3.2</li>\n    <li>3.0.1</li>\n</ul>\n<b>KARAPACE_SCHEMA_REGISTRY</b>\n<ul>\n    <li>5.0.0</li>\n</ul>\n<b>KARAPACE_REST_PROXY</b>\n<ul>\n    <li>5.0.0</li>\n</ul>\n<b>APACHE_ZOOKEEPER</b>\n<ul>\n    <li>3.9.3</li>\n</ul>\n<b>POSTGRESQL</b>\n<ul>\n    <li>18.1</li>\n    <li>17.7</li>\n</ul>\n<b>PGBOUNCER</b>\n<ul>\n    <li>1.25.0</li>\n</ul>\n<b>CADENCE</b>\n<ul>\n    <li>1.2.2</li>\n</ul>\n"
          example: 3.11.4
        options:
          $ref: '#/components/schemas/BundleOptionsSchema'
    ElasticSearchOptionsSchema:
      type: object
      properties:
        clientEncryption:
          type: boolean
          description: Accepts true/false. Enables Client ⇄ Node Encryption.
          default: false
        dedicatedMasterNodes:
          type: boolean
          description: This is an optional boolean parameter used to scale the load of the data node by having 3 dedicated master nodes for a particular cluster. We recommend selecting this to true for clusters with 9 and above nodes.
          default: false
        masterNodeSize:
          type: string
          description: Only to be included if the if dedicatedMasterNodes is set to true. See Available cluster node sizes in <a href='#operation/extendedProvisionRequestHandler'>Provisioning API</a>
          example: m4l-250
        securityPlugin:
          type: boolean
          description: Enables Security Plugin. This option gives an extra layer of security to the cluster. This will automatically enable internode encryption.
          default: false
        indexManagementPlugin:
          type: boolean
          description: Enables Index Management Plugin. This helps automate recurring index management activities.
          default: false
    BundleOptionsSchema:
      type: object
      description: "Bundle options - the required schema differs depending on the bundle type.\n\n<b>Note:</b> the bundle options for KafkaConnect supports the following properties (in addition to those documented in the schema):<table>\n  <tbody>\n    <tr>\n      <td><b>Field</b></td>\n      <td><b>Allowed Values</b></td>\n    </tr>\n    <tr>\n      <td>\n        <span style=\"font-weight: 400;\">options.bootstrap.servers</span>\n        <p></p>\n        <p>options.sasl.*</p>\n        <p>options.ssl.*</p>\n        <p>options.security.*</p>\n      </td>\n      <td>\n        <b>Optional</b>\n        <p></p>\n        <p>\n          <span style=\"font-weight: 400;\"\n            >Connection information for your Kafka Cluster. These options are\n            analogous to the similarly named options that you would place in\n            your Kafka Connect worker.properties file. Only required if\n            connecting to a Non-Instaclustr managed Kafka Cluster</span\n          >\n        </p>\n        <p><b>&nbsp;</b></p>\n      </td>\n    </tr>\n  </tbody>\n</table>\n"
      example:
        authnAuthz: 'true'
        clientEncryption: 'false'
      oneOf:
      - $ref: '#/components/schemas/CassandraOptionsSchema'
      - $ref: '#/components/schemas/KafkaOptionsSchema'
      - $ref: '#/components/schemas/KafkaRestProxyOptionsSchema'
      - $ref: '#/components/schemas/KarapaceRestProxyOptionsSchema'
      - $ref: '#/components/schemas/KafkaConnectOptionsSchema'
      - $ref: '#/components/schemas/OpenSearchOptionsSchema'
      - $ref: '#/components/schemas/ElasticSearchOptionsSchema'
      - $ref: '#/components/schemas/RedisBundleOptionsSchema'
      - $ref: '#/components/schemas/ValkeyBundleOptionsSchema'
      - $ref: '#/components/schemas/SparkBundleOptionsSchema'
      - $ref: '#/components/schemas/ApacheZookeeperOptionsSchema'
      - $ref: '#/components/schemas/PostgresqlOptionsSchema'
      - $ref: '#/components/schemas/PgBouncerOptionsSchema'
      - $ref: '#/components/schemas/CadenceOptionsSchema'
    ReplaceNodeOperationDetails:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - GENESIS
          - PRE_BUNDLE_PROCESSING
          - RESIZING_DISK
          - RESIZED_DISK
          - EXPANDING_FILESYSTEM
          - EXPANDED_FILESYSTEM
          - GRACEFULLY_SHUTTING_DOWN
          - CREATING_FORCE_INSTANCE_SHUTDOWN
          - FORCE_INSTANCE_SHUTTING_DOWN
          - CREATING_REPLACEMENT
          - PROVISIONING
          - PROVISIONED
          - BACKEDUP
          - RESTORING
          - FLUSHING
          - FLUSHED
          - PREPARING_NETWORK_RECONFIGURE
          - SWAPPING
          - SWAPPED
          - RECONFIGURING_NETWORK
          - CLEARING_INSTALLED_BUNDLES
          - CLEARED_INSTALLED_BUNDLES
          - POST_BUNDLE_PROCESSING
          - RESTARTING
          - REPLACED
          - CANCELLING
          - CANCELLED
          - FAILING
          - FAILED
        node:
          type: string
        replacement:
          type: string
        resizeOp:
          type: string
        created:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time
        failedStatus:
          type: string
          enum:
          - GENESIS
          - PRE_BUNDLE_PROCESSING
          - RESIZING_DISK
          - RESIZED_DISK
          - EXPANDING_FILESYSTEM
          - EXPANDED_FILESYSTEM
          - GRACEFULLY_SHUTTING_DOWN
          - CREATING_FORCE_INSTANCE_SHUTDOWN
          - FORCE_INSTANCE_SHUTTING_DOWN
          - CREATING_REPLACEMENT
          - PROVISIONING
