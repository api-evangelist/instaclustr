      description: 'Definition of a data centre to be created within a cluster. Any fields left blank will use the values provided in the ClusterProvisioningRequest top level object

        Currently only APACHE_CASSANDRA supports multiple data centres.

        If overriding the bundles you must specify APACHE_CASSANDRA (and LUCENE - if specified at top level) at the same version. SPARK can only be defined on one data centre'
    ValkeyBundleOptionsSchema:
      type: object
      properties:
        clientEncryption:
          type: boolean
          description: Accepts true/false. Enables Client ⇄ Node Encryption.
          default: false
        passwordAuth:
          type: boolean
          description: Accepts true/false. Enables Password Authentication and User Authorization.
          default: false
        masterNodes:
          maximum: 50
          minimum: 3
          type: integer
          description: The number of Valkey Master Nodes to be created.
          format: int32
        replicaNodes:
          maximum: 50
          minimum: 0
          type: integer
          description: The number of Valkey Replica Nodes to be created.
          format: int32
        advertisedHostName:
          type: string
          description: Advertised HostName is required for PrivateLink.
    Provider:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: Provider name
          example: AWS_VPC
          enum:
          - AWS_VPC
          - AZURE_AZ
          - GCP
        accountName:
          type: string
          description: For customers running in their own account. Your provider account can be found on the Create Cluster page on the console, or the “Provider Account” property on any existing cluster. For customers running in Instaclustr account, this property may be omitted.
          example: test-account
          default: 'null'
        customVirtualNetworkId:
          type: string
          description: '<b>AWS</b>: VPC ID to provision data centre into, cluster network must match the IPv4 CIDR block of the specified VPC.<br/> <b>GCP</b>: Network name or a relative Network or Subnetwork URI e.g. projects/my-project/regions/us-central1/subnetworks/my-subnet, cluster network must match the IPv4 CIDR block of the specified subnet.'
        tags:
          type: object
          description: <b>AWS_VPC, GCP, AZURE and AZURE_AZ only</b>. If specified, the value is a map from tag key to value. For AWS_VPC restrictions, refer to the <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Using_Tags.html#tag-restrictions" target="_blank">AWS User Guide</a>. Tags are defined per cluster and will be applied to every instance in the cluster.
          example:
            testTagKey: testKeyValue
        resourceGroup:
          type: string
          description: <b>AZURE only</b>. If specified, the value is the name for an Azure Resource Group which the resources will be provisioned into.
          example: 'null'
          default: 'null'
        diskEncryptionKey:
          type: string
          description: <b>AWS_VPC only</b>. Specify a KMS encryption key to encrypt data on nodes. KMS encryption key must be set in Account settings before provisioning an encrypted cluster.
          example: 'null'
          default: 'null'
  securitySchemes:
    Basic_Authentication:
