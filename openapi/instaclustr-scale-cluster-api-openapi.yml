    OpenSearchOptionsSchema:
      type: object
      properties:
        dedicatedMasterNodes:
          type: boolean
          description: This is an optional boolean parameter used to scale the load of the data node by having 3 dedicated master nodes for a particular cluster. We recommend selecting this to true for clusters with 9 and above nodes.
          default: false
        masterNodeSize:
          type: string
          description: Only to be included if the if dedicatedMasterNodes is set to true. See Available cluster node sizes in <a href='#operation/extendedProvisionRequestHandler'>Provisioning API</a>
          example: m4l-250
        openSearchDashboardsNodeSize:
          type: string
          description: This is an optional string parameter to used to define the OpenSearch Dashboards node size. Only to be included if wish to add an OpenSearch Dashboards node to the cluster. See Available cluster node sizes in <a href='#operation/extendedProvisionRequestHandler'>Provisioning API</a>
          example: m4l-250
        indexManagementPlugin:
          type: boolean
          description: Enables Index Management Plugin. This helps automate recurring index management activities.
          default: false
        anomalyDetectionPlugin:
          type: boolean
          description: Enables the Anomaly Detection Plugin. This allows for the detection of unusual or anomalous data points in your time-series data. Supported on OpenSearch 2.x for versions >= 2.4.0 and 1.x for versions >= 1.3.7
          default: false
        sqlPlugin:
          type: boolean
          description: Enables the SQL Plugin. This allows you to query you indices with SQL as an alternative to the OpenSearch Query DSL. Supported on OpenSearch 2.x for versions >= 2.4.0 and 1.x for versions >= 1.3.7
          default: false
        asynchronousSearchPlugin:
          type: boolean
          description: Enables the Anomaly Detection Plugin. This allows you to submit queries to be completed asynchronously. Supported on OpenSearch 2.x for versions >= 2.4.0 and 1.x for versions 1.3.7
          default: false
    KafkaRestProxyOptionsSchema:
      type: object
      properties:
        integrateRestProxyWithSchemaRegistry:
          type: boolean
          description: Accepts true/false. Enables Integration of the REST proxy with a Schema registry
          default: false
        useLocalSchemaRegistry:
          type: boolean
          description: Accepts true/false. Integrates the REST proxy with the Schema registry attached to this cluster. Requires 'integrateRestProxyWithSchemaRegistry' to be 'true'
          default: false
        schemaRegistryServerUrl:
          type: string
          description: URL of the Kafka schema registry to integrate with. Requires 'integrateRestProxyWithSchemaRegistry' to be 'true' and useLocalSchemaRegistry to be 'false'
        schemaRegistryUsername:
          type: string
          description: Username to use when connecting to the Kafka schema registry. Requires 'integrateRestProxyWithSchemaRegistry' to be 'true' and useLocalSchemaRegistry to be 'false'
        schemaRegistryPassword:
          type: string
          description: Password to use when connecting to the Kafka schema registry. Requires 'integrateRestProxyWithSchemaRegistry' to be 'true' and useLocalSchemaRegistry to be 'false'
    PostgresqlOptionsSchema:
      type: object
      properties:
        clientEncryption:
          type: boolean
          description: Accepts true/false. Enables Client ⇄ Node Encryption.
          default: false
        postgresqlNodeCount:
          maximum: 5
          minimum: 1
          type: integer
          description: The number of PostgreSQL server nodes created. One of which will be the primary while the rest will be replicas
          format: int32
        replicationMode:
          type: string
          description: Default <a href="https://www.instaclustr.com/support/documentation/postgresql/options/replication-mode">replication mode</a> for PostgreSQL transactions.
          default: SYNCHRONOUS
          enum:
          - SYNCHRONOUS
          - ASYNCHRONOUS
        synchronousModeStrict:
          type: boolean
          description: Accepts true/false. Enables <a href="https://www.instaclustr.com/support/documentation/postgresql/options/synchronous-mode-strict/">synchronous mode strict</a> for clusters with SYNCHRONOUS replication mode.
          default: false
    CadenceOptionsSchema:
      required:
