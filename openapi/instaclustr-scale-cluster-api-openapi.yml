      type: object
      properties:
        useAdvancedVisibility:
          type: boolean
          description: Use Advanced Visibility.
          default: false
        targetCassandraCdcId:
          type: string
          description: UUID of a Data Centre of an Instaclustr managed Cassandra Cluster, to be used by Cadence. Must be in the same Instaclustr account.
          format: uuid
        targetCassandraVpcType:
          type: string
          description: Target Cassandra VPC Type
          default: TARGET_VPC
          enum:
          - TARGET_VPC
          - VPC_PEERED
          - SEPARATE_VPC
        targetKafkaCdcId:
          type: string
          description: UUID of a Data Centre of an Instaclustr managed Kafka Cluster, to be used by Cadence. Must be in the same Instaclustr account.
          format: uuid
        targetKafkaVpcType:
          type: string
          description: Target Kafka VPC Type
          default: VPC_PEERED
          enum:
          - TARGET_VPC
          - VPC_PEERED
          - SEPARATE_VPC
        targetOpenSearchCdcId:
          type: string
          description: UUID of a Data Centre of an Instaclustr managed OpenSearch Cluster, to be used by Cadence. Must be in the same Instaclustr account.
          format: uuid
        targetOpenSearchVpcType:
          type: string
          description: Target OpenSearch VPC Type
          default: VPC_PEERED
          enum:
          - TARGET_VPC
          - VPC_PEERED
