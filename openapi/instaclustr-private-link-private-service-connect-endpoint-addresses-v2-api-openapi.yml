  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/resources/private-link-private-service-connect-endpoint-addresses/v2/{clusterDataCenterId}:
    parameters:
    - name: clusterDataCenterId
      in: path
      description: ID of the cluster data center.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Private Link Private Service Connect Endpoint Addresses V2
      summary: Get Private Link / Private Service Connect Endpoint addresses on a cluster data…
      description: Get Private Link / Private Service Connect Endpoint addresses on a cluster data center.
      responses:
        '200':
          description: Successfully retrieved the Endpoint addresses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateLinkPrivateServiceConnectEndpointAddressesV2'
        '404':
          description: Cluster data center not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: getClusterManagementV2ResourcesPrivateLinkPrivateServiceConnectEndpointAddressesV2ByClusterDataCenterId
      x-operation-id-source: derived
    post:
      tags:
      - Private Link Private Service Connect Endpoint Addresses V2
      summary: Set Private Link / Private Service Connect Endpoint addresses on a cluster data…
      description: Set Private Link / Private Service Connect Endpoint addresses on a cluster data center.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateLinkPrivateServiceConnectEndpointAddressesV2'
        required: true
      responses:
        '202':
          description: Succesfully set the Endpoint addresses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateLinkPrivateServiceConnectEndpointAddressesV2'
              example:
                rackToEndpointAddress:
                - us-central1-a:
                  - 10.128.15.200
                - us-central1-b:
                  - 10.128.15.201
                - us-central1-c:
                  - 10.128.15.202
      x-codegen-request-body-name: body
      operationId: postClusterManagementV2ResourcesPrivateLinkPrivateServiceConnectEndpointAddressesV2ByClusterDataCenterId
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    PrivateLinkPrivateServiceConnectEndpointAddressesV2:
      required:
      - rackToEndpointAddress
      type: object
      properties:
        rackToEndpointAddress:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/PrivateLinkPrivateServiceConnectEndpointAddressV2'
          description: Private Link / Private Service Connect Endpoint addresses.
      description: Defines the endpoints used by each each rack in a Private Link or Private Service Connect cluster
      example:
        rackToEndpointAddress:
        - us-central1-a:
          - address: 10.128.15.200
            port: 9042
        - us-central1-b:
          - address: 10.128.15.201
            port: 9042
        - us-central1-c:
          - address: 10.128.15.202
            port: 9042
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    PrivateLinkPrivateServiceConnectEndpointAddressV2:
      required:
      - address
      type: object
      properties:
        address:
          type: string
        port:
          type: integer
          readOnly: true
      description: Defines the endpoint used by a rack in a Private Link or Private Service Connect cluster
      example:
        address: 10.128.15.200
        port: 9042
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
