openapi: 3.2.0
info:
  title: Instaclustr Cluster Suspend Resume V2 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Cluster Suspend Resume V2 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Cluster Suspend Resume V2
  description: Operations related to suspending and resuming clusters.
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/operations/clusters/v2/{clusterId}/resume/v2:
    parameters:
    - name: clusterId
      in: path
      description: ID of the cluster
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    put:
      tags:
      - Cluster Suspend Resume V2
      summary: Resume a suspended cluster
      description: Resume (wake) a suspended cluster. Starts an asynchronous resume operation. Related application-group and dependent clusters are included automatically. On success the response confirms the cluster is resuming; poll cluster details until status leaves RESUMING.
      responses:
        '202':
          description: Resume accepted; the cluster is resuming.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterSuspendResumeStatusV2'
        '400':
          description: Cluster is not eligible to resume, or a suspend/resume operation is already in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
        '404':
          description: Cluster not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: putClusterManagementV2OperationsClustersV2ByClusterIdResumeV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/operations/clusters/v2/{clusterId}/suspend/v2:
    parameters:
    - name: clusterId
      in: path
      description: ID of the cluster
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    put:
      tags:
      - Cluster Suspend Resume V2
      summary: Suspend a running cluster
      description: Suspend (hibernate) a running cluster. Starts an asynchronous suspend operation. Related application-group and dependent clusters are included automatically. On success the response confirms the cluster is suspending; poll cluster details until status leaves SUSPENDING.
      responses:
        '202':
          description: Suspend accepted; the cluster is suspending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterSuspendResumeStatusV2'
        '400':
          description: Cluster is not eligible to suspend, a suspend/resume operation is already in progress, or the cluster has a maintenance event in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
        '404':
          description: Cluster not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: putClusterManagementV2OperationsClustersV2ByClusterIdSuspendV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    ClusterSuspendResumeStatusV2:
      required:
      - clusterId
      - clusterStatus
      type: object
      properties:
        relatedClusterIds:
          type: array
          description: IDs of all clusters included in this suspend or resume, including the originating cluster. For a standalone cluster this contains only the originating ID.
          items:
            type: string
            format: uuid
        clusterId:
          type: string
          description: ID of the cluster.
          format: uuid
        clusterStatus:
          type: string
          description: Transitional cluster status after the request was accepted (SUSPENDING after suspend, RESUMING after resume). Poll cluster details until the status reaches SUSPENDED or RUNNING.
      description: Accepted response after starting cluster suspend or resume. Confirms the cluster is suspending or resuming. Includes IDs of related application-group and dependent clusters when those are expanded automatically. No workflow/job detail is returned.
      example:
        clusterId: a1c69c6c-4d6b-4ea8-a746-32bd5eb5ad48
        clusterStatus: SUSPENDING
        relatedClusterIds:
        - a1c69c6c-4d6b-4ea8-a746-32bd5eb5ad48
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
