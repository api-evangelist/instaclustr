openapi: 3.2.0
info:
  title: Instaclustr Apache Kafka Connect Provisioning V2 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Apache Kafka Connect Provisioning V2 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Apache Kafka Connect Provisioning V2
  description: ''
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/data-sources/applications/kafka-connect/compatible-node-sizes/v2/:
    get:
      tags:
      - Apache Kafka Connect Provisioning V2
      summary: List compatible node sizes for Kafka Connect
      responses:
        '200':
          description: Successfully retrieved compatible node sizes for Kafka Connect.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CloudProviderNodeSizesListV2'
      operationId: getClusterManagementV2DataSourcesApplicationsKafkaConnectCompatibleNodeSizesV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/data-sources/applications/kafka-connect/versions/v2/:
    get:
      tags:
      - Apache Kafka Connect Provisioning V2
      summary: List all Kafka Connect versions
      responses:
        '200':
          description: Successfully retrieved versions of Kafka Connect.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationVersionListV2'
      operationId: getClusterManagementV2DataSourcesApplicationsKafkaConnectVersionsV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/operations/applications/kafka-connect/clusters/v2/{clusterId}/certificate/v2/:
    parameters:
    - name: clusterId
      in: path
      description: ID of the cluster
      required: true
      style: simple
      explode: false
      schema:
        type: string
    get:
      tags:
      - Apache Kafka Connect Provisioning V2
      summary: Download Kafka connect cluster X.509 Certificate Authority certificates
      description: Kafka connect cluster certificates are returned as a .zip file. The file contains an X.509 cluster Certificate Authority certificate in JKS file, an X.509 cluster Certificate Authority certificate in PEM-encoded (ASCII) format, and an X.509 cluster Certificate Authority certificate in DER-encoded (binary) format.
      responses:
        '200':
          description: Successfully create the Kafka connect cluster's certificate
          content:
            application/zip:
              schema:
                type: string
                format: binary
      operationId: getClusterManagementV2OperationsApplicationsKafkaConnectClustersV2ByClusterIdCertificateV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/operations/applications/kafka-connect/clusters/v2/{clusterId}/sync-custom-kafka-connectors/v2:
    parameters:
    - name: clusterId
      in: path
      description: ID of the Kafka Connect Cluster.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    put:
      tags:
      - Apache Kafka Connect Provisioning V2
      summary: Update the custom connectors of a Kafka Connect cluster
      responses:
        '202':
          description: Successfully processed the custom connector update request.
          content: {}
      operationId: putClusterManagementV2OperationsApplicationsKafkaConnectClustersV2ByClusterIdSyncCustomKafkaConnectorsV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/kafka-connect/clusters/v2/:
    x-terraform-resource-name: kafka_connect_cluster_v2
    post:
      tags:
      - Apache Kafka Connect Provisioning V2
      summary: Create a Kafka connect cluster
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KafkaConnectClusterV2'
        required: true
      responses:
        '202':
          description: Kafka connect cluster creation request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaConnectClusterV2'
              example:
                currentClusterOperationStatus: OPERATION_IN_PROGRESS
                dataCentres:
                - cloudProvider: AWS_VPC
                  id: 4650aa98-e894-4675-9614-558915d5837a
                  name: AWS_VPC_US_EAST_1
                  network: 10.0.0.0/16
                  nodeSize: KCN-PRD-c6g.4xlarge-80
                  nodes:
                  - id: 94c1ad54-c6f1-4f2e-8634-be9f5fb47fad
                    nodeRoles:
                    - KAFKA_CONNECT
                    nodeSize: KCN-PRD-c6g.4xlarge-80
                    privateAddress: 10.0.5.23
                    publicAddress: 24.135.55.176
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: cc317853-be79-4100-898f-c12e4610a892
                    nodeRoles:
                    - KAFKA_CONNECT
                    nodeSize: KCN-PRD-c6g.4xlarge-80
                    privateAddress: 10.0.128.45
                    publicAddress: 193.146.159.238
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: b401b5bb-8a6f-4aa7-99c4-12fe445941c3
                    nodeRoles:
                    - KAFKA_CONNECT
                    nodeSize: KCN-PRD-c6g.4xlarge-80
                    privateAddress: 10.0.200.78
                    publicAddress: 108.21.43.134
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  numberOfNodes: 3
                  region: US_EAST_1
                  replicationFactor: 3
                  status: RUNNING
                id: 4650aa98-e894-4675-9614-558915d5837a
                kafkaConnectVersion: '[x.y.z]'
                name: MyKafkaConnectCluster
                privateNetworkCluster: false
                slaTier: PRODUCTION
                status: RUNNING
                targetCluster:
                - managedCluster:
                  - kafkaConnectVpcType: VPC_PEERED
                    targetKafkaClusterId: '[UUID of kafka cluster]'
          x-terraform-resource-poll-completed-statuses: NO_OPERATION
          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: OPERATION_IN_PROGRESS
      x-codegen-request-body-name: body
      x-terraform-resource-timeout: 99999m
      operationId: postClusterManagementV2ResourcesApplicationsKafkaConnectClustersV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/kafka-connect/clusters/v2/{clusterId}:
    parameters:
    - name: clusterId
      in: path
      description: ID of the active cluster
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Apache Kafka Connect Provisioning V2
      summary: Get Kafka connect cluster details
      responses:
        '200':
          description: Get Kafka connect cluster information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaConnectClusterV2'
              example:
                currentClusterOperationStatus: OPERATION_IN_PROGRESS
                dataCentres:
                - cloudProvider: AWS_VPC
                  id: 4650aa98-e894-4675-9614-558915d5837a
                  name: AWS_VPC_US_EAST_1
                  network: 10.0.0.0/16
                  nodeSize: KCN-PRD-c6g.4xlarge-80
                  nodes:
                  - id: 94c1ad54-c6f1-4f2e-8634-be9f5fb47fad
                    nodeRoles:
                    - KAFKA_CONNECT
                    nodeSize: KCN-PRD-c6g.4xlarge-80
                    privateAddress: 10.0.5.23
                    publicAddress: 24.135.55.176
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: cc317853-be79-4100-898f-c12e4610a892
                    nodeRoles:
                    - KAFKA_CONNECT
                    nodeSize: KCN-PRD-c6g.4xlarge-80
                    privateAddress: 10.0.128.45
                    publicAddress: 193.146.159.238
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: b401b5bb-8a6f-4aa7-99c4-12fe445941c3
                    nodeRoles:
                    - KAFKA_CONNECT
                    nodeSize: KCN-PRD-c6g.4xlarge-80
                    privateAddress: 10.0.200.78
                    publicAddress: 108.21.43.134
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  numberOfNodes: 3
                  region: US_EAST_1
                  replicationFactor: 3
                  status: RUNNING
                id: 4650aa98-e894-4675-9614-558915d5837a
                kafkaConnectVersion: '[x.y.z]'
                name: MyKafkaConnectCluster
                privateNetworkCluster: false
                slaTier: PRODUCTION
                status: RUNNING
                targetCluster:
                - managedCluster:
