          x-terraform-computed: true
          x-terraform-field-name: tag_management_enabled
        numberOfNodes:
          type: integer
          description: Total number of nodes in the Data Centre. Must be a multiple of `replicationFactor`.
          example: 6
        networks:
          type: array
          description: All network CIDR blocks for this data centre, including the primary network and any expanded secondary CIDRs.
          readOnly: true
          items:
            $ref: '#/components/schemas/CdcNetworkDetailsV2'
        network:
