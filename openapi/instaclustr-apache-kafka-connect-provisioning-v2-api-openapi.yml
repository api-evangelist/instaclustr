                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: getClusterManagementV2ResourcesApplicationsKafkaConnectClustersV2ByClusterId
      x-operation-id-source: derived
    put:
      tags:
      - Apache Kafka Connect Provisioning V2
      summary: Update a Kafka connect cluster
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KafkaConnectClusterUpdateV2'
        required: true
      responses:
        '202':
          description: Kafka Connect cluster update request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaConnectClusterV2'
              example:
                currentClusterOperationStatus: OPERATION_IN_PROGRESS
                dataCentres:
                - cloudProvider: AWS_VPC
                  id: 4650aa98-e894-4675-9614-558915d5837a
                  name: AWS_VPC_US_EAST_1
                  network: 10.0.0.0/16
                  nodeSize: KCN-PRD-c6g.4xlarge-80
                  nodes:
                  - id: 94c1ad54-c6f1-4f2e-8634-be9f5fb47fad
                    nodeRoles:
                    - KAFKA_CONNECT
                    nodeSize: KCN-PRD-c6g.4xlarge-80
                    privateAddress: 10.0.5.23
                    publicAddress: 24.135.55.176
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: cc317853-be79-4100-898f-c12e4610a892
                    nodeRoles:
                    - KAFKA_CONNECT
                    nodeSize: KCN-PRD-c6g.4xlarge-80
                    privateAddress: 10.0.128.45
                    publicAddress: 193.146.159.238
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: b401b5bb-8a6f-4aa7-99c4-12fe445941c3
                    nodeRoles:
                    - KAFKA_CONNECT
                    nodeSize: KCN-PRD-c6g.4xlarge-80
                    privateAddress: 10.0.200.78
                    publicAddress: 108.21.43.134
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  numberOfNodes: 3
                  region: US_EAST_1
                  replicationFactor: 3
                  status: RUNNING
                id: 4650aa98-e894-4675-9614-558915d5837a
                kafkaConnectVersion: '[x.y.z]'
                name: MyKafkaConnectCluster
                privateNetworkCluster: false
                slaTier: PRODUCTION
                status: RUNNING
                targetCluster:
                - managedCluster:
                  - kafkaConnectVpcType: VPC_PEERED
                    targetKafkaClusterId: '[UUID of kafka cluster]'
          x-terraform-resource-poll-completed-statuses: NO_OPERATION
          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: OPERATION_IN_PROGRESS
        '404':
          description: Kafka connect cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      x-codegen-request-body-name: body
      x-terraform-resource-timeout: 99999m
      operationId: putClusterManagementV2ResourcesApplicationsKafkaConnectClustersV2ByClusterId
      x-operation-id-source: derived
    delete:
      tags:
      - Apache Kafka Connect Provisioning V2
      summary: Delete Kafka connect Cluster
      description: Delete an active cluster.
      responses:
        '204':
          description: Cluster delete requested.
          content: {}
      x-terraform-resource-poll-enabled: true
      operationId: deleteClusterManagementV2ResourcesApplicationsKafkaConnectClustersV2ByClusterId
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    ProviderAzureSettingsV2:
      type: object
      properties:
        resourceGroup:
          type: string
          description: The name of the Azure Resource Group into which the Data Centre will be provisioned.
          x-insta-unchangeable: true
        customVirtualNetworkId:
          type: string
          description: VNet ID into which the Data Centre will be provisioned. The VNet must have an available address space for the Data Centre's network allocation to be appended to the VNet. Currently supported for PostgreSQL clusters only.
          example: /subscriptions/{subscription-id}/resourceGroups/{resource-group-name}/providers/Microsoft.Network/virtualNetworks/{virtual-network-name}
          x-insta-unchangeable: true
        storageNetwork:
          type: string
          description: 'The private network address block to be used for the storage network. This is only used for certain node sizes, currently limited to those which use Azure NetApp Files: for all other node sizes, this field should not be provided. The network must have a prefix length between /16 and /28, and must be part of a private address range.'
          example: 192.168.1.0/24
          x-insta-unchangeable: true
      description: ''
    KafkaConnectExternalTargetClusterDetailsV2:
      type: object
      properties:
        securityProtocol:
          type: string
          description: Connection information for your Kafka Cluster. These options are analogous to the similarly named options that you would place in your Kafka Connect worker.properties file. Only required if connecting to a Non-Instaclustr managed Kafka Cluster.
          x-terraform-force-new: true
        sslTruststorePassword:
          type: string
          description: Connection information for your Kafka Cluster. These options are analogous to the similarly named options that you would place in your Kafka Connect worker.properties file. Only required if connecting to a Non-Instaclustr managed Kafka Cluster.
          x-terraform-force-new: true
          x-terraform-sensitive: true
        bootstrapServers:
          type: string
          description: Connection information for your Kafka Cluster. These options are analogous to the similarly named options that you would place in your Kafka Connect worker.properties file. Only required if connecting to a Non-Instaclustr managed Kafka Cluster.
          x-terraform-force-new: true
        saslJaasConfig:
          type: string
          description: Connection information for your Kafka Cluster. These options are analogous to the similarly named options that you would place in your Kafka Connect worker.properties file. Only required if connecting to a Non-Instaclustr managed Kafka Cluster.
          x-terraform-force-new: true
          x-terraform-sensitive: true
        saslMechanism:
          type: string
          description: Connection information for your Kafka Cluster. These options are analogous to the similarly named options that you would place in your Kafka Connect worker.properties file. Only required if connecting to a Non-Instaclustr managed Kafka Cluster.
          x-terraform-force-new: true
        sslProtocol:
          type: string
          description: Connection information for your Kafka Cluster. These options are analogous to the similarly named options that you would place in your Kafka Connect worker.properties file. Only required if connecting to a Non-Instaclustr managed Kafka Cluster.
          x-terraform-force-new: true
        sslEnabledProtocols:
          type: string
          description: Connection information for your Kafka Cluster. These options are analogous to the similarly named options that you would place in your Kafka Connect worker.properties file. Only required if connecting to a Non-Instaclustr managed Kafka Cluster.
          x-terraform-force-new: true
        truststore:
          type: string
          description: Base64 encoded version of the TLS trust store (in JKS format) used to connect to your Kafka Cluster. Only required if connecting to a Non-Instaclustr managed Kafka Cluster with TLS enabled.
          x-terraform-force-new: true
      description: ''
    KafkaConnectTargetClusterDetailsV2:
      type: object
      properties:
        externalCluster:
          maxItems: 1
          type: array
          description: Details to connect to a Non-Instaclustr managed cluster. Cannot be provided if targeting an Instaclustr managed cluster.
          items:
            $ref: '#/components/schemas/KafkaConnectExternalTargetClusterDetailsV2'
          x-terraform-force-new: true
        managedCluster:
          maxItems: 1
          type: array
          description: Details to connect to a Instaclustr managed cluster. Cannot be provided if targeting an external cluster.
          items:
            $ref: '#/components/schemas/KafkaConnectManagedTargetClusterDetailsV2'
          x-terraform-force-new: true
      description: ''
    KafkaConnectClusterUpdateV2:
      required:
      - dataCentres
      type: object
      properties:
        dataCentres:
          maxItems: 1
          minItems: 1
          type: array
          description: List of datacentre settings.
          items:
            $ref: '#/components/schemas/KafkaConnectDataCentreV2'
        customConnectors:
          maxItems: 1
          type: array
          description: Defines the location for custom connector storage and access info.
          items:
            $ref: '#/components/schemas/KafkaConnectCustomConnectorsV2'
          x-insta-unchangeable: true
        description:
          type: string
          description: A description of the cluster
          example: Cluster managed by the integration team.
          x-terraform-computed: true
        twoFactorDelete:
          maxItems: 1
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/TwoFactorDeleteSettingsV2'
          x-terraform-computed: true
      description: ''
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    KafkaConnectClusterV2:
      required:
      - dataCentres
      - kafkaConnectVersion
      - name
      - privateNetworkCluster
      - slaTier
      - targetCluster
      type: object
      properties:
        dataCentres:
          maxItems: 1
          minItems: 1
          type: array
          description: List of data centre settings.
          items:
            $ref: '#/components/schemas/KafkaConnectDataCentreV2'
          x-terraform-field-name: data_centre
          x-terraform-ignore-order: true
        currentClusterOperationStatus:
          $ref: '#/components/schemas/CurrentClusterOperationStatusV2'
        privateNetworkCluster:
          type: boolean
          description: Creates the cluster with private network only, see [Private Network Clusters](https://www.instaclustr.com/support/documentation/useful-information/private-network-clusters/).
          example: true
          x-terraform-force-new: true
        kafkaConnectVersion:
          pattern: '[0-9]+\.[0-9]+\.[0-9]+'
          type: string
          description: 'Version of Kafka connect to run on the cluster. Available versions: <ul> <li>`3.9.2`</li> <li>`4.3.1`</li> <li>`4.2.1`</li> <li>`4.1.2`</li> </ul>'
          example: 1.2.3
          x-terraform-force-new: true
        targetCluster:
          maxItems: 1
          type: array
          description: Details to connect to a target Kafka Cluster cluster.
          items:
            $ref: '#/components/schemas/KafkaConnectTargetClusterDetailsV2'
          x-terraform-force-new: true
        name:
          maxLength: 48
          minLength: 3
          pattern: '[a-zA-Z0-9][a-zA-Z0-9_-]*'
          type: string
          description: Name of the cluster.
          example: exampleCluster
          x-terraform-force-new: true
        customConnectors:
          maxItems: 1
          type: array
          description: Defines the location for custom connector storage and access info.
          items:
            $ref: '#/components/schemas/KafkaConnectCustomConnectorsV2'
          x-insta-unchangeable: true
        description:
          type: string
          description: A description of the cluster
          example: Cluster managed by the integration team.
          x-terraform-computed: true
        twoFactorDelete:
          maxItems: 1
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/TwoFactorDeleteSettingsV2'
          x-terraform-computed: true
        id:
          type: string
          description: ID of the cluster.
          readOnly: true
          example: 4650aa98-e894-4675-9614-558915d5837a
        slaTier:
          $ref: '#/components/schemas/SlaTierV2'
        status:
          type: string
          description: Status of the cluster.
          readOnly: true
          example: RUNNING
      description: Data type for kafka connect specific properties
      example:
        dataCentres:
        - cloudProvider: AWS_VPC
          name: AWS_VPC_US_EAST_1
          network: 10.0.0.0/16
          nodeSize: KCN-PRD-c6g.4xlarge-80
          numberOfNodes: 3
          region: US_EAST_1
          replicationFactor: 3
        kafkaConnectVersion: '[x.y.z]'
        name: MyKafkaConnectCluster
        privateNetworkCluster: false
        slaTier: PRODUCTION
        targetCluster:
        - managedCluster:
          - kafkaConnectVpcType: VPC_PEERED
            targetKafkaClusterId: '[UUID of kafka cluster]'
    NodeDetailsV2:
      type: object
      properties:
        nodeRoles:
          type: array
          description: The roles or purposes of the node. Useful for filtering for nodes that have a specific role.
          readOnly: true
          items:
            $ref: '#/components/schemas/NodeRolesV2'
        rack:
          type: string
          description: Rack name in which the node is located.
          readOnly: true
        nodeSize:
          type: string
          description: Size of the node.
          readOnly: true
        privateAddress:
          type: string
          description: Private IP address of the node.
          readOnly: true
          example: 10.131.60.142
        deletionTime:
          type: string
          description: Deletion time of the node as a UTC timestamp
          readOnly: true
          example: '2019-08-24T14:15:22Z'
        publicAddress:
          type: string
          description: Public IP address of the node.
          readOnly: true
          example: 52.0.5.140
        startTime:
          type: string
          description: Start time of the node as a UTC timestamp
          readOnly: true
          example: '2019-08-24T14:15:22Z'
        id:
          type: string
          description: ID of the node.
          readOnly: true
          example: 9a27373a-0451-4121-94ba-873fc441f313
        status:
          type: string
          description: Provisioning status of the node.
          readOnly: true
          example: RUNNING
      description: ''
    ProviderTagV2:
      required:
      - key
      type: object
      properties:
        value:
          type: string
          description: Value of the custom tag.
          example: myTagValue
        key:
          type: string
          description: Key of the custom tag.
          example: myTagKey
          x-insta-unchangeable: true
      description: Custom tag for cloud provider resources.
    KafkaConnectCustomConnectorsAwsV2:
      required:
      - s3BucketName
      type: object
      properties:
        s3RoleArn:
          type: string
          description: AWS Identity Access Management role that is used for accessing your specified S3 bucket for Kafka Connect custom connector
          x-insta-unchangeable: true
        secretKey:
          type: string
          description: AWS Secret Key associated with the Access Key id that can access your specified S3 bucket for Kafka Connect custom connector.
          x-insta-unchangeable: true
          x-terraform-sensitive: true
        accessKey:
          type: string
          description: AWS Access Key id that can access your specified S3 bucket for Kafka Connect custom connector.
          x-insta-unchangeable: true
          x-terraform-sensitive: true
        s3BucketName:
          type: string
          description: S3 bucket name for Kafka Connect custom connector.
          x-insta-unchangeable: true
      description: ''
    TwoFactorDeleteSettingsV2:
      required:
      - confirmationEmail
      type: object
      properties:
        confirmationPhoneNumber:
          pattern: ^(?![\s])[\-\s\(\)\+0-9]*$
          type: string
          description: The phone number which will be contacted when the cluster is requested to be delete.
          x-terraform-computed: true
        confirmationEmail:
          pattern: ^(([\s]*[^<>()\[\]\\.,;:@\s"]+(\.[^<>()\[\]\\.,;:\s@"]+)*))@((\[\d{1,3}(\.\d{1,3}){3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}[\s]*))$
          type: string
          description: The email address which will be contacted when the cluster is requested to be deleted.
          x-terraform-computed: true
      description: ''
    SlaTierV2:
      type: string
      description: SLA Tier of the cluster. Non-production clusters may receive lower priority support and reduced SLAs. Production tier is not available when using Developer class nodes. See [SLA Tier](https://www.instaclustr.com/support/documentation/useful-information/sla-tier/) for more information.
      example: NON_PRODUCTION
      enum:
      - PRODUCTION
      - NON_PRODUCTION
      x-terraform-force-new: true
    ApplicationVersionsV2:
      type: object
      properties:
        application:
          $ref: '#/components/schemas/ApplicationEnumV2'
        versions:
          type: array
          description: List of sematic versions.
          example:
          - 1.0.0
          - 1.0.1
          items:
            pattern: '[0-9]+\.[0-9]+\.[0-9]+'
            type: string
      description: Object containing a single application and its available versions.
    CloudProviderNodeSizesListV2:
      type: object
      properties:
        cloudProviderNodeSizes:
          type: array
          description: List of all compatible cloud provider node sizes.
          items:
            $ref: '#/components/schemas/CloudProviderNodeSizesV2'
      description: Object containing list of node sizes grouped by cloud provider.
    CurrentClusterOperationStatusV2:
      type: string
      description: Indicates if the cluster is currently performing any restructuring operation such as being created or resized
      example: OPERATION_IN_PROGRESS
      enum:
      - NO_OPERATION
      - OPERATION_IN_PROGRESS
      - OPERATION_FAILED
      x-insta-tf-import-hidden: true
      x-terraform-field-status: true
    CloudProviderNodeSizesV2:
      type: object
      properties:
        nodeSizes:
          type: array
          description: List of node size names.
          example:
          - m5xl-400-v2
          - r5xl-2000-v2
          items:
            type: string
        cloudProvider:
          $ref: '#/components/schemas/CloudProviderEnumV2'
        document:
          type: string
          description: Cloud provider documentation of the virtual machine instances.
      description: Object containing list of compatible node sizes in a cloud provider.
    ApplicationVersionListV2:
      type: object
      properties:
        applicationVersions:
          type: array
          description: List of application versions.
          items:
            $ref: '#/components/schemas/ApplicationVersionsV2'
      description: Object containing all applications and their versions relating to a primary application.
    CdcNetworkDetailsV2:
      type: object
      properties:
        cidr:
          type: string
          description: Network CIDR in notation, for example 10.0.0.0/16.
          readOnly: true
          example: 10.1.0.0/16
        primary:
          type: boolean
          description: True when this entry is the data centre primary network.
          readOnly: true
          example: false
        status:
          type: string
          description: Provisioning status of the network registration.
          readOnly: true
          example: RUNNING
      description: A network CIDR associated with the data centre (primary or expanded secondary).
    ProviderAwsSettingsV2:
      type: object
      properties:
        ebsEncryptionKey:
          type: string
          description: ID of a KMS encryption key to encrypt data on nodes. KMS encryption key must be set in Cluster Resources through the Instaclustr Console before provisioning an encrypted Data Centre.
          format: uuid
          example: 9a27373a-0451-4121-94ba-873fc441f313
          x-insta-unchangeable: true
        customVirtualNetworkId:
          type: string
          description: VPC ID into which the Data Centre will be provisioned. The Data Centre's network allocation must match the IPv4 CIDR block of the specified VPC.
          x-insta-unchangeable: true
          x-terraform-computed: true
        storageNetwork:
          type: string
          description: 'The private network address block to be used for the storage network. This is only used for certain node sizes, currently limited to those which use AWS FSx ONTAP: for all other node sizes, this field should not be provided. The network must have a prefix length between /16 and /28, and must be part of a private address range.'
          example: 192.168.1.0/24
          x-insta-unchangeable: true
      description: ''
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
    KafkaConnectManagedTargetClusterDetailsV2:
      required:
      - kafkaConnectVpcType
      - targetKafkaClusterId
      type: object
      properties:
        kafkaConnectVpcType:
          type: string
          description: Available options are KAFKA_VPC, VPC_PEERED, SEPARATE_VPC
          example: SEPARATE_VPC
          x-terraform-force-new: true
        targetKafkaClusterId:
          type: string
          description: Target kafka cluster id.
          x-terraform-force-new: true
      description: ''
