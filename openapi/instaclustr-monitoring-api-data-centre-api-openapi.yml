components:
  schemas:
    Indicator:
      type: object
      properties:
        type:
          type: string
          description: The name of the indicator being returned
          example: DISK_USAGE
          enum:
          - REPLICATION_STRATEGY
          - REPLICATION_FACTOR
          - DISK_USAGE
          - PARTITION_SIZE
          - TOMBSTONE_LIVECELL
        stateDetails:
          type: object
          description: 'The state details of the indicator type. Object structure:</br><pre>{</br>    "stateDetails": {</br>        State: [</br>            Details</br>        ]</br>    }</br>}</pre><code>State</code> enum: <code>PASS</code>, <code>WARN</code>, <code>WARN_MULTI</code>, <code>FAIL</code>, <code>FAIL_MULTI</code>, <code>UNKNOWN</code></br><code>Detail</code> fields: <code>message</code>, <code>publicIp</code>, <code>privateIp</code></br>'
          example:
            PASS:
            - message: ''
              privateIp: 10.224.145.126
              publicIp: 52.5.37.217
            - message: ''
              privateIp: 10.224.80.183
              publicIp: 34.232.115.13
            - message: ''
              privateIp: 10.224.9.122
              publicIp: 34.233.151.239
    DataCentrePrimaryKey:
      type: object
      properties:
        name:
          type: string
          description: Name of data centre
          example: US_EAST_1
        provider:
          type: string
          description: Provider name
          example: AWS_VPC
          enum:
          - AWS
          - AWS_VPC
          - RACKSPACE
          - AZURE_AZ
          - VAGRANT
          - GCP
          - SOFTLAYER_BARE_METAL
          - ONPREMISES
      description: DataCentre of the rack
    GenericMapResponseSchema:
      type: object
    ErrorMessage:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        errorDetails:
          type: object
        code:
          type:
          - integer
          - 'null'
          format: int32
        link:
          type:
          - string
          - 'null'
    RackPrimaryKey:
      type: object
      properties:
        name:
          type: string
          description: Rack name
          example: us-east-1a
        dataCentre:
          $ref: '#/components/schemas/DataCentrePrimaryKey'
        providerAccount:
          $ref: '#/components/schemas/ProviderAccountPrimaryKey'
      description: Node rack information
    ProviderAccountPrimaryKey:
      type: object
      properties:
        name:
          type: string
          description: Provider account
          example: INSTACLUSTR
        provider:
          type: string
          description: Provider name
          example: AWS_VPC
          enum:
          - AWS
          - AWS_VPC
          - RACKSPACE
          - AZURE_AZ
          - VAGRANT
          - GCP
          - SOFTLAYER_BARE_METAL
          - ONPREMISES
      description: Provider information including name and account
    MonitoringResultMixedSchema:
      type: object
      properties:
        publicIp:
          type: string
          description: Public IP of the node
          example: 123.123.123.123
        privateIp:
          type: string
          description: Private IP of the node
          example: 10.0.0.1
        rack:
          $ref: '#/components/schemas/RackPrimaryKey'
        nodeSize:
          type: string
          description: Node size
          example: SRH-PRD-r6g.large-250
    PaginatedResult:
      type: object
      properties:
        totalResults:
          type: integer
          format: int32
        startIndex:
          type: integer
          format: int32
        itemsPerPage:
          type: integer
          format: int32
        resources:
          type: array
          items:
            type: object
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
