openapi: 3.2.0
info:
  title: Instaclustr Monitoring API - Data Centre API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Monitoring API - Data Centre across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Monitoring API - Data Centre
  description: Operations related to monitoring data centres of provisioned clusters
  x-insta-tag-group: Monitoring
paths:
  /monitoring/v1/datacentres/{clusterDataCentreId}:
    get:
      tags:
      - Monitoring API - Data Centre
      summary: Retrieve monitoring metrics
      description: Metrics definitions for single or all nodes in a cluster or cluster data center.The set of available metrics will expand with changes to the monitoring API.
      operationId: getDataCentreMetrics
      parameters:
      - name: clusterDataCentreId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        example: 6b776f1d-5b74-4b46-b813-a94b9c1282ca
      - name: metrics
        in: query
        description: The metrics to return are specified as a comma-delimited query string parameter. Up to 20 metrics may be specified.
        required: true
        style: form
        explode: true
        schema:
          type: string
        example: n::cpuUtilization,n::networkout
      - name: period
        in: query
        description: 'The period of time from which monitoring information is returned. It is also assigned a period type. Formatted as: <code>period=\<period\>&type=\<period type\></code>.<br>Allowable values: 1m, 15m, 1h, 3h, 1d, 7d, 30d'
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 1m
      - name: type
        in: query
        description: "The type of metrics value extracted from metrics values for a period of time.\n<ul>\n   <li>If specified as 'latest', then the latest metric will be returned regardless what 'period' query parameter is set.</li>\n   <li>If specified as 'aggregate', then the metric value returned will be the average of all metric values from the specific period to now.</li>\n   <li>If specified as 'range', then the metric values returned will be the series of all metric values from the specific period to end.</li>\n</ul>"
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: latest
      - name: reportNaN
        in: query
        description: If a metric value is NaN or null, reportNaN determines whether API should report it as NaN. The default behaviour is false and NaN and null will be reported as 0. Setting <code>reportNaN=true</code> will return NaN values in the API response.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
        example: false
      - name: end
        in: query
        description: This parameter can be used to specify the end time for the retrieved metric values. For example, if you set this to a timestamp which is 10 minutes prior to the current time, the metric values returned will be for that point of time. Please note that the format is milliseconds since Epoch.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 1597112465640
      - name: format
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          description: "<ul>\n  <li>If set to DEFAULT, response will be returned in JSON format.</li>\n  <li>If set to PROMETHEUS, text response will be returned in Prometheus format.</li>\n  <li>If not provided, response will be returned in default format, i.e. JSON.</li>\n</ul>"
          example: PROMETHEUS
          enum:
          - DEFAULT
          - PROMETHEUS
      responses:
        '200':
          description: Successfully retrieved monitoring results of metrics set.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonitoringResultMixedSchema'
              examples:
