openapi: 3.2.0
info:
  title: Instaclustr Karapace Schema Registry User API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Karapace Schema Registry User across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Karapace Schema Registry User
  description: Operations relating to the Karapace Schema Registry user.
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/data-sources/karapace_schema_registry_cluster/{clusterId}/karapace-schema-registry-users/v2/:
    parameters:
    - name: clusterId
      in: path
      description: ID of the cluster.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    x-terraform-resource-name: users_v2
    get:
      tags:
      - Karapace Schema Registry User
      summary: List all Karapace Schema Registry users
      responses:
        '200':
          description: Successfully retrieved application users of Karapace Schema Registry.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KarapaceSchemaRegistryUserSummariesV2'
      operationId: getClusterManagementV2DataSourcesKarapaceSchemaRegistryClusterByClusterIdKarapaceSchemaRegistryUsersV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  ? /cluster-management/v2/operations/applications/karapace-schema-registry/clusters/v2/{clusterId}/users/v2/{userName}/change-password/v2
  : parameters:
    - name: clusterId
      in: path
      description: ID of the Karapace Schema Registry cluster.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    - name: userName
      in: path
      description: Name of the Karapace Schema Registry user.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: string
    put:
      tags:
      - Karapace Schema Registry User
      summary: Change a Karapace Schema Registry user password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KarapaceSchemaRegistryUserPasswordV2'
        required: true
      responses:
        '202':
          description: Requested Karapace Schema Registry user's password update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KarapaceSchemaRegistryUserPasswordV2'
        '404':
          description: Karapace Schema Registry cluster not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
      x-codegen-request-body-name: body
      operationId: putClusterManagementV2OperationsApplicationsKarapaceSchemaRegistryClustersV2ByClusterIdUsersV2ByUserNameChangePasswordV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    KarapaceSchemaRegistryUserSummaryV2:
      required:
      - clusterId
      - username
      type: object
      properties:
        clusterId:
          type: string
          description: ID of the Kafka cluster.
          format: uuid
          x-terraform-force-new: true
        id:
          type: string
          description: 'Instaclustr identifier for the Karapace Schema Registry user. The value of this property has the form: [cluster-id]_[karapace-schema-registry-username]'
          readOnly: true
        username:
          pattern: '[a-zA-Z0-9][a-zA-Z0-9_-]*$'
          type: string
          description: Username of the Karapace Schema Registry user.
          x-terraform-force-new: true
      description: Summary of a Karapace Schema Registry User to be applied to a Kafka cluster.
      example:
        clusterId: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
        id: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37_myKafkaUser
        username: myKarapaceSchemaRegistryUser
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
    KarapaceSchemaRegistryUserPasswordV2:
      required:
      - password
      type: object
      properties:
        password:
          type: string
          description: Password for the Karapace Schema Registry user.
          format: password
          example: my1password!
          x-terraform-sensitive: true
          x-terraform-write-only: true
      description: Definition of a Karapace Schema Registry User Password Update to be applied to a Karapace Schema Registry user.
      example:
        password: my1password!
    KarapaceSchemaRegistryUserSummariesV2:
      type: object
      properties:
        karapaceSchemaRegistryUsers:
          type: array
          description: List of all Karapace Schema Registry users in the cluster.
          items:
            $ref: '#/components/schemas/KarapaceSchemaRegistryUserSummaryV2'
        clusterId:
          type: string
          description: ID of the kafka cluster
          x-terraform-id: true
      description: A listable data source of all Karapace Schema Registry users within a Kafka Cluster.
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
