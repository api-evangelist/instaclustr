openapi: 3.2.0
info:
  title: Instaclustr AWS Prefix List Firewall Rule V1 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged AWS Prefix List Firewall Rule V1 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: AWS Prefix List Firewall Rule V1
  description: Operations related to AWS prefix list firewall rule
  x-insta-tag-group: Cluster Management V2
paths:
  ? /cluster-management/v2/data-sources/providers/aws/aws_cluster_data_centre/{clusterDataCentreId}/prefix-list-firewall-rules/v1
  : parameters:
    - name: clusterDataCentreId
      in: path
      description: ID of the cluster data centre.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    x-terraform-resource-name: prefix_list_firewall_rules_v1
    get:
      tags:
      - AWS Prefix List Firewall Rule V1
      summary: List all prefix list firewall rules
      responses:
        '200':
          description: Successfully retrieved AWS prefix list firewall rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AwsPrefixListFirewallRulesV1'
      operationId: getClusterManagementV2DataSourcesProvidersAwsAwsClusterDataCentreByClusterDataCentreIdPrefixListFirewallRulesV1
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/providers/aws/prefix-list-firewall-rules/v1:
    x-terraform-resource-name: aws_prefix_list_firewall_rule_v1
    post:
      tags:
      - AWS Prefix List Firewall Rule V1
      summary: Add an AWS prefix list firewall rule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwsPrefixListFirewallRuleV1'
        required: true
      responses:
        '202':
          description: Successfully added the AWS prefix list firewall rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwsPrefixListFirewallRuleV1'
              example:
                clusterDataCentreId: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
                deferredReason: ''
                id: 47ac0d3e-1b2f-4e8a-9c3d-5e6f708192a4
                prefixListId: pl-01abc2345defg6789
                status: GENESIS
                type: CASSANDRA_CQL
          x-terraform-resource-poll-completed-statuses: RUNNING
          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: GENESIS,PROVISIONING
        '409':
          description: A matching firewall rule already exists for the prefix list in the cluster data centre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
      x-codegen-request-body-name: body
      x-terraform-resource-timeout: 99999m
      operationId: postClusterManagementV2ResourcesProvidersAwsPrefixListFirewallRulesV1
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/providers/aws/prefix-list-firewall-rules/v1/{firewallRuleId}:
    parameters:
    - name: firewallRuleId
      in: path
      description: ID of the AWS prefix list firewall rule.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - AWS Prefix List Firewall Rule V1
      summary: Get AWS prefix list firewall rule details
      responses:
        '200':
          description: Retrieved the details of the AWS prefix list firewall rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwsPrefixListFirewallRuleV1'
              example:
                clusterDataCentreId: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
                deferredReason: ''
                id: 47ac0d3e-1b2f-4e8a-9c3d-5e6f708192a4
                prefixListId: pl-01abc2345defg6789
                status: GENESIS
                type: CASSANDRA_CQL
        '404':
          description: Aws prefix list firewall rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: getClusterManagementV2ResourcesProvidersAwsPrefixListFirewallRulesV1ByFirewallRuleId
      x-operation-id-source: derived
    delete:
      tags:
      - AWS Prefix List Firewall Rule V1
      summary: Delete AWS prefix list firewall rule
      responses:
        '204':
          description: Aws Prefix List Firewall Rule successfully deleted.
          content: {}
        '404':
          description: Aws Prefix List Firewall Rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: deleteClusterManagementV2ResourcesProvidersAwsPrefixListFirewallRulesV1ByFirewallRuleId
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    FirewallRuleTypesV2:
      type: string
      description: The type of firewall rule.
      example: CASSANDRA_CQL
      enum:
      - APACHE_ZOOKEEPER
      - CADENCE
      - CADENCE_GRPC
      - CADENCE_HTTP_API
      - CADENCE_WEB
      - CASSANDRA
      - CASSANDRA_CQL
      - CLICKHOUSE
      - CLICKHOUSE_WEB
      - ELASTICSEARCH
      - KAFKA
      - KAFKA_CONNECT
      - KAFKA_ENCRYPTION
      - KAFKA_MTLS
      - KAFKA_NO_ENCRYPTION
      - KAFKA_PRIVATE_SASL_PLAINTEXT_LISTENER
      - KAFKA_PUBLIC_SASL_PLAINTEXT_LISTENER
      - KAFKA_PRIVATE_PLAINTEXT_LISTENER
      - KAFKA_PUBLIC_PLAINTEXT_LISTENER
      - KAFKA_PRIVATE_SSL_LISTENER
      - KAFKA_PUBLIC_SSL_LISTENER
      - KAFKA_REST_PROXY
      - KAFKA_SCHEMA_REGISTRY
      - KARAPACE_REST_PROXY
      - KARAPACE_SCHEMA_REGISTRY
      - OPENSEARCH
      - OPENSEARCH_DASHBOARDS
      - PGBOUNCER
      - POSTGRESQL
      - REDIS
      - VALKEY
      - SEARCH_DASHBOARDS
      - SECURE_APACHE_ZOOKEEPER
      - SPARK
      - SPARK_JOBSERVER
      - SHOTOVER_PROXY
      - MCP_GATEWAY
      - KAFKA_DISKLESS
      x-terraform-force-new: true
    AwsPrefixListFirewallRuleV1:
      required:
      - clusterDataCentreId
      - prefixListId
      - type
      type: object
      properties:
        clusterDataCentreId:
          type: string
          description: ID of the cluster data centre for the AWS prefix list firewall rule.
          format: uuid
          example: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
          x-terraform-force-new: true
        deferredReason:
          type: string
          description: The reason (if needed) for the deferred status of the AWS prefix list firewall rule
          readOnly: true
          example: RETRY_LATER
        prefixListId:
          type: string
          description: The prefix list ID of the AWS prefix list firewall rule.
          example: pl-01abc2345defg6789
          x-terraform-force-new: true
        id:
          type: string
          description: ID of the AWS prefix list firewall rule.
          format: uuid
          readOnly: true
          example: 47ac0d3e-1b2f-4e8a-9c3d-5e6f708192a4
        type:
          $ref: '#/components/schemas/FirewallRuleTypesV2'
        status:
          type: string
          description: The status of the AWS prefix list firewall rule.
          readOnly: true
          example: RUNNING
          x-terraform-field-status: true
      description: Definition of an AWS Prefix List based firewall rule to be applied to a cluster data centre. Only supported for Bring Your Own Cloud (BYOC) data centres.
      example:
        clusterDataCentreId: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
        prefixListId: pl-01abc2345defg6789
        type: CASSANDRA_CQL
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    AwsPrefixListFirewallRulesV1:
      type: object
      properties:
        clusterDataCentreId:
          type: string
          description: ID of the parent AWS cluster data centre.
          format: uuid
          example: 91346037-b969-4c4d-8112-59e1d2aa67e9
          x-terraform-id: true
        firewallRules:
          type: array
          description: AWS prefix list firewall rules in the cluster data centre.
          items:
            $ref: '#/components/schemas/AwsPrefixListFirewallRuleV1'
      description: A listable data source of all AWS Prefix List based firewall rules in an Instaclustr managed cluster data centre. Only supported for Bring Your Own Cloud (BYOC) data centres.
      example:
        clusterDataCentreId: 91346037-b969-4c4d-8112-59e1d2aa67e9
        firewallRules:
        - clusterDataCentreId: 91346037-b969-4c4d-8112-59e1d2aa67e9
          prefixListId: pl-903004f01234567ab
          type: CASSANDRA_CQL
        - clusterDataCentreId: 91346037-b969-4c4d-8112-59e1d2aa67e9
          prefixListId: pl-903004f61234567cd
          type: CASSANDRA_CQL
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
