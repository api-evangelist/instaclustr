        required: true
      responses:
        '202':
          description: Kafka user provisioning requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaUserV5'
              example:
                authMechanism: SASL
                clusterId: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
                currentOperationStatus: OPERATION_IN_PROGRESS
                id: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37_myKafkaUser
                password: myPassword1.
                saslScramMechanism: SCRAM-SHA-256
                username: myKafkaUser
          x-terraform-resource-poll-completed-statuses: NO_OPERATION
          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: OPERATION_IN_PROGRESS
      x-codegen-request-body-name: body
      operationId: postClusterManagementV2ResourcesApplicationsKafkaUsersV5
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
