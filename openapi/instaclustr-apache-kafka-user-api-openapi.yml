openapi: 3.2.0
info:
  title: Instaclustr Apache Kafka User API
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  version: '1.0'
  description: 'Operations tagged Apache Kafka User across 4 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-deprecated-openapi.json, instaclustr-deprecated-openapi.yml, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Apache Kafka User
  description: ''
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/data-sources/kafka_cluster/{clusterId}/users/v2/:
    parameters:
    - name: clusterId
      in: path
      description: ID of the Kafka cluster.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    x-terraform-resource-name: users_v2
    get:
      tags:
      - Apache Kafka User
      summary: List all Kafka users
      description: Retrieve a list of the kafka users existing in the given cluster.
      responses:
        '200':
          description: Successfully retrieved Kafka users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KafkaUserSummariesV2'
      operationId: getClusterManagementV2DataSourcesKafkaClusterByClusterIdUsersV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/data-sources/kafka_users/{kafkaUserId}/certificates/v2/:
    parameters:
    - name: kafkaUserId
      in: path
      description: ID of the Kafka user which formed by combining ClusterId and Kafka username (ClusterID_Username).
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: string
    x-terraform-resource-name: user_certificates_v2
    get:
      tags:
      - Apache Kafka User
      summary: List all active certificate of a given kafka user
      description: Retrieve a list of client certificates of a given kafka user.
      responses:
        '200':
          description: Successfully retrieved user's certificates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KafkaUserCertificateV2'
              example:
              - clusterId: Id of the kafka cluster
                csr: generated csr string
                expiryDate: Date certificate expires.
                id: ID of the certificate.
                kafkaUsername: kafka username
                signedCertificate: Generated client signed certificate
                validPeriod: 120
      operationId: getClusterManagementV2DataSourcesKafkaUsersByKafkaUserIdCertificatesV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/operations/applications/kafka/user-certificates/renew/v2:
    post:
      tags:
      - Apache Kafka User
      summary: Renew a Kafka user's certificate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KafkaUserCertificateRenewalRequestV2'
        required: true
      responses:
        '202':
          description: Successfully renew the Kafka user's certificate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaUserCertificateV2'
              example:
                clusterId: Id of the kafka cluster
                csr: generated csr string
                expiryDate: Date certificate expires.
                id: ID of the certificate.
                kafkaUsername: kafka username
                signedCertificate: Generated client signed certificate
                validPeriod: 120
      x-codegen-request-body-name: body
      operationId: postClusterManagementV2OperationsApplicationsKafkaUserCertificatesRenewV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/operations/applications/kafka/user-certificates/{certificateId}/download/v2:
    parameters:
    - name: certificateId
      in: path
      description: ID of the Certificate.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    get:
      tags:
      - Apache Kafka User
      summary: Download a Kafka user's certificate
      responses:
        '200':
          description: Successfully renew the Kafka user's certificate
          content:
            application/zip:
              schema:
                type: string
                format: binary
      operationId: getClusterManagementV2OperationsApplicationsKafkaUserCertificatesByCertificateIdDownloadV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
