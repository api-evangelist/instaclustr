          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: OPERATION_IN_PROGRESS
      x-codegen-request-body-name: body
      operationId: putClusterManagementV2ResourcesApplicationsKafkaUsersV5ByKafkaUserId
