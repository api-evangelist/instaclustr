components:
  schemas:
    KafkaUserCertificateV2:
      required:
      - clusterId
      - csr
      - kafkaUsername
      - validPeriod
      type: object
      properties:
        expiryDate:
          type: string
          description: Date certificate expires.
          format: string
          readOnly: true
        csr:
          type: string
          description: Certificate signing request.
          format: string
          x-terraform-force-new: true
        kafkaUsername:
          type: string
          description: The Kafka username
          x-terraform-force-new: true
        clusterId:
          type: string
          description: ID of the kafka cluster
          x-terraform-force-new: true
        id:
          type: string
          description: ID of the certificate.
          format: string
          readOnly: true
        signedCertificate:
          type: string
          description: Generated client signed certificate.
          format: string
          readOnly: true
        validPeriod:
          maximum: 120
          minimum: 3
          type: integer
          description: Number of months for which the certificate will be valid.
          x-terraform-force-new: true
      description: Certificate signing request.
      example:
        clusterId: Id of the kafka cluster
        csr: generated csr string
        kafkaUsername: kafka username
        validPeriod: 120
    KafkaSaslScramMechanism:
      type: string
      description: 'Scram Mechanism for SASL authentication. Valid values: SCRAM-SHA-256, SCRAM-SHA-512'
    KafkaUserSummariesV2:
      type: object
      properties:
        clusterId:
          type: string
          description: ID of the kafka cluster
          x-terraform-id: true
        kafkaUsers:
          type: array
          description: List of all Kafka users in the cluster.
          items:
            $ref: '#/components/schemas/KafkaUserSummaryV2'
      description: A listable data source of all Kafka users within a Kafka Cluster.
    KafkaUserUpdateV5:
      required:
      - authMechanism
      - clusterId
      - username
      type: object
      properties:
        currentOperationStatus:
          $ref: '#/components/schemas/CurrentOperationStatus'
        password:
          type: string
          description: Password for the Kafka user.
          format: password
          x-terraform-sensitive: true
          x-terraform-write-only: true
        saslScramMechanism:
          $ref: '#/components/schemas/KafkaSaslScramMechanism'
        authMechanism:
          $ref: '#/components/schemas/KafkaAuthMechanismsEnumV2'
        clusterId:
          type: string
          description: ID of the Kafka cluster.
          format: uuid
          x-terraform-force-new: true
        id:
          type: string
          description: 'Instaclustr identifier for the Kafka user. The value of this property has the form: [cluster-id]_[kafka-username]'
          readOnly: true
        username:
          pattern: ^(?![zZ][oO][oO][kK][eE][eE][pP][eE][rR]$)[a-zA-Z0-9][a-zA-Z0-9_-]*$
          type: string
          description: Username of the Kafka user.
          x-terraform-force-new: true
      description: Definition of a Kafka User Update to be applied to a Kafka cluster.
      example:
        authMechanism: SASL
        clusterId: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
        password: myPassword1.
        saslScramMechanism: SCRAM-SHA-256
        username: myKafkaUser
    KafkaUserSummaryV2:
      required:
      - clusterId
      - username
      type: object
      properties:
        authMechanism:
          $ref: '#/components/schemas/KafkaAuthMechanismsEnumV2'
        clusterId:
          type: string
          description: ID of the Kafka cluster.
          format: uuid
          x-terraform-force-new: true
        id:
          type: string
          description: 'Instaclustr identifier for the Kafka user. The value of this property has the form: [cluster-id]_[kafka-username]'
          readOnly: true
        username:
          pattern: ^(?![zZ][oO][oO][kK][eE][eE][pP][eE][rR]$)[a-zA-Z0-9][a-zA-Z0-9_-]*$
          type: string
          description: Username of the Kafka user.
          x-terraform-force-new: true
      description: Summary of a Kafka User to be applied to a Kafka cluster.
      example:
        authMechanism: SASL
        clusterId: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
        id: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37_myKafkaUser
        username: myKafkaUser
    KafkaUserV5:
      required:
      - authMechanism
      - clusterId
      - username
      type: object
      properties:
        currentOperationStatus:
          $ref: '#/components/schemas/CurrentOperationStatus'
        password:
          type: string
          description: Password for the Kafka user.
          format: password
          x-terraform-sensitive: true
          x-terraform-write-only: true
        saslScramMechanism:
          $ref: '#/components/schemas/KafkaSaslScramMechanism'
        authMechanism:
          $ref: '#/components/schemas/KafkaAuthMechanismsEnumV2'
        clusterId:
          type: string
          description: ID of the Kafka cluster.
          format: uuid
          x-terraform-force-new: true
        id:
          type: string
          description: 'Instaclustr identifier for the Kafka user. The value of this property has the form: [cluster-id]_[kafka-username]'
          readOnly: true
        username:
          pattern: ^(?![zZ][oO][oO][kK][eE][eE][pP][eE][rR]$)[a-zA-Z0-9][a-zA-Z0-9_-]*$
          type: string
          description: Username of the Kafka user.
          x-terraform-force-new: true
      description: Definition of a Kafka User to be applied to a Kafka cluster.
      example:
        authMechanism: SASL
        clusterId: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
        password: myPassword1.
        saslScramMechanism: SCRAM-SHA-256
        username: myKafkaUser
    KafkaUserCertificateRenewalRequestV2:
      required:
      - certificateId
      type: object
      properties:
        certificateId:
