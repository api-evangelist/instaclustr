    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/kafka/users/v5:
    x-terraform-resource-name: kafka_user_v5
    post:
      tags:
      - Apache Kafka User
      summary: Create a Kafka User
      requestBody:
        content:
          application/json:
            schema:
