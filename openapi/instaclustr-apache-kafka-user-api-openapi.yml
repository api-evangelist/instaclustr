      summary: Delete a Kafka user's certificate
      responses:
        '204':
          description: Successfully processed the delete user's certificate.
          content: {}
      operationId: deleteClusterManagementV2ResourcesApplicationsKafkaUserCertificatesV2ByCertificateId
