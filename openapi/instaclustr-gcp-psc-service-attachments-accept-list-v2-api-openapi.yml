components:
  schemas:
    GcpServiceAttachmentAcceptProjectLimitV2:
      required:
      - acceptProjectId
      - connectionLimit
      type: object
      properties:
        connectionLimit:
          type: integer
          description: The connection limit for the project or network
        acceptProjectId:
          pattern: ^(?!.*(google|null|undefined|ssl))^[a-z][a-z0-9-]{4,28}[a-z0-9]$
          type: string
          description: The accepted project ID
        acceptNetworkName:
          pattern: (^[a-z][a-z0-9-]{0,61}[a-z0-9]$|^$)
          type: string
          description: The accepted network name of the parent project ID
      description: Definition of an consumer accepted item being used for GCP Service Attachment Accept List.
      example:
        acceptNetworkName: network-1
        acceptProjectId: project-1
        connectionLimit: 10
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    GcpServiceAttachmentAcceptListV2:
      required:
      - cdcId
      - consumerAcceptList
      type: object
      properties:
        operationStatus:
          $ref: '#/components/schemas/CurrentOperationStatus'
        id:
          type: string
          description: The Instaclustr ID of the GCP Service Attachments Accept List.
          format: uuid
          readOnly: true
          x-terraform-id: true
        consumerAcceptList:
          type: array
          description: Consumer projects or networks that are allowed to connect to the GCP Service Attachments.
          items:
            $ref: '#/components/schemas/GcpServiceAttachmentAcceptProjectLimitV2'
        cdcId:
          type: string
          description: ID of the Cluster Data Centre.
          format: uuid
          example: ddf992f6-96fb-4cce-b87c-f225df7f1745
      description: List of accepted consumer projects or networks for a Cluster Data Center
      example:
        cdcId: ddf992f6-96fb-4cce-b87c-f225df7f1745
        consumerAcceptList:
        - acceptNetworkName: network-1
          acceptProjectId: project-1
          connectionLimit: 10
    CurrentOperationStatus:
      type: string
      description: Indicates if the cluster is currently performing any operation such as being created, updated, or deleted
      example: OPERATION_IN_PROGRESS
      enum:
      - NO_OPERATION
      - OPERATION_IN_PROGRESS
      - OPERATION_FAILED
      x-insta-tf-import-hidden: true
      x-terraform-field-status: true
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
