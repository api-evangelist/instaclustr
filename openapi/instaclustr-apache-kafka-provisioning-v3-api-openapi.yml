    KafkaRestProxyDetailsV2:
      required:
      - integrateRestProxyWithSchemaRegistry
      - version
      type: object
      properties:
        integrateRestProxyWithSchemaRegistry:
          type: boolean
          description: Enables Integration of the REST proxy with a Schema registry.
          example: false
        schemaRegistryPassword:
          type: string
          description: Password to use when connecting to the Kafka schema registry. Requires 'integrateRestProxyWithSchemaRegistry' to be 'true' and useLocalSchemaRegistry to be 'false'.
          x-terraform-computed: true
          x-terraform-sensitive: true
        schemaRegistryServerUrl:
          type: string
          description: URL of the Kafka schema registry to integrate with. Requires 'integrateRestProxyWithSchemaRegistry' to be 'true' and useLocalSchemaRegistry to be 'false'.
          x-terraform-computed: true
        schemaRegistryUsername:
          type: string
          description: Username to use when connecting to the Kafka schema registry. Requires 'integrateRestProxyWithSchemaRegistry' to be 'true' and useLocalSchemaRegistry to be 'false'.
          x-terraform-computed: true
        useLocalSchemaRegistry:
          type: boolean
          description: Integrates the REST proxy with the Schema registry attached to this cluster. Requires 'integrateRestProxyWithSchemaRegistry' to be 'true'.
          example: false
          x-terraform-computed: true
        version:
          pattern: '[0-9]+\.[0-9]+\.[0-9]+'
          type: string
          description: 'Adds the specified version of Kafka REST Proxy to the Kafka cluster. Available versions: <ul> </ul>'
          example: 5.0.0
      description: ''
