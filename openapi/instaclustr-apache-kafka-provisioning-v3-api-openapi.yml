openapi: 3.2.0
info:
  title: Instaclustr Apache Kafka Provisioning V3 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Apache Kafka Provisioning V3 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Apache Kafka Provisioning V3
  description: Operations relating to the Apache Kafka Rest Proxy user.
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/data-sources/kafka_cluster/{clusterId}/client-telemetry-subscriptions/:
    parameters:
    - name: clusterId
      in: path
      description: ID of the Kafka cluster.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    x-terraform-resource-name: client_metric_subscriptions
    get:
      tags:
      - Apache Kafka Provisioning V3
      summary: List all Kafka client telemetry subscriptions
      description: Retrieve a list of the kafka client telemetry subscriptions in the given cluster.
      responses:
        '200':
          description: Successfully retrieved Kafka client telemetry subscriptions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KafkaClientTelemetrySubscription'
      operationId: getClusterManagementV2DataSourcesKafkaClusterByClusterIdClientTelemetrySubscriptions
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/kafka/client-telemetry-subscriptions:
    x-terraform-resource-name: kafka_client_metric_subscription
    post:
      tags:
      - Apache Kafka Provisioning V3
      summary: Create a Kafka client telemetry subscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KafkaClientTelemetrySubscription'
        required: true
      responses:
        '202':
          description: Kafka client telemetry subscription provisioning requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaClientTelemetrySubscription'
      x-codegen-request-body-name: body
      operationId: postClusterManagementV2ResourcesApplicationsKafkaClientTelemetrySubscriptions
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/kafka/client-telemetry-subscriptions/{kafkaClientTelemetrySubscriptionId}:
    parameters:
    - name: kafkaClientTelemetrySubscriptionId
      in: path
      description: ID of the Kafka client telemetry subscription
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Apache Kafka Provisioning V3
      summary: Get Kafka client telemetry subscription details
      responses:
        '200':
          description: Kafka client telemetry subscription retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaClientTelemetrySubscription'
      operationId: getClusterManagementV2ResourcesApplicationsKafkaClientTelemetrySubscriptionsByKafkaClientTelemetrySubscriptionId
      x-operation-id-source: derived
    put:
      tags:
      - Apache Kafka Provisioning V3
      summary: Update Kafka client telemetry subscription configuration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KafkaClientTelemetrySubscription'
        required: true
      responses:
        '202':
          description: Requested Kafka client telemetry subscription update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaClientTelemetrySubscription'
      x-codegen-request-body-name: body
      operationId: putClusterManagementV2ResourcesApplicationsKafkaClientTelemetrySubscriptionsByKafkaClientTelemetrySubscriptionId
      x-operation-id-source: derived
    delete:
      tags:
      - Apache Kafka Provisioning V3
      summary: Delete the kafka client telemetry subscription
      responses:
        '204':
          description: Kafka client telemetry subscription deletion requested
          content: {}
      operationId: deleteClusterManagementV2ResourcesApplicationsKafkaClientTelemetrySubscriptionsByKafkaClientTelemetrySubscriptionId
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/kafka/clusters/v3:
    x-terraform-resource-name: kafka_cluster_v3
    post:
      tags:
      - Apache Kafka Provisioning V3
      summary: Create a Kafka cluster
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KafkaClusterV3'
        required: true
      responses:
        '202':
          description: Kafka Cluster provisioning requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaClusterV3'
              example:
                allowDeleteTopics: true
                autoCreateTopics: true
                clientToClusterEncryption: true
                currentClusterOperationStatus: OPERATION_IN_PROGRESS
                dataCentres:
                - cloudProvider: AWS_VPC
                  id: 4650aa98-e894-4675-9614-558915d5837a
                  name: AWS_VPC_US_EAST_1
                  network: 10.0.0.0/16
                  nodeSize: KFK-PRD-r6g.large-250
                  nodes:
                  - id: 94c1ad54-c6f1-4f2e-8634-be9f5fb47fad
                    nodeRoles:
                    - KAFKA_BROKER
                    nodeSize: KFK-PRD-r6g.large-250
                    privateAddress: 10.0.5.23
                    publicAddress: 24.135.55.176
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: cc317853-be79-4100-898f-c12e4610a892
                    nodeRoles:
                    - KAFKA_BROKER
                    nodeSize: KFK-PRD-r6g.large-250
                    privateAddress: 10.0.128.45
                    publicAddress: 193.146.159.238
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: b401b5bb-8a6f-4aa7-99c4-12fe445941c3
                    nodeRoles:
                    - KAFKA_BROKER
                    nodeSize: KFK-PRD-r6g.large-250
                    privateAddress: 10.0.200.78
                    publicAddress: 108.21.43.134
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  numberOfNodes: 3
                  region: US_EAST_1
                  status: RUNNING
                dedicatedZookeeper:
                - zookeeperNodeCount: 3
                  zookeeperNodeSize: KDZ-PRD-m6g.large-80
                defaultNumberOfPartitions: 3
                defaultReplicationFactor: 3
                id: 4650aa98-e894-4675-9614-558915d5837a
                kafkaVersion: '[x.y.z]'
                name: MyKafkaCluster
                pciComplianceMode: false
                privateNetworkCluster: false
                slaTier: PRODUCTION
                status: RUNNING
          x-terraform-resource-poll-completed-statuses: NO_OPERATION
          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: OPERATION_IN_PROGRESS
      x-codegen-request-body-name: body
      x-terraform-resource-timeout: 99999m
      operationId: postClusterManagementV2ResourcesApplicationsKafkaClustersV3
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/kafka/clusters/v3/{clusterId}:
    parameters:
    - name: clusterId
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Apache Kafka Provisioning V3
      summary: Get Kafka cluster details
      description: Get Kafka cluster details.
      operationId: getKafkaClusterV3
      responses:
        '200':
          description: Kafka cluster details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaClusterV3'
              example:
                allowDeleteTopics: true
