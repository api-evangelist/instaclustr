            $ref: '#/components/schemas/KafkaTieredStorageS3SettingsV2'
          x-insta-unchangeable: true
          x-terraform-force-new: true
        gcsSettings:
          maxItems: 1
          type: array
          description: Defines the GCS bucket that will be used to store remote objects for GCP tiered storage.
          items:
            $ref: '#/components/schemas/KafkaTieredStorageGcsSettings'
          x-insta-unchangeable: true
          x-terraform-force-new: true
