                  network: 10.0.0.0/16
                  nodeSize: KFK-PRD-r6g.large-250
                  nodes:
                  - id: 94c1ad54-c6f1-4f2e-8634-be9f5fb47fad
                    nodeRoles:
                    - KAFKA_BROKER
                    nodeSize: KFK-PRD-r6g.large-250
                    privateAddress: 10.0.5.23
                    publicAddress: 24.135.55.176
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: cc317853-be79-4100-898f-c12e4610a892
                    nodeRoles:
                    - KAFKA_BROKER
                    nodeSize: KFK-PRD-r6g.large-250
                    privateAddress: 10.0.128.45
                    publicAddress: 193.146.159.238
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: b401b5bb-8a6f-4aa7-99c4-12fe445941c3
                    nodeRoles:
                    - KAFKA_BROKER
                    nodeSize: KFK-PRD-r6g.large-250
                    privateAddress: 10.0.200.78
                    publicAddress: 108.21.43.134
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  numberOfNodes: 3
                  region: US_EAST_1
                  status: RUNNING
                dedicatedZookeeper:
                - zookeeperNodeCount: 3
                  zookeeperNodeSize: KDZ-PRD-m6g.large-80
                defaultNumberOfPartitions: 3
                defaultReplicationFactor: 3
                id: 4650aa98-e894-4675-9614-558915d5837a
                kafkaVersion: '[x.y.z]'
                name: MyKafkaCluster
                pciComplianceMode: false
                privateNetworkCluster: false
                slaTier: PRODUCTION
                status: RUNNING
    put:
      tags:
      - Apache Kafka Provisioning V3
      summary: Update Kafka Cluster Details
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KafkaClusterUpdateV3'
        required: true
      responses:
        '202':
          description: Kafka cluster update request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaClusterV3'
              example:
                allowDeleteTopics: true
                autoCreateTopics: true
                clientToClusterEncryption: true
                currentClusterOperationStatus: OPERATION_IN_PROGRESS
                dataCentres:
                - cloudProvider: AWS_VPC
                  id: 4650aa98-e894-4675-9614-558915d5837a
                  name: AWS_VPC_US_EAST_1
                  network: 10.0.0.0/16
                  nodeSize: KFK-PRD-r6g.large-250
                  nodes:
                  - id: 94c1ad54-c6f1-4f2e-8634-be9f5fb47fad
                    nodeRoles:
                    - KAFKA_BROKER
                    nodeSize: KFK-PRD-r6g.large-250
                    privateAddress: 10.0.5.23
                    publicAddress: 24.135.55.176
                    rack: us-east-1c
