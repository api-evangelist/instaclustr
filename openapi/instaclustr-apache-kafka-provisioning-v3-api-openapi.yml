    KafkaClientTelemetrySubscription:
      required:
      - clients
      - clusterId
      - metrics
      type: object
      properties:
        clients:
          minLength: 1
          type: string
          description: 'Required. Identifiers of clients to collect metrics from. Must include at least one of: client_id, client_instance_id, client_software_name, client_software_version, client_source_address, client_source_port. Wildcard characters (.) at the end are not permitted.'
          example: client_id=kafka.org
        interval:
          minimum: 20000
          type: integer
          description: The interval to collect client telemetry in milliseconds. Default value for this is 5 minutes. The minimum value is 20000 milliseconds.
          example: 300000
        clusterId:
          type: string
          description: ID of the Kafka cluster
          format: uuid
          x-terraform-field-name: cluster_id
        id:
          type: string
          description: Instaclustr identifier for the Kafka client telemetry subscription.
          format: uuid
          readOnly: true
        metrics:
          minLength: 1
          type: string
          description: Required. A single telemetry metric name to subscribe to. Wildcard characters (.) at the end are not permitted.
          example: org.apache.kafka.consumer.node.request.latency.avg
      description: Configuration to subscribe to Kafka client telemetry.
      example:
        clients: client_software_name=apache-kafka-java
        clusterId: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
        interval: 300000
        metrics: org.apache.kafka.consumer.node.request.latency.avg
