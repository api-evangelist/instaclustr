                pciComplianceMode: false
                privateNetworkCluster: false
                slaTier: PRODUCTION
                status: RUNNING
          x-terraform-resource-poll-completed-statuses: NO_OPERATION
          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: OPERATION_IN_PROGRESS
        '404':
          description: Kafka cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      x-codegen-request-body-name: body
      x-terraform-resource-timeout: 99999m
      operationId: putClusterManagementV2ResourcesApplicationsKafkaClustersV3ByClusterId
      x-operation-id-source: derived
    delete:
      tags:
      - Apache Kafka Provisioning V3
      summary: Delete cluster
      description: Delete an active cluster.
      responses:
        '204':
          description: Cluster delete requested.
          content: {}
      x-terraform-resource-poll-enabled: true
      operationId: deleteClusterManagementV2ResourcesApplicationsKafkaClustersV3ByClusterId
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    ProviderAzureSettingsV2:
      type: object
      properties:
        resourceGroup:
          type: string
          description: The name of the Azure Resource Group into which the Data Centre will be provisioned.
          x-insta-unchangeable: true
        customVirtualNetworkId:
          type: string
          description: VNet ID into which the Data Centre will be provisioned. The VNet must have an available address space for the Data Centre's network allocation to be appended to the VNet. Currently supported for PostgreSQL clusters only.
          example: /subscriptions/{subscription-id}/resourceGroups/{resource-group-name}/providers/Microsoft.Network/virtualNetworks/{virtual-network-name}
          x-insta-unchangeable: true
        storageNetwork:
          type: string
          description: 'The private network address block to be used for the storage network. This is only used for certain node sizes, currently limited to those which use Azure NetApp Files: for all other node sizes, this field should not be provided. The network must have a prefix length between /16 and /28, and must be part of a private address range.'
          example: 192.168.1.0/24
          x-insta-unchangeable: true
      description: ''
    ClusterDnsZoneDetailsV2:
      type: object
      properties:
        hostedZoneId:
          type: string
          description: AWS Route 53 hosted zone ID for this zone (e.g. Z123...), when provisioned.
          readOnly: true
        domain:
          type: string
          description: DNS zone domain name when provisioned (Route53 hosted zone).
          readOnly: true
        vpcAssociations:
          type: array
          description: VPCs associated with this zone for private DNS resolution.
          readOnly: true
          items:
            $ref: '#/components/schemas/ClusterDnsVpcAssociationV2'
      description: A cluster DNS hosted zone for the data centre.
    ResizeOperationInfosV2:
      type: object
      properties:
        operations:
          type: array
          description: ''
          readOnly: true
          items:
            $ref: '#/components/schemas/ResizeOperationInfoV2'
      description: ''
    ResizeOperationInfoV2:
      type: object
      properties:
        concurrentResizes:
          type: integer
          description: Number of nodes that can be concurrently resized at a given time.
          readOnly: true
          example: 2
        replaceOperations:
          type: array
          description: ''
          readOnly: true
          items:
            $ref: '#/components/schemas/ReplaceOperationInfoV2'
        created:
          type: string
          description: Timestamp of the creation of the operation
          readOnly: true
          example: '2019-08-24T14:15:22Z'
        completed:
          type: string
          description: Timestamp of the completion of the operation.
          readOnly: true
          example: '2019-08-24T14:15:22Z'
        id:
          type: string
          description: ID of the operation.
          format: uuid
          readOnly: true
          example: 657d1cec-1eb8-449f-8be4-467ab1f2b856
        newNodeSize:
          type: string
          description: New size of the node.
          readOnly: true
          example: CAS-DEV-t4g.small-30
        instaclustrSupportAlerted:
          type: string
          description: Timestamp of when Instaclustr Support has been alerted to the resize operation.
          readOnly: true
          example: '2019-08-24T14:15:22Z'
        nodePurpose:
          type: string
          description: Purpose of the node
          readOnly: true
          example: CASSANDRA
        status:
          type: string
          description: Status of the operation
          readOnly: true
          example: COMPLETED
          enum:
          - COMPLETED
          - FAILED
          - DELETED
          - IN_PROGRESS
          - UNKNOWN
      description: ''
    KafkaDedicatedZookeeperSettingsUpdateV2:
      required:
      - zookeeperNodeSize
      type: object
      properties:
        zookeeperNodeSize:
          type: string
          description: Size of the nodes provisioned as dedicated Zookeeper nodes.
          example: KDZ-DEV-t4g.small-30
      description: ''
    NodeDetailsV2:
      type: object
      properties:
        nodeRoles:
          type: array
          description: The roles or purposes of the node. Useful for filtering for nodes that have a specific role.
          readOnly: true
          items:
            $ref: '#/components/schemas/NodeRolesV2'
        rack:
          type: string
          description: Rack name in which the node is located.
          readOnly: true
        nodeSize:
          type: string
          description: Size of the node.
          readOnly: true
        privateAddress:
          type: string
          description: Private IP address of the node.
          readOnly: true
          example: 10.131.60.142
        deletionTime:
          type: string
          description: Deletion time of the node as a UTC timestamp
          readOnly: true
          example: '2019-08-24T14:15:22Z'
        publicAddress:
          type: string
          description: Public IP address of the node.
          readOnly: true
          example: 52.0.5.140
        startTime:
          type: string
          description: Start time of the node as a UTC timestamp
          readOnly: true
          example: '2019-08-24T14:15:22Z'
        id:
          type: string
          description: ID of the node.
          readOnly: true
          example: 9a27373a-0451-4121-94ba-873fc441f313
        status:
          type: string
          description: Provisioning status of the node.
          readOnly: true
          example: RUNNING
      description: ''
    PrivateServiceConnectRackSettingsV2:
      required:
      - advertisedHostname
      type: object
      properties:
        rackName:
          type: string
          description: Name of the rack
          readOnly: true
        serviceAttachmentNetwork:
          type: string
          description: Network of the service attachment
          readOnly: true
        advertisedHostname:
          minLength: 3
          type: string
          description: The hostname to be used to connect to the Private Service Connect rack.
          example: test.com
          x-insta-unchangeable: true
        serviceAttachmentId:
          type: string
          description: Id of the service attachment
          readOnly: true
        serviceAttachmentName:
          type: string
          description: Name of the service attachment
          readOnly: true
      description: Settings required for Private Service Connect Rack on a cluster.
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    ProviderTagV2:
      required:
      - key
      type: object
      properties:
        value:
          type: string
          description: Value of the custom tag.
          example: myTagValue
        key:
          type: string
          description: Key of the custom tag.
          example: myTagKey
          x-insta-unchangeable: true
      description: Custom tag for cloud provider resources.
    KafkaTieredStorageS3SettingsV2:
      required:
      - s3BucketName
      type: object
      properties:
        useCustomBucket:
          type: boolean
          description: Use custom provided S3 bucket
          x-insta-unchangeable: true
        prefix:
          type: string
          description: S3 prefix to store the remote data in the S3 bucket, by default the prefix format is `<cluster_id>-data/`
          readOnly: true
          x-insta-unchangeable: true
        s3BucketName:
          type: string
          description: S3 bucket name for Kafka remote storage
          x-insta-unchangeable: true
      description: ''
    KafkaClusterV3:
      required:
      - allowDeleteTopics
      - autoCreateTopics
      - clientToClusterEncryption
      - dataCentres
      - defaultNumberOfPartitions
      - defaultReplicationFactor
      - kafkaVersion
      - name
      - pciComplianceMode
      - privateNetworkCluster
      - slaTier
      type: object
      properties:
        clientBrokerAuthWithMtls:
          type: boolean
          description: Enables Client ⇄ Broker Authentication with mTLS.
          example: false
          x-terraform-force-new: true
        defaultNumberOfPartitions:
          type: integer
          description: Default number of partitions to use when created new topics.
          example: 3
          x-terraform-force-new: true
        description:
          type: string
          description: A description of the cluster
          example: Cluster managed by the integration team.
          x-terraform-computed: true
        karapaceRestProxy:
          maxItems: 1
          type: array
          description: Adds the specified version of Kafka Karapace REST Proxy to this Kafka cluster.
          example: ''
          items:
            $ref: '#/components/schemas/KafkaKarapaceRestProxyDetailsV2'
          x-terraform-computed: true
          x-terraform-force-new: true
        autoCreateTopics:
          type: boolean
          description: Allows topics to be auto created by brokers when messages are published to a non-existent topic
          example: true
          x-terraform-force-new: true
        clientToClusterEncryption:
          type: boolean
          description: Enables Client ⇄ Cluster Encryption.
          example: true
          x-terraform-force-new: true
        currentClusterOperationStatus:
          $ref: '#/components/schemas/CurrentClusterOperationStatusV2'
        privateNetworkCluster:
          type: boolean
          description: Creates the cluster with private network only, see [Private Network Clusters](https://www.instaclustr.com/support/documentation/useful-information/private-network-clusters/).
          example: true
          x-terraform-force-new: true
        kafkaVersion:
          pattern: '[0-9]+\.[0-9]+\.[0-9]+'
          type: string
          description: 'Version of Kafka to run on the cluster. Available versions: <ul> <li>`3.9.2`</li> <li>`4.3.1`</li> <li>`4.1.2`</li> <li>`4.2.1`</li> </ul>'
          example: 3.1.2
          x-terraform-force-new: true
        bundledUseOnly:
          type: boolean
          description: Provision this cluster for [Bundled Use only](https://www.instaclustr.com/support/documentation/cadence/getting-started-with-cadence/bundled-use-only-cluster-deployments/).
          example: true
          x-terraform-computed: true
          x-terraform-force-new: true
        resizeSettings:
          maxItems: 1
          type: array
          description: Settings to determine how resize requests will be performed for the cluster.
          items:
            $ref: '#/components/schemas/ResizeSettingsV2'
          x-terraform-write-only: true
        id:
          type: string
          description: ID of the cluster.
          readOnly: true
          example: 4650aa98-e894-4675-9614-558915d5837a
        slaTier:
          $ref: '#/components/schemas/SlaTierV2'
        pciComplianceMode:
          type: boolean
          description: Creates a PCI compliant cluster, see [PCI Compliance](https://www.instaclustr.com/support/documentation/useful-information/pci-compliance/).
          example: true
          x-terraform-force-new: true
        schemaRegistry:
          maxItems: 1
          type: array
          description: Adds the specified version of Kafka Schema Registry to this Kafka cluster.
          example: ''
          items:
            $ref: '#/components/schemas/KafkaSchemaRegistryDetailsV2'
          x-terraform-computed: true
          x-terraform-force-new: true
        dedicatedKraftController:
          maxItems: 1
          type: array
          description: 'Provision additional dedicated nodes for KRaft Controllers. If this is not provided, some Kafka brokers will be required to act as KRaft controllers.

            '
          items:
            $ref: '#/components/schemas/KafkaDedicatedKraftControllerSettingsV2'
        defaultReplicationFactor:
          type: integer
          description: Default Replication factor to use for new topic. Also represents the number of racks to use when allocating nodes.
          example: 3
          x-terraform-force-new: true
        twoFactorDelete:
          maxItems: 1
          type: array
          description: ''
          items:
