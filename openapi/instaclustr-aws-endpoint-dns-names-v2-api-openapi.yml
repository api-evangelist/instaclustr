openapi: 3.2.0
info:
  title: Instaclustr AWS Endpoint DNS Names V2 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged AWS Endpoint DNS Names V2 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: AWS Endpoint DNS Names V2
  description: Operations related to AWS endpoint dns names.
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/data-sources/cluster_data_center/{clusterDataCenterId}/aws-endpoint-dns-names/v2/:
    parameters:
    - name: clusterDataCenterId
      in: path
      description: ID of the Cluster Data Center.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    x-terraform-resource-name: aws_endpoint_dns_names_v2
    get:
      tags:
      - AWS Endpoint DNS Names V2
      summary: List all Endpoint DNS names on a specific cluster data center
      description: List all Endpoint DNS names on a specific cluster data center.
      responses:
        '200':
          description: Retrieved Endpoint DNS Names.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AwsEndpointDnsNamesV2'
        '404':
          description: Cluster Data Center not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: getClusterManagementV2DataSourcesClusterDataCenterByClusterDataCenterIdAwsEndpointDnsNamesV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/aws-endpoint-dns-names/v2/:
    x-terraform-resource-name: aws_endpoint_dns_names_v2
    post:
      tags:
      - AWS Endpoint DNS Names V2
      summary: Update Endpoint DNS names on a cluster data center
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwsEndpointDnsNamesV2'
        required: true
      responses:
        '202':
          description: Successfully updated Endpoint DNS Name(s) on the cluster data center.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwsEndpointDnsNamesV2'
              example:
                awsEndpointDnsNames:
                - ip-10-0-169-78.ec2.internal
                - ip-10-0-107-16.ec2.internal
                - ip-10-0-52-211.ec2.internal
                clusterDataCenterId: 1e4bd709-c4ed-43f8-b5fa-5964d3ef3c1e
      x-codegen-request-body-name: body
      operationId: postClusterManagementV2ResourcesAwsEndpointDnsNamesV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/aws-endpoint-dns-names/v2/{clusterDataCenterId}:
    parameters:
    - name: clusterDataCenterId
      in: path
      description: ID of the cluster data center.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - AWS Endpoint DNS Names V2
      summary: Retrieve Endpoint DNS Names for a cluster data center
      description: Get Endpoint DNS Names for a cluster data center.
      responses:
        '200':
          description: Retrieved Endpoint DNS Names for a cluster data center.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwsEndpointDnsNamesV2'
        '404':
          description: Cluster data center not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: getClusterManagementV2ResourcesAwsEndpointDnsNamesV2ByClusterDataCenterId
      x-operation-id-source: derived
    delete:
      tags:
      - AWS Endpoint DNS Names V2
      summary: Delete Endpoint DNS Names for a cluster data center
      description: Delete Endpoint DNS Names for a cluster data center.
      responses:
        '204':
          description: Endpoint DNS Names successfully deleted.
          content: {}
        '404':
          description: Endpoint DNS Names not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: deleteClusterManagementV2ResourcesAwsEndpointDnsNamesV2ByClusterDataCenterId
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    AwsEndpointDnsNamesV2:
      required:
      - awsEndpointDnsNames
      - clusterDataCenterId
      type: object
      properties:
        clusterDataCenterId:
          type: string
          description: ID of the cluster data center
          x-terraform-id: true
        awsEndpointDnsNames:
          type: array
          description: AWS Endpoint DNS Names.
          items:
            type: string
      description: List of AWS endpoint DNS names for a cluster data center
      example:
        awsEndpointDnsNames:
        - ip-10-0-169-78.ec2.internal
        - ip-10-0-107-16.ec2.internal
        - ip-10-0-52-211.ec2.internal
        clusterDataCenterId: 1e4bd709-c4ed-43f8-b5fa-5964d3ef3c1e
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
