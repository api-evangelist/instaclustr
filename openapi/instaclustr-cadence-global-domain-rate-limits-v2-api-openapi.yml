openapi: 3.2.0
info:
  title: Instaclustr Cadence Global Domain Rate Limits V2 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Cadence Global Domain Rate Limits V2 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Cadence Global Domain Rate Limits V2
  description: Operations related to Cadence cluster-wide domain request-rate limits.
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/resources/applications/cadence/global-domain-rate-limits/v2:
    x-terraform-resource-name: cadence_global_domain_rate_limits_v2
    post:
      tags:
      - Cadence Global Domain Rate Limits V2
      summary: Create Cadence global domain request rate limits
      description: Creates a Cadence global domain request-rate-limit rule set for a cluster. Fails if an active rule set already exists.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadenceDomainRateLimitsV2'
        required: true
      responses:
        '202':
          description: Cadence global domain request rate limits accepted for application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadenceDomainRateLimitsV2'
        '400':
          description: Invalid Cadence domain rate-limit request or cluster state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '403':
          description: The account does not have permission to edit cluster settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '404':
          description: Cadence cluster not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '409':
          description: Cadence global domain rate limits already exist for this cluster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
      x-codegen-request-body-name: body
      operationId: postClusterManagementV2ResourcesApplicationsCadenceGlobalDomainRateLimitsV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/cadence/global-domain-rate-limits/v2/{id}:
    parameters:
    - name: id
      in: path
      description: ID of the target Cadence cluster and global domain request-rate-limits resource.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        x-terraform-id: true
      x-terraform-id: true
    get:
      tags:
      - Cadence Global Domain Rate Limits V2
      summary: Get Cadence domain request rate limits
      description: Gets the latest active Cadence global domain request-rate-limit rule set for a cluster.
      responses:
        '200':
          description: Successfully retrieved Cadence domain request rate limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadenceDomainRateLimitsV2'
              example:
                clusterId: b997a00d-5bd4-4774-9bd7-5c0ad6189246
                defaultRequestsPerSecond: 250
                domainRateLimits:
                - domainName: payments
                  requestsPerSecond: 1000
        '400':
          description: The cluster is not a Cadence cluster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '403':
          description: The account does not have permission to view cluster settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '404':
          description: Cadence cluster or domain rate limits not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
      operationId: getClusterManagementV2ResourcesApplicationsCadenceGlobalDomainRateLimitsV2ById
      x-operation-id-source: derived
    put:
      tags:
      - Cadence Global Domain Rate Limits V2
      summary: Create or replace Cadence domain request rate limits
      description: Creates a Cadence global domain request-rate-limit rule set that supersedes prior active rule sets for the cluster.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadenceDomainRateLimitsUpdateV2'
        required: true
      responses:
        '202':
          description: Cadence domain request rate limits accepted for application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadenceDomainRateLimitsV2'
              example:
                clusterId: b997a00d-5bd4-4774-9bd7-5c0ad6189246
                defaultRequestsPerSecond: 250
                domainRateLimits:
                - domainName: payments
                  requestsPerSecond: 1000
        '400':
          description: Invalid Cadence domain rate-limit request or cluster state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '403':
          description: The account does not have permission to edit cluster settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '404':
          description: Cadence cluster not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
      x-codegen-request-body-name: body
      operationId: putClusterManagementV2ResourcesApplicationsCadenceGlobalDomainRateLimitsV2ById
      x-operation-id-source: derived
    delete:
      tags:
      - Cadence Global Domain Rate Limits V2
      summary: Delete Cadence domain request rate limits
      description: Deletes all active Cadence global domain request-rate-limit rule sets for a cluster.
      responses:
        '204':
          description: Cadence domain request rate limits deleted successfully.
          content: {}
        '400':
          description: This cluster is currently unable to delete Cadence global domain rate limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '403':
          description: The account does not have permission to edit cluster settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '404':
          description: Cadence cluster or domain rate limits not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
      operationId: deleteClusterManagementV2ResourcesApplicationsCadenceGlobalDomainRateLimitsV2ById
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    CadenceDomainRateLimitSummaryV2:
      required:
      - domainName
      - requestsPerSecond
      type: object
      properties:
        domainName:
          minLength: 1
          pattern: ^[A-Za-z][A-Za-z0-9._-]*$
          type: string
          description: Exact Cadence domain name. It must start with a letter and may contain letters, numbers, periods, underscores, and hyphens. Cadence determines the supported maximum length.
        requestsPerSecond:
          minimum: 1
          type: integer
          description: Requests per second for the domain.
          format: int32
      description: A request rate limit for one Cadence domain.
      example:
        domainName: payments
        requestsPerSecond: 1000
    CadenceDomainRateLimitsUpdateV2:
      type: object
      properties:
        defaultRequestsPerSecond:
          minimum: 1
          type: integer
          description: Requests per second for all domains without a domain-specific limit. Written as the final unconstrained Cadence rule.
          format: int32
        domainRateLimits:
          maxItems: 999
          type: array
          description: One cluster-wide request rate limit per Cadence domain. Supersedes the entire prior active rule set.
          items:
            $ref: '#/components/schemas/CadenceDomainRateLimitSummaryV2'
          x-terraform-ignore-order: true
      description: The complete frontend.globalDomainrps rule set for a Cadence cluster. At least one domain rate limit or a default request rate limit must be specified.
    CadenceDomainRateLimitsV2:
      required:
      - clusterId
      type: object
      properties:
        clusterId:
          type: string
          description: ID of the Cadence cluster.
          format: uuid
          x-terraform-force-new: true
        defaultRequestsPerSecond:
          minimum: 1
          type: integer
          description: Requests per second for all domains without a domain-specific limit. Written as the final unconstrained Cadence rule.
          format: int32
        id:
          type: string
          description: ID of the Cadence global domain request-rate-limits resource (the target cluster ID).
          format: uuid
          readOnly: true
          x-terraform-id: true
        domainRateLimits:
          maxItems: 999
          type: array
          description: Domain request rate limits.
          items:
            $ref: '#/components/schemas/CadenceDomainRateLimitSummaryV2'
          x-terraform-ignore-order: true
      description: Domain request rate limits for a Cadence cluster.
      example:
        clusterId: b997a00d-5bd4-4774-9bd7-5c0ad6189246
        defaultRequestsPerSecond: 250
        domainRateLimits:
        - domainName: payments
          requestsPerSecond: 1000
        id: b997a00d-5bd4-4774-9bd7-5c0ad6189246
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
