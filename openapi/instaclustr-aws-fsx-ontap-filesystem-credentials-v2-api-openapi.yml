openapi: 3.2.0
info:
  title: Instaclustr AWS FSx ONTAP Filesystem Credentials V2 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged AWS FSx ONTAP Filesystem Credentials V2 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: AWS FSx ONTAP Filesystem Credentials V2
  description: Operations related to BYO AWS FSx ONTAP filesystem credentials
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/resources/providers/aws/fsxn/credentials/v2:
    x-terraform-resource-name: aws_fsxn_filesystem_credential_v2
    get:
      tags:
      - AWS FSx ONTAP Filesystem Credentials V2
      summary: List BYO FSxN filesystem registrations
      description: List all BYO FSxN filesystems registered to the account.
      responses:
        '200':
          description: BYO FSxN filesystem registrations retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AwsFsxOntapFilesystemRegistrationV2'
      operationId: getClusterManagementV2ResourcesProvidersAwsFsxnCredentialsV2
      x-operation-id-source: derived
    post:
      tags:
      - AWS FSx ONTAP Filesystem Credentials V2
      summary: Submit BYO FSxN filesystem admin credentials
      description: Submit fsxadmin credentials for a BYO FSxN filesystem. Registers the filesystem to the account if not already registered.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwsFsxOntapFilesystemCredentialsRequestV2'
        required: true
      responses:
        '202':
          description: FSxN admin credential submitted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FsxnAdminCredentialResponseV2'
              example:
                filesystemId: fs-0c315066d18074b67
      x-codegen-request-body-name: body
      operationId: postClusterManagementV2ResourcesProvidersAwsFsxnCredentialsV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/providers/aws/fsxn/credentials/v2/{filesystemId}:
    parameters:
    - name: filesystemId
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: string
    get:
      tags:
      - AWS FSx ONTAP Filesystem Credentials V2
      summary: Get a BYO FSxN filesystem registration
      description: Get a BYO FSxN filesystem registration for the account.
      responses:
        '200':
          description: BYO FSxN filesystem registration retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwsFsxOntapFilesystemRegistrationV2'
        '404':
          description: FSxN filesystem not registered to this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: getClusterManagementV2ResourcesProvidersAwsFsxnCredentialsV2ByFilesystemId
      x-operation-id-source: derived
    delete:
      tags:
      - AWS FSx ONTAP Filesystem Credentials V2
      summary: De-register a BYO FSxN filesystem
      description: Remove a BYO FSxN filesystem registration from the account.
      responses:
        '204':
          description: FSxN filesystem de-registered successfully.
          content: {}
        '404':
          description: FSxN filesystem not registered to this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: deleteClusterManagementV2ResourcesProvidersAwsFsxnCredentialsV2ByFilesystemId
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    AwsFsxOntapFilesystemRegistrationV2:
      required:
      - filesystemId
      type: object
      properties:
        filesystemId:
          type: string
          description: The AWS FSxN filesystem ID (e.g. fs-0c315066d18074b67).
        status:
          type: string
          description: The current status of the filesystem.
          readOnly: true
      description: A BYO FSxN filesystem registered to an account.
    AwsFsxOntapFilesystemCredentialsRequestV2:
      required:
      - filesystemId
      - password
      - username
      type: object
      properties:
        password:
          type: string
          description: Password for the filesystem-level administrative user.
          format: password
          x-insta-unchangeable: true
          x-terraform-sensitive: true
          x-terraform-write-only: true
        filesystemId:
          type: string
          description: AWS FSx filesystem ID (e.g. fs-0c315066d18074b67).
          x-insta-unchangeable: true
        username:
          type: string
          description: Username for the filesystem-level administrative user (fsxadmin role).
          x-insta-unchangeable: true
          x-terraform-write-only: true
      description: FSxN filesystem credential submission.
    FsxnAdminCredentialResponseV2:
      type: object
      properties:
        password:
          type: string
          description: Password for the filesystem-level administrative user.
          format: password
          x-insta-unchangeable: true
          x-terraform-sensitive: true
          x-terraform-write-only: true
        filesystemId:
          type: string
          description: The AWS FSxN filesystem ID (e.g. fs-0c315066d18074b67).
          readOnly: true
          example: fs-0c315066d18074b67
          x-insta-unchangeable: true
          x-terraform-id: true
        username:
          type: string
          description: Username for the filesystem-level administrative user (fsxadmin role).
          x-insta-unchangeable: true
          x-terraform-write-only: true
      description: Response body for FSxN admin credential submission.
      example:
        filesystemId: fs-0c315066d18074b67
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
