openapi: 3.2.0
info:
  title: Instaclustr Redis User V2 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Redis User V2 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Redis User V2
  description: ''
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/data-sources/redis_cluster/{clusterId}/users/v2/:
    parameters:
    - name: clusterId
      in: path
      description: ID of the cluster.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    x-terraform-resource-name: users_v2
    get:
      tags:
      - Redis User V2
      summary: List all Redis users
      responses:
        '200':
          description: Successfully retrieved application users of Redis.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RedisUserSummariesV2'
      operationId: getClusterManagementV2DataSourcesRedisClusterByClusterIdUsersV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/redis/users/v2/:
    x-terraform-resource-name: redis_user_v2
    post:
      tags:
      - Redis User V2
      summary: Create a Redis User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedisUserV2'
        required: true
      responses:
        '202':
          description: Redis user provisioning requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisUserV2'
              example:
                clusterId: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
                id: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37_myRedisUser
                initialPermissions: standard
                password: myPassword0.
                username: myRedisUser
      x-codegen-request-body-name: body
      operationId: postClusterManagementV2ResourcesApplicationsRedisUsersV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/redis/users/v2/{redisUserId}/:
    parameters:
    - name: redisUserId
      in: path
      description: ID of the Redis user.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    get:
      tags:
      - Redis User V2
      summary: Get Redis User details
      responses:
        '200':
          description: Redis user details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisUserV2'
              example:
                clusterId: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
                id: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37_myRedisUser
                initialPermissions: standard
                password: myPassword0.
                username: myRedisUser
      operationId: getClusterManagementV2ResourcesApplicationsRedisUsersV2ByRedisUserId
      x-operation-id-source: derived
    put:
      tags:
      - Redis User V2
      summary: Update Redis user password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedisUserPasswordV2'
        required: true
      responses:
        '202':
          description: Requested Redis user's password update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisUserPasswordV2'
        '404':
          description: Redis cluster not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
      x-codegen-request-body-name: body
      operationId: putClusterManagementV2ResourcesApplicationsRedisUsersV2ByRedisUserId
      x-operation-id-source: derived
    delete:
      tags:
      - Redis User V2
      summary: Delete a Redis user
      responses:
        '204':
          description: Redis user delete requested.
          content: {}
      operationId: deleteClusterManagementV2ResourcesApplicationsRedisUsersV2ByRedisUserId
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    RedisUserPasswordV2:
      required:
      - password
      type: object
      properties:
        password:
          type: string
          description: Password for the Redis user.
          format: password
          example: my1password!
          x-terraform-sensitive: true
          x-terraform-write-only: true
      description: Definition of a Redis User Password Update to be applied to a Redis user.
      example:
        password: my1password!
    RedisUserSummaryV2:
      required:
      - clusterId
      - username
      type: object
      properties:
        clusterId:
          type: string
          description: ID of the Redis cluster.
          format: uuid
          x-terraform-force-new: true
        id:
          type: string
          description: 'Instaclustr identifier for the Redis user. The value of this property has the form: [cluster-id]_[redis-username]'
          readOnly: true
        username:
          pattern: ^(?![zZ][oO][oO][kK][eE][eE][pP][eE][rR]$)[a-zA-Z0-9][a-zA-Z0-9_-]*$
          type: string
          description: Username of the Redis user.
          x-terraform-force-new: true
      description: Summary of a Redis User to be applied to a Redis cluster.
      example:
        clusterId: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
        id: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37_myRedisUser
        username: myRedisUser
    RedisUserV2:
      required:
      - clusterId
      - initialPermissions
      - password
      - username
      type: object
      properties:
        password:
          type: string
          description: Password for the Redis user.
          format: password
          x-terraform-sensitive: true
          x-terraform-write-only: true
        clusterId:
          type: string
          description: ID of the Redis cluster.
          format: uuid
          x-terraform-force-new: true
        id:
          type: string
          description: 'Instaclustr identifier for the Redis user. The value of this property has the form: [cluster-id]_[redis-username]'
          readOnly: true
        initialPermissions:
          type: string
          description: Permissions initially granted to Redis user upon creation.
          enum:
          - standard
          - read-only
          - none
          x-terraform-force-new: true
          x-terraform-write-only: true
        username:
          pattern: ^(?![zZ][oO][oO][kK][eE][eE][pP][eE][rR]$)[a-zA-Z0-9][a-zA-Z0-9_-]*$
          type: string
          description: Username of the Redis user.
          x-terraform-force-new: true
      description: Definition of a Redis User to be applied to a Redis cluster.
      example:
        clusterId: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
        initialPermissions: standard
        password: myPassword0.
        username: myRedisUser
    RedisUserSummariesV2:
      type: object
      properties:
        redisUsers:
          type: array
          description: List of all Redis users in the cluster.
          items:
            $ref: '#/components/schemas/RedisUserSummaryV2'
        clusterId:
          type: string
          description: ID of the redis cluster
          x-terraform-id: true
      description: A listable data source of all Redis users within a Redis Cluster.
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
