openapi: 3.2.0
info:
  title: Instaclustr AWS Security Group Firewall Rules V2 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged AWS Security Group Firewall Rules V2 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: AWS Security Group Firewall Rules V2
  description: Operations related to perform bulk operation on Cluster AWS security group firewall rules
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/resources/providers/aws/cluster-security-group-firewall-rules/v2:
    x-terraform-resource-name: aws_security_group_firewall_rules_v2
    post:
      tags:
      - AWS Security Group Firewall Rules V2
      summary: Add multiple AWS security group firewall rules in the cluster
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterAllAwsSecurityGroupFirewallRulesV2'
        required: true
      responses:
        '202':
          description: Successfully added AWS security group firewall rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterAllAwsSecurityGroupFirewallRulesV2'
              example:
                clusterId: 91346037-b969-4c4d-8112-59e1d2aa67e9
                firewallRules:
                - deferredReason: ''
                  id: 44ff0751-ea69-4154-810a-99aedc6d23fd
                  securityGroupId: sg-903004f0
                  type: CASSANDRA_CQL
                - deferredReason: ''
                  id: 361fc2b9-0acf-49d3-8cac-a703d2ef9cd2
                  securityGroupId: sg-903004f6
                  type: CASSANDRA_CQL
                id: 44ff0751-ea69-4154-810a-99aedc6d23fd
                status: RUNNING
          x-terraform-resource-poll-completed-statuses: RUNNING
          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: GENESIS,PROVISIONING
        '409':
          description: Any firewall rule of that kind already exists for that security group in cluster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
      x-codegen-request-body-name: body
      x-terraform-resource-timeout: 99999m
      operationId: postClusterManagementV2ResourcesProvidersAwsClusterSecurityGroupFirewallRulesV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/providers/aws/cluster-security-group-firewall-rules/v2/{clusterId}:
    parameters:
    - name: clusterId
      in: path
      description: ID of the cluster
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - AWS Security Group Firewall Rules V2
      summary: Get AWS security group Firewall rules for the cluster
      responses:
        '200':
          description: Retrieved AWS security group firewall rules for cluster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterAllAwsSecurityGroupFirewallRulesV2'
              example:
                clusterId: 91346037-b969-4c4d-8112-59e1d2aa67e9
                firewallRules:
                - deferredReason: ''
                  id: 44ff0751-ea69-4154-810a-99aedc6d23fd
                  securityGroupId: sg-903004f0
                  type: CASSANDRA_CQL
                - deferredReason: ''
                  id: 361fc2b9-0acf-49d3-8cac-a703d2ef9cd2
                  securityGroupId: sg-903004f6
                  type: CASSANDRA_CQL
                id: 44ff0751-ea69-4154-810a-99aedc6d23fd
                status: RUNNING
        '404':
          description: Cluster or Cluster AWS security group Firewall Rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: getClusterManagementV2ResourcesProvidersAwsClusterSecurityGroupFirewallRulesV2ByClusterId
      x-operation-id-source: derived
    put:
      tags:
      - AWS Security Group Firewall Rules V2
      summary: Update multiple AWS security group firewall rules in the cluster
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterAllAwsSecurityGroupFirewallRulesV2'
        required: true
      responses:
        '202':
          description: Successfully updated cluster AWS security group firewall rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterAllAwsSecurityGroupFirewallRulesV2'
              example:
                clusterId: 91346037-b969-4c4d-8112-59e1d2aa67e9
                firewallRules:
                - deferredReason: ''
                  id: 44ff0751-ea69-4154-810a-99aedc6d23fd
                  securityGroupId: sg-903004f0
                  type: CASSANDRA_CQL
                - deferredReason: ''
                  id: 361fc2b9-0acf-49d3-8cac-a703d2ef9cd2
                  securityGroupId: sg-903004f6
                  type: CASSANDRA_CQL
                id: 44ff0751-ea69-4154-810a-99aedc6d23fd
                status: RUNNING
          x-terraform-resource-poll-completed-statuses: RUNNING
          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: GENESIS,PROVISIONING
        '404':
          description: Cluster or Cluster AWS security group Firewall Rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      x-codegen-request-body-name: body
      x-terraform-resource-timeout: 99999m
      operationId: putClusterManagementV2ResourcesProvidersAwsClusterSecurityGroupFirewallRulesV2ByClusterId
      x-operation-id-source: derived
    delete:
      tags:
      - AWS Security Group Firewall Rules V2
      summary: Delete cluster AWS security group firewall rules
      responses:
        '204':
          description: Cluster AWS security group Firewall Rules successfully deleted
          content: {}
        '404':
          description: Cluster or Cluster AWS security group Firewall Rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: deleteClusterManagementV2ResourcesProvidersAwsClusterSecurityGroupFirewallRulesV2ByClusterId
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    ClusterAllAwsSecurityGroupFirewallRuleV2:
      required:
      - securityGroupId
      - type
      type: object
      properties:
        securityGroupId:
          type: string
          description: The security group ID of the AWS security group firewall rule.
          x-insta-unchangeable: true
        deferredReason:
          type: string
          description: The reason (if needed) for the deferred status of the AWS security group firewall rule.
          readOnly: true
        id:
          type: string
          description: ID of the AWS security group firewall rule.
          format: uuid
          readOnly: true
        type:
          $ref: '#/components/schemas/ClusterAllFirewallRuleTypesV2'
      description: Definition of an AWS Security Group based firewall rule to be applied to a cluster.
      example:
        securityGroupId: sg-01abc2345defg6789
        type: CASSANDRA
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    ClusterAllFirewallRuleTypesV2:
      type: string
      description: The type of firewall rule.
      example: CASSANDRA_CQL
      enum:
      - APACHE_ZOOKEEPER
      - CADENCE
      - CADENCE_GRPC
      - CADENCE_HTTP_API
      - CADENCE_WEB
      - CASSANDRA
      - CASSANDRA_CQL
      - CLICKHOUSE
      - CLICKHOUSE_WEB
      - ELASTICSEARCH
      - KAFKA
      - KAFKA_CONNECT
      - KAFKA_ENCRYPTION
      - KAFKA_MTLS
      - KAFKA_NO_ENCRYPTION
      - KAFKA_PRIVATE_SASL_PLAINTEXT_LISTENER
      - KAFKA_PUBLIC_SASL_PLAINTEXT_LISTENER
      - KAFKA_PRIVATE_PLAINTEXT_LISTENER
      - KAFKA_PUBLIC_PLAINTEXT_LISTENER
      - KAFKA_PRIVATE_SSL_LISTENER
      - KAFKA_PUBLIC_SSL_LISTENER
      - KAFKA_REST_PROXY
      - KAFKA_SCHEMA_REGISTRY
      - KARAPACE_REST_PROXY
      - KARAPACE_SCHEMA_REGISTRY
      - OPENSEARCH
      - OPENSEARCH_DASHBOARDS
      - PGBOUNCER
      - POSTGRESQL
      - REDIS
      - VALKEY
      - SEARCH_DASHBOARDS
      - SECURE_APACHE_ZOOKEEPER
      - SPARK
      - SPARK_JOBSERVER
      - SHOTOVER_PROXY
      - MCP_GATEWAY
      - KAFKA_DISKLESS
      x-insta-unchangeable: true
    ClusterAllAwsSecurityGroupFirewallRulesV2:
      required:
      - clusterId
      - firewallRules
      type: object
      properties:
        clusterId:
          type: string
          description: ID of the cluster
          format: uuid
        id:
          type: string
          description: ID of the cluster security group firewall rules resource
          format: uuid
          readOnly: true
        firewallRules:
          type: array
          description: Cluster AWS Security Group firewall rules
          items:
            $ref: '#/components/schemas/ClusterAllAwsSecurityGroupFirewallRuleV2'
          x-terraform-field-name: firewall_rule
          x-terraform-ignore-order: true
        status:
          type: string
          description: The status of the cluster
          readOnly: true
          x-terraform-field-status: true
      description: A listable data source of all AWS Security Group based firewall rules in an Instaclustr managed cluster.
      example:
        clusterId: 91346037-b969-4c4d-8112-59e1d2aa67e9
        firewallRules:
        - securityGroupId: sg-903004f0
          type: CASSANDRA_CQL
        - securityGroupId: sg-903004f6
          type: CASSANDRA_CQL
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
