openapi: 3.2.0
info:
  title: Instaclustr Cluster Non Recurring Exclusion Window V2 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Cluster Non Recurring Exclusion Window V2 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Cluster Non Recurring Exclusion Window V2
  description: Cluster non-recurring exclusion window
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/data-sources/cluster/{clusterId}/non-recurring-exclusion-windows/v2:
    parameters:
    - name: clusterId
      in: path
      description: ID of the cluster
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Cluster Non Recurring Exclusion Window V2
      summary: List cluster non-recurring exclusion windows
      description: Lists all non-recurring exclusion windows (times when maintenance events cannot be performed) for the cluster
      responses:
        '200':
          description: Successfully retrieved non-recurring exclusion windows for cluster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClusterNonRecurringExclusionWindowsV2'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
        '401':
          description: Not Authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '415':
          description: 'Unsupported media type: returned when the payload is in an unsupported format'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
      operationId: getClusterManagementV2DataSourcesClusterByClusterIdNonRecurringExclusionWindowsV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    ClusterNonRecurringExclusionWindowsV2:
      type: object
      properties:
        nonRecurringExclusionWindows:
          type: array
          description: List of cluster non-recurring exclusion windows
          readOnly: true
          items:
            $ref: '#/components/schemas/ClusterNonRecurringExclusionWindowV2'
        clusterId:
          type: string
          description: ID of the cluster
          readOnly: true
      description: Definition to the Cluster non-recurring exclusion windows
      example:
        clusterId: cf4fccf3-2ac0-494b-9f40-e95288dd752d
        nonRecurringExclusionWindows:
        - clusterId: cf4fccf3-2ac0-494b-9f40-e95288dd752d
          endTime: '2021-12-21T11:03:32Z'
          id: af4fccf3-2ac0-494b-9f40-e95288dd752d
          startTime: '2024-11-21T11:03:32Z'
        - clusterId: cf4fccf3-2ac0-494b-9f40-e95288dd752d
          endTime: '2021-12-21T11:03:32Z'
          id: af4fccf3-2ac0-494b-9f40-e95288dd752d
          startTime: '2024-11-21T11:03:32Z'
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    ClusterNonRecurringExclusionWindowV2:
      required:
      - clusterId
      - endTime
      - startTime
      type: object
      properties:
        startTime:
          type: string
          description: The start time of non-recurring exclusion window
          example: '2024-11-10T04:00:07Z'
        clusterId:
          type: string
          description: Cluster Id for the cluster that this exclusion window relates to
          format: uuid
          example: 71e4380e-32ac-4fa7-ab42-c165fe35aa55
        endTime:
          type: string
          description: The end time of non-recurring exclusion window
          example: '2024-12-10T04:00:07Z'
        id:
          type: string
          description: ID of the Cluster exclusion window
          format: uuid
          readOnly: true
          example: 71e4380e-32ac-4fa7-ab42-c165fe35aa55
      description: Definition to Cluster non-recurring exclusion window
      example:
        clusterId: cf4fccf3-2ac0-494b-9f40-e95288dd752d
        endTime: '2021-12-21T11:03:32Z'
        id: af4fccf3-2ac0-494b-9f40-e95288dd752d
        startTime: '2024-11-21T11:03:32Z'
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
