openapi: 3.2.0
info:
  title: Instaclustr Node Reload API
  version: Deprecated
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Node Reload across 2 of this provider''s published API definitions: instaclustr-deprecated-openapi.json, instaclustr-deprecated-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Node Reload
  description: Operation related to reloading nodes.
  x-insta-tag-group: Provisioning V1
paths:
  /provisioning/v1/{bundle}/cluster/{clusterId}/reload:
    get:
      tags:
      - Node Reload
      summary: Get cluster reload operations
      description: Retrieve the latest reload operation done on each node in the specified cluster.
      operationId: getLatestReloadOperationForCluster
      parameters:
      - name: bundle
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - POSTGRESQL
      - name: clusterId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successfully return a list of node reload operations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationMapResponse'
        '400':
          description: The requested bundle is not attached to this cluster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Cluster not found
      deprecated: false
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /provisioning/v1/{bundle}/node/{nodeId}/reload:
    get:
      tags:
      - Node Reload
      summary: Get node reload operations
      description: Retrieve the latest reload operation of the specified node.
      operationId: getLatestNodeReloadOperation
      parameters:
      - name: bundle
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - POSTGRESQL
      - name: nodeId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successfully return the latest node reload operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationListResponse'
        '400':
          description: The requested bundle is not attached to this cluster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Node not found
      deprecated: false
    post:
      tags:
      - Node Reload
      summary: Trigger a node reload operation
      description: Trigger a node reload operation, this is generally done to allow configuration changes to take effect without initiating a full restart.
      operationId: generateNodeReloadOperation
      parameters:
      - name: bundle
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - POSTGRESQL
      - name: nodeId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Successfully trigger the node reload operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          description: The requested bundle is not attached to this cluster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Node not found
        '409':
          description: A reload operation is already running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    OperationResponse:
      type: object
      properties:
        timeCreated:
          type: string
          format: date-time
        timeModified:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - GENESIS
          - RUNNING
          - COMPLETED
          - CANCELLED
          - FAILED
          - CANCELLING
          - BLOCKING
          - PAUSING
          - PAUSED
        message:
          type: string
    OperationMapResponse:
      type: object
      properties:
        operations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/OperationResponse'
    OperationListResponse:
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/OperationResponse'
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
