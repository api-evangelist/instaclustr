components:
  schemas:
    CurrentOperationStatus:
      type: string
      description: Indicates if the cluster is currently performing any operation such as being created, updated, or deleted
      example: OPERATION_IN_PROGRESS
      enum:
      - NO_OPERATION
      - OPERATION_IN_PROGRESS
      - OPERATION_FAILED
      x-insta-tf-import-hidden: true
      x-terraform-field-status: true
    KafkaTopicConfigV2:
      required:
      - key
      - value
      type: object
      properties:
        value:
          type: string
          description: Kafka Topic config value
        key:
          type: string
          description: Kafka Topic config key
      description: Definition of a Kafka Topic Config to be applied to a Kafka topic of a cluster
    KafkaTopicUpdateV3:
      required:
      - configs
      type: object
      properties:
        partitions:
          type: integer
          description: Topic partition count
        configs:
          type: array
          description: List of Kafka topic configs which have non-default values. These could be set by terraform or other methods like kafka cli etc.
          items:
            $ref: '#/components/schemas/KafkaTopicConfigV2'
          x-terraform-ignore-order: true
      description: A listable data source of all non-default topic configs and partition count within a Kafka topic
      example:
        configs:
        - key: compression.type
          value: producer
        - key: min.insync.replicas
          value: '1'
        - key: segment.jitter.ms
          value: '0'
        - key: cleanup.policy
          value: delete
        - key: flush.ms
