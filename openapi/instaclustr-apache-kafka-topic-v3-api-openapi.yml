        - key: index.interval.bytes
          value: '4096'
        - key: unclean.leader.election.enable
          value: 'false'
        - key: retention.bytes
          value: '-1'
        - key: delete.retention.ms
          value: '86400000'
        - key: segment.ms
          value: '604800000'
        - key: segment.index.bytes
          value: '10485760'
        partitions: 3
    KafkaTopicV3:
      required:
      - clusterId
      - partitions
      - replicationFactor
      - topic
      type: object
      properties:
        partitions:
          type: integer
          description: Topic partition count
        configs:
          type: array
          description: List of Kafka topic configs which have non-default values. These could be set by terraform or other methods like kafka cli etc.
          items:
            $ref: '#/components/schemas/KafkaTopicConfigV2'
          x-terraform-ignore-order: true
        replicationFactor:
          type: integer
          description: Replication factor for Topic
          x-terraform-force-new: true
        currentOperationStatus:
          $ref: '#/components/schemas/CurrentOperationStatus'
        topic:
          type: string
          description: Kafka Topic name
          x-terraform-force-new: true
        clusterId:
          type: string
          description: ID of the Kafka cluster
          format: uuid
          x-terraform-force-new: true
        id:
          type: string
          description: 'Instaclustr identifier for the Kafka topic. The value of this property has the form: [cluster-id]_[kafka-topic]'
          readOnly: true
      description: Definition of a Kafka Topic to be applied to a Kafka cluster.
      example:
        clusterId: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
        configs:
        - key: compression.type
