        '415':
          description: 'Unsupported media type: returned when the payload is in an unsupported format.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: 'Too many requests: returned when more than 35 requests per second are being received by your user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      deprecated: false
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    BundleVersionCompatibilityResponseSchema:
      type: object
      properties:
        bundle:
          type: string
          enum:
          - APACHE_CASSANDRA
          - SPARK
          - KAFKA
          - KAFKA_REST_PROXY
          - KAFKA_SCHEMA_REGISTRY
          - ELASTICSEARCH
          - KAFKA_CONNECT
          - REDIS
          - VALKEY
          - APACHE_ZOOKEEPER
          - POSTGRESQL
          - KARAPACE_SCHEMA_REGISTRY
          - KARAPACE_REST_PROXY
        version:
          type: string
        requires_bundle:
          type: string
          description: The prerequisite bundle for this bundle.
          enum:
          - APACHE_CASSANDRA
          - SPARK
          - KAFKA
          - KAFKA_REST_PROXY
          - KAFKA_SCHEMA_REGISTRY
          - ELASTICSEARCH
          - KAFKA_CONNECT
          - REDIS
          - VALKEY
          - APACHE_ZOOKEEPER
          - POSTGRESQL
          - KARAPACE_SCHEMA_REGISTRY
          - KARAPACE_REST_PROXY
        bundle_options:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BundleOption'
          description: All the applicable bundle options.
    ProviderNodeSizes:
      type: object
      properties:
        nodeSizes:
          type: array
          description: All the node sizes from a specific cloud provider.
          items:
            type: string
            description: All the node sizes from a specific cloud provider.
        document:
          type: string
          description: The link to the node size documentation page for a specific cloud provider.
          example: https://aws.amazon.com/ec2/instance-types
    NodeSizeCompatibilityResponseSchema:
      type: object
      properties:
        AWS_VPC:
          $ref: '#/components/schemas/ProviderNodeSizes'
        AZURE:
          $ref: '#/components/schemas/ProviderNodeSizes'
        GCP:
          $ref: '#/components/schemas/ProviderNodeSizes'
    ErrorMessage:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        errorDetails:
          type: object
        code:
          type:
          - integer
          - 'null'
          format: int32
        link:
          type:
          - string
          - 'null'
    BundleOption:
      type: object
      properties:
        description:
          type: string
        type:
          type: string
          description: The value type of the bundle option
          example: boolean
        required:
          type: boolean
          description: Whether the bundle option is required.
        default:
          type: boolean
          description: The default value of the bundle option.
      description: All the applicable bundle options.
    ProvisioningOptions:
      type: object
      properties:
        name:
          type: string
          description: Name of provider
          example: AWS_VPC
          enum:
          - AWS_VPC
          - AZURE_AZ
          - GCP
        displayName:
          type: string
          description: Display name of provider
          example: Amazon Web Services
        regions:
          type: array
          description: List of provisioning options related to data centres
          items:
            $ref: '#/components/schemas/Region'
    Region:
      type: object
      properties:
        globalRegion:
          type: boolean
      description: Region code for the accepter VPC, if the accepter VPC is located in a region other than the region in which you make the request.
      example: US_WEST_2
    BundleCompatibilityResponseSchema:
      type: object
      properties:
        APACHE_CASSANDRA:
          type: array
          description: Compatible versions of Cassandra
          items:
            type: string
            description: Compatible versions of Cassandra
        DEBEZIUM_CONNECTOR_CASSANDRA:
          type: array
          description: Compatible versions of Debezium Connector Cassandra
          items:
            type: string
            description: Compatible versions of Debezium Connector Cassandra
        CASSANDRA_SHOTOVER_PROXY:
          type: array
          description: Compatible versions of Cassandra Shotover Proxy
          items:
            type: string
            description: Compatible versions of Cassandra Shotover Proxy
        REDIS:
          type: array
          description: Compatible versions of Redis
          items:
            type: string
            description: Compatible versions of Redis
        KAFKA:
          type: array
          description: Compatible versions of Kafka
          items:
            type: string
            description: Compatible versions of Kafka
        KAFKA_DISKLESS:
          type: array
          description: Compatible versions of Kafka Diskless
          items:
            type: string
            description: Compatible versions of Kafka Diskless
        ELASTICSEARCH:
          type: array
          description: Compatible versions of Elasticsearch
          items:
            type: string
            description: Compatible versions of Elasticsearch
        SPARK:
          type: array
          description: Compatible versions of Spark
          items:
            type: string
            description: Compatible versions of Spark
        KAFKA_CONNECT:
          type: array
          description: Compatible versions of Kafka Connect
          items:
            type: string
            description: Compatible versions of Kafka Connect
        KAFKA_SCHEMA_REGISTRY:
          type: array
          description: Compatible versions of Kafka Schema Registry
          items:
            type: string
            description: Compatible versions of Kafka Schema Registry
        KAFKA_REST_PROXY:
          type: array
          description: Compatible versions of Kafka Rest Proxy
          items:
            type: string
            description: Compatible versions of Kafka Rest Proxy
        KAFKA_SHOTOVER_PROXY:
          type: array
          description: Compatible versions of Apache ZooKeeper
          items:
            type: string
            description: Compatible versions of Apache ZooKeeper
        APACHE_ZOOKEEPER:
          type: array
          description: Compatible versions of Kafka Shotover Proxy
          items:
            type: string
            description: Compatible versions of Kafka Shotover Proxy
        POSTGRESQL:
          type: array
          description: Compatible versions of Postgresql
          items:
            type: string
            description: Compatible versions of Postgresql
        KARAPACE_REST_PROXY:
          type: array
          description: Compatible versions of Karapace Rest Proxy
          items:
            type: string
            description: Compatible versions of Karapace Rest Proxy
        KARAPACE_SCHEMA_REGISTRY:
          type: array
          description: Compatible versions of Karapace Schema Registry
          items:
            type: string
            description: Compatible versions of Karapace Schema Registry
        MCP_GATEWAY:
          type: array
          description: Compatible versions of MCP Gateway
          items:
            type: string
            description: Compatible versions of MCP Gateway
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
