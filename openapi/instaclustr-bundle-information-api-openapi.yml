openapi: 3.2.0
info:
  title: Instaclustr Bundle Information API
  version: Deprecated
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Bundle Information across 2 of this provider''s published API definitions: instaclustr-deprecated-openapi.json, instaclustr-deprecated-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Bundle Information
  description: Operations related to retrieving information on bundles.
  x-insta-tag-group: Provisioning V1
paths:
  /provisioning/v1/bundles/bundle_type:
    get:
      tags:
      - Bundle Information
      summary: Retrieve all compatible bundles
      description: Retrieve all compatible bundles for the account.
      operationId: getCompatibility
      responses:
        '200':
          description: Successfully retrieved all compatible bundles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundleCompatibilityResponseSchema'
              example: "{\n  \"APACHE_CASSANDRA\": [\n    \"apache-cassandra-4.1.3\",\n    \"apache-cassandra-4.0.11\",\n    \"apache-cassandra-3.11.16.1\"\n  ],\n  \"REDIS\": [\n    \"redis:7.2.4\"\n    \"redis:7.2.9\"\n  ],\n  \"VALKEY\": [\n    \"valkey:7.2.9\"\n    \"valkey:8.1.1\"\n  ],\n  \"KAFKA\": [\n    \"apache-kafka:4.0.0\",\n    \"apache-kafka:3.9.1\"\n  ],\n  \"CADENCE\": [\n    \"cadence:1.2.2\"\n  ],\n  \"OPENSEARCH\": [\n    \"opensearch:1.3.17\",\n    \"opensearch:2.16.0\"\n  ],\n  \"KAFKA_CONNECT\": [\n    \"kafka-connect:4.0.0\",\n    \"kafka-connect:3.9.1\",\n  ],\n  \"KARAPACE_SCHEMA_REGISTRY\": [\n    \"karapace-schema-registry:5.2.0\"\n  ],\n  \"KARAPACE_REST_PROXY\": [\n    \"karapace-rest-proxy:5.2.0\"\n  ],\n  \"APACHE_ZOOKEEPER\": [\n    \"apache-zookeeper:3.9.3\"\n  ],\n  \"POSTGRESQL\": [\n    \"postgresql:18.6\",\n    \"postgresql:17.11\"\n  ],\n  \"PGBOUNCER\": [\n    \"pgbouncer:1.26.0\"\n  ]\n}\n"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not Authorized
          content:
            application/json: {}
        '403':
          description: Forbidden
          content:
            application/json: {}
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '415':
          description: 'Unsupported media type: returned when the payload is in an unsupported format.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: 'Too many requests: returned when more than 35 requests per second are being received by your user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      deprecated: false
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /provisioning/v1/bundles/detail/{BundleVersion}:
    get:
      tags:
      - Bundle Information
      summary: Retrieve bundle version compatibility info
      description: Retrieve bundle options and compatibility list for a specific bundle version.
      operationId: getVersionCompatibility
      parameters:
      - name: BundleVersion
        in: path
        description: A specific version of a bundle.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: apache-cassandra-4.1.3
      responses:
        '200':
          description: Successfully retrieved all bundle options and compatibility list for a specific bundle version.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BundleVersionCompatibilityResponseSchema'
              example:
              - bundle: APACHE_CASSANDRA
                bundle_options:
                  authnAuthz:
                    default: 'false'
                    description: ''
                    required: 'false'
                    type: boolean
                  backupEnabled:
                    default: 'true'
                    description: ''
                    required: 'false'
                    type: boolean
                  clientEncryption:
                    default: 'false'
                    description: ''
                    required: 'false'
                    type: boolean
                  luceneEnabled:
                    default: 'false'
                    description: ''
                    required: 'false'
                    type: boolean
                  usePrivateBroadcastRPCAddress:
                    default: 'false'
                    description: ''
                    required: 'false'
                    type: boolean
                compatible_with:
                - SPARK: apache-spark:2.3.2
                - SPARK: apache-spark:2.1.3
                requires_bundle: null
                version: apache-cassandra-3.11.6
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not Authorized
          content:
            application/json: {}
        '403':
          description: Forbidden
          content:
            application/json: {}
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '415':
          description: 'Unsupported media type: returned when the payload is in an unsupported format.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: 'Too many requests: returned when more than 35 requests per second are being received by your user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      deprecated: false
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /provisioning/v1/bundles/node_size:
    get:
      tags:
      - Bundle Information
      summary: Retrieve compatible node sizes
      description: Retrieve a list of compatible node sizes for a specific bundle combination.
      operationId: getNodeSizeCompatibility
      parameters:
      - name: bundles
        in: query
        description: A valid combination of bundles separated by commas.
        required: true
        style: form
        explode: true
        schema:
          type: string
        example: APACHE_CASSANDRA,DEBEZIUM_CASSANDRA_CONNECTOR
      - name: bundleVersions
        in: query
        description: A valid combination of bundle versions separated by commas, must be of the bundle types given
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: apache-cassandra-4.0.11,debezium-connector-cassandra:2.0.1
      responses:
        '200':
          description: Successfully retrieved all compatible node sizes for a specific bundle combination.
