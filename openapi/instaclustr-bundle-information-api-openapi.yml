  /provisioning/v1/describe-options:
    get:
      tags:
      - Bundle Information
      summary: Retrieve provisioning options
      description: Call this endpoint to retrieve all available provisioning options.
      operationId: getOptions
      parameters:
      - name: providerAccountName
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          description: For customers running in their own account. Your provider account can be found on the Create Cluster page on the console, or the “Provider Account” property on any existing cluster. For customers running in Instaclustr account, this property may be omitted.
          example: INSTACLUSTR
          default: INSTACLUSTR
      - name: provider
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          description: 'Filter by provider. If not provided, all available providers are returned. '
          example: AWS_VPC
          enum:
          - AWS_VPC
          - AZURE
          - GCP
      - name: region
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          description: Filter by region. If not provided, all available regions are returned.
          example: US_EAST_2
      responses:
        '200':
          description: Successfully retrieved provisioning options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProvisioningOptions'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not Authorized
          content:
            application/json: {}
        '403':
          description: Forbidden
          content:
            application/json: {}
        '404':
