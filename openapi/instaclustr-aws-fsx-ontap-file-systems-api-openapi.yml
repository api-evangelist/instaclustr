openapi: 3.2.0
info:
  title: Instaclustr AWS FSx ONTAP File Systems API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged AWS FSx ONTAP File Systems across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: AWS FSx ONTAP File Systems
  description: Operations related to AWS FSx ONTAP file system provisioning
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/data-sources/providers/aws/list-fsxns/v2/:
    get:
      tags:
      - AWS FSx ONTAP File Systems
      summary: List available FSx ONTAP file systems
      responses:
        '200':
          description: List available FSx ONTAP file systems.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AwsFsxOntapFileSystemV2'
      operationId: getClusterManagementV2DataSourcesProvidersAwsListFsxnsV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/providers/aws/fsxn/v2:
    x-terraform-resource-name: aws_fsxn_v2
    post:
      tags:
      - AWS FSx ONTAP File Systems
      summary: Create an FSx ONTAP file system
      description: Create an AWS FSx ONTAP File System.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwsFsxOntapFileSystemV2'
        required: true
      responses:
        '202':
          description: AWS FSx ONTAP File System creation requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwsFsxOntapFileSystemV2'
              example:
                fsxnId: fs-0c315066d18074b67
                id: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
                providerAccountName: MyProviderAccount
                status: RUNNING
                vpcId: vpc-05ea1ef2626686855
          x-terraform-resource-poll-completed-statuses: RUNNING
          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: GENESIS,PROVISIONING,PROVISIONED
      x-codegen-request-body-name: body
      x-terraform-resource-timeout: 99999m
      operationId: postClusterManagementV2ResourcesProvidersAwsFsxnV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/providers/aws/fsxn/v2/{id}:
    parameters:
    - name: id
      in: path
      description: ID of the AWS FSx ONTAP file system.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - AWS FSx ONTAP File Systems
      summary: Retrieve an AWS FSx ONTAP file system
      description: Get an AWS FSx ONTAP file system.
      responses:
        '200':
          description: AWS FSx ONTAP file system retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwsFsxOntapFileSystemV2'
              example:
                fsxnId: fs-0c315066d18074b67
                id: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
                providerAccountName: MyProviderAccount
                status: RUNNING
                vpcId: vpc-05ea1ef2626686855
        '404':
          description: AWS FSx ONTAP file system not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      x-terraform-resource-timeout: 99999m
      operationId: getClusterManagementV2ResourcesProvidersAwsFsxnV2ById
      x-operation-id-source: derived
    delete:
      tags:
      - AWS FSx ONTAP File Systems
      summary: Remove an AWS FSx ONTAP file system
      description: Delete an AWS FSx ONTAP File System.
      responses:
        '204':
          description: AWS FSx ONTAP file system successfully deleted.
          content: {}
        '404':
          description: AWS FSx ONTAP file system not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: deleteClusterManagementV2ResourcesProvidersAwsFsxnV2ById
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    AwsFsxOntapFileSystemV2:
      required:
      - clusterId
      type: object
      properties:
        fsxnId:
          type: string
          description: AWS ID of the file system.
          readOnly: true
          example: fs-0c315066d18074b67
        vpcId:
          type: string
          description: The ID of the VPC where this file system should be provisioned.
          readOnly: true
          example: vpc-0b277cbf8341f50ba
        clusterId:
          type: string
          description: The ID of the cluster who's VPC this file system should share.
          example: 7d01c54a-40f7-4020-8ebc-33547f364417
          x-terraform-write-only: true
        id:
          type: string
          description: Instaclustr ID representing the file system.
          readOnly: true
          example: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
        providerAccountName:
          type: string
          description: The name of the provider account.
          readOnly: true
          example: ExampleProvider
        status:
          type: string
          description: Status of the file system
          readOnly: true
          example: RUNNING
          x-terraform-field-status: true
      description: AWS FSx ONTAP file system.
      example:
        fsxnId: fs-0c315066d18074b67
        id: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
        providerAccountName: MyProviderAccount
        status: RUNNING
        vpcId: vpc-05ea1ef2626686855
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
