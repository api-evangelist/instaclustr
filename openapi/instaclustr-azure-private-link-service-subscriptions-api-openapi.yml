openapi: 3.2.0
info:
  title: Instaclustr Azure Private Link Service Subscriptions API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Azure Private Link Service Subscriptions across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Azure Private Link Service Subscriptions
  description: Azure Private Link Service allowed subscriptions
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/data-sources/azure-private-link-service-subscriptions/v2/{clusterDataCentreId}:
    get:
      tags:
      - Azure Private Link Service Subscriptions
      summary: Get allowed subscription to access private link service for cluster data centre
      parameters:
      - name: clusterDataCentreId
        in: path
        description: ID of the cluster data centre
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: List of subscriptions in allow list for the cluster data centre.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AzurePrivateLinkServiceSubscription'
      operationId: getClusterManagementV2DataSourcesAzurePrivateLinkServiceSubscriptionsV2ByClusterDataCentreId
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/azure-private-link-service-subscriptions/v2:
    x-terraform-resource-name: azure_private_link_service_subscription_v2
    post:
      tags:
      - Azure Private Link Service Subscriptions
      summary: Add an allowed subscription to access private link service for cluster data…
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AzurePrivateLinkServiceSubscription'
        required: true
      responses:
        '202':
          description: Successfully created to add allowed subscription operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzurePrivateLinkServiceSubscription'
              example:
                azureSubscriptionId: d13ae037-ba12-13ed-8bb2-a9e1d2fa67eb
                clusterDataCentreId: 91346037-b969-4c4d-8112-59e1d2aa67e9
                id: a1f46d37-d9f9-4c4d-8112-e9e8d2826792
                reason: ''
                status: PENDING
          x-terraform-resource-poll-completed-statuses: RUNNING
          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: GENESIS,PENDING,PROVISIONING
      x-codegen-request-body-name: body
      x-terraform-resource-timeout: 99999m
      operationId: postClusterManagementV2ResourcesAzurePrivateLinkServiceSubscriptionsV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/azure-private-link-service-subscriptions/v2/{id}:
    parameters:
    - name: id
      in: path
      description: ID of the subscription
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Azure Private Link Service Subscriptions
      summary: Retrieve a list of allowed subscriptions for the private link service
      description: Get details of allowed subscriptions for Azure Private Link Service for the Cluster Data Centre.
      responses:
        '200':
          description: Retrieved the details of allowed subscriptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzurePrivateLinkServiceSubscription'
              example:
                azureSubscriptionId: d13ae037-ba12-13ed-8bb2-a9e1d2fa67eb
                clusterDataCentreId: 91346037-b969-4c4d-8112-59e1d2aa67e9
                id: a1f46d37-d9f9-4c4d-8112-e9e8d2826792
                reason: ''
                status: PENDING
        '404':
          description: Cluster Data Centre or Subscription Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: getClusterManagementV2ResourcesAzurePrivateLinkServiceSubscriptionsV2ById
      x-operation-id-source: derived
    delete:
      tags:
      - Azure Private Link Service Subscriptions
      summary: Delete subscrition from Azure private link allowed list
      description: Successfully created disallow subscription operation.
      responses:
        '204':
          description: Remove subscription from allowed subscriptions for access private link service for cluster data centre.
          content: {}
          x-terraform-resource-poll-completed-statuses: DELETED
          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: GENESIS,RUNNING,PENDING,PROVISIONING,DELETING
        '404':
          description: CDC not found or not an azure private link cluster data centre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: deleteClusterManagementV2ResourcesAzurePrivateLinkServiceSubscriptionsV2ById
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    AzurePrivateLinkServiceSubscription:
      required:
      - azureSubscriptionId
      - clusterDataCentreId
      type: object
      properties:
        reason:
          type: string
          description: Message to provide additional details of status
        clusterDataCentreId:
          type: string
          description: ID of the cluster data centre
          format: uuid
        id:
          type: string
          description: ID used to manage the subscription for the cluster data centre
          format: uuid
        azureSubscriptionId:
          type: string
          description: Resource Id in Azure for subscription for associated access to the private link service
          format: uuid
        status:
          type: string
          description: The status of subscription for the cluster data centre
          readOnly: true
          x-terraform-field-status: true
      description: A listable data source of all Azure Subscriptions allowed to access Azure Private Link Service in an Instaclustr managed cluster data centre.
      example:
        azureSubscriptionId: d13ae037-ba12-13ed-8bb2-a9e1d2fa67eb
        clusterDataCentreId: 91346037-b969-4c4d-8112-59e1d2aa67e9
        id: a1f46d37-d9f9-4c4d-8112-e9e8d2826792
        reason: ''
      x-terraform-ignore-order: true
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
