components:
  schemas:
    McpGatewayMcpBackendHttpAuthenticationV1:
      required:
      - scheme
      type: object
      properties:
        queryParameterName:
          type: string
          description: HTTP query parameter name for backend authentication.
          example: key
        scheme:
          type: string
          description: HTTP Authentication scheme for the backend.
          example: KEY
          enum:
          - PASSTHROUGH
          - KEY
        header:
          maxItems: 1
          type: array
          description: 'HTTP header configuration for backend authentication. Defaults to Authorization: Bearer {KEY}'
          items:
            required:
            - keyPrefix
            type: object
            properties:
              name:
                type: string
                description: HTTP header name for backend authentication. Defaults to Authorization.
                example: Authorization
              keyPrefix:
                type: string
                description: Key prefix, usually specifying authentication scheme.
                example: 'Bearer '
        cookieName:
          type: string
          description: HTTP cookie name for backend authentication.
          example: key
        key:
          type: string
          description: The authentication credentials for the backend.
          example: my-secret-key
          x-terraform-sensitive: true
          x-terraform-write-only: true
      description: HTTP auth for an MCP Backend.
    McpGatewayMcpBackendCassandraV1:
      required:
      - cassandraDataCentreId
      - name
      - virtualServerId
      type: object
      properties:
        virtualServerId:
          type: string
          description: ID of the virtual server this backend belongs to.
          format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
          x-terraform-force-new: true
        cassandraClusterId:
          type: string
          description: ID of the Cassandra Cluster
          format: uuid
          readOnly: true
        name:
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
          description: Name of the backend.
          example: my-cassandra-backend
        clusterId:
          type: string
          description: ID of the MCP Gateway cluster.
          format: uuid
          readOnly: true
          example: 4650aa98-e894-4675-9614-558915d5837a
        id:
          type: string
          description: ID of the backend.
          format: uuid
          readOnly: true
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        cassandraDataCentreId:
          type: string
          description: ID of the Cassandra Data Centre
          format: uuid
        authenticationSaslPlain:
          maxItems: 1
          type: array
          items:
            $ref: '#/components/schemas/AuthenticationSaslPlainV1'
        peerNetworks:
          type: boolean
          description: Create a network peering connection between the backend and the MCP Gateway
        usePrivateNetwork:
          type: boolean
          description: Use private network to communicate with the backend
      description: Configuration for a Cassandra backend.
      example:
        cassandraClusterId: c3d4e5f6-a7b8-9012-cdef-123456789012
        cassandraDataCentreId: d4e5f6a7-b8c9-0123-def0-234567890123
        clusterId: 4650aa98-e894-4675-9614-558915d5837a
        id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        name: my-cassandra-backend
        virtualServerId: b2c3d4e5-f6a7-8901-bcde-f12345678901
    McpGatewayMcpBackendOpenSearchUpdateV1:
      required:
      - name
      - opensearchClusterId
      type: object
      properties:
        name:
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
