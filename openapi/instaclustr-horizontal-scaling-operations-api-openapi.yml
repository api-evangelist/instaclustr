openapi: 3.2.0
info:
  title: Instaclustr Horizontal Scaling Operations API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Horizontal Scaling Operations across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Horizontal Scaling Operations
  description: Operations related to horizontal scaling of Cluster Data Centres.
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/data-sources/cluster-data-centres/v2/{clusterDataCentreId}/horizontal-scaling/operations:
    parameters:
    - name: clusterDataCentreId
      in: path
      description: ID of the Cluster Data Centre.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Horizontal Scaling Operations
      summary: Get horizontal scaling operations for a Cluster Data Centre, currently Kafka…
      parameters:
      - name: activeOnly
        in: query
        description: Only return active operations.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      responses:
        '200':
          description: Successfully retrieved the list of horizontal scaling operations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HorizontalScalingOperationsResponse'
      operationId: getClusterManagementV2DataSourcesClusterDataCentresV2ByClusterDataCentreIdHorizontalScalingOperations
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    HorizontalScalingOperationResponse:
      required:
      - bundleType
      - clusterDataCentreId
      - created
      - direction
      - id
      - numberOfNodes
      - workflowStatus
      type: object
      properties:
        clusterDataCentreId:
          type: string
          description: ID of the cluster data centre.
          format: uuid
          readOnly: true
          example: aabc665c-8916-40ae-978c-96d39a3a1364
        created:
          type: string
          description: When the operation was created.
          readOnly: true
          example: '2026-08-11T01:00:00Z'
        workflowStatus:
          type: string
          description: Current workflow status/phase of the horizontal scaling workflow.
          readOnly: true
          example: PROVISIONING_NODES
        errorMessage:
          type: string
          description: Error message when the operation has failed.
          readOnly: true
        bundleType:
          type: string
          description: Primary bundle type of the cluster data centre.
          readOnly: true
          example: KAFKA
        completed:
          type: string
          description: When the operation completed, if finished.
          readOnly: true
          example: '2026-08-11T02:00:00Z'
        completedStatus:
          type: string
          description: Terminal status of the operation when completed.
          readOnly: true
          enum:
          - COMPLETED
          - FAILED
        id:
          type: string
          description: ID of the horizontal scaling operation.
          format: uuid
          readOnly: true
        numberOfNodes:
          type: integer
          description: Number of nodes requested for this horizontal scaling operation.
          example: 3
        direction:
          type: string
          description: Direction of the horizontal scaling operation.
          readOnly: true
          example: ADD
          enum:
          - ADD
          - REMOVE
      description: A horizontal scaling operation for a cluster data centre.
      example:
        bundleType: KAFKA
        clusterDataCentreId: aabc665c-8916-40ae-978c-96d39a3a1364
        created: '2026-08-11T01:00:00Z'
        direction: ADD
        id: 4650aa98-e894-4675-9614-558915d5837a
        numberOfNodes: 3
        workflowStatus: PROVISIONING_NODES
    HorizontalScalingOperationsResponse:
      type: object
      properties:
        operations:
          type: array
          description: Horizontal scaling operations for the cluster data centre.
          readOnly: true
          items:
            $ref: '#/components/schemas/HorizontalScalingOperationResponse'
      description: Horizontal scaling operations for a cluster data centre.
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
