openapi: 3.2.0
info:
  title: Instaclustr Valkey Provisioning V2 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Valkey Provisioning V2 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Valkey Provisioning V2
  description: ''
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/data-sources/applications/valkey/clusters/v2/{clusterId}/list-backups/v2/:
    parameters:
    - name: clusterId
      in: path
      description: ID of the cluster.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Valkey Provisioning V2
      summary: List recent cluster backup events
      responses:
        '200':
          description: List backups and restores for each node in a given cluster, for the last 7 days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonClusterBackupEventsV2'
              example:
                clusterDataCentres:
                - id: a8c32b20-c8f0-11e7-abc4-cec278b6b50a
                  name: AWS_VPC_US_EAST_1
                  nodes:
                  - events:
                    - end: 1510585212265
                      progress: 0.5
                      start: 1510585212265
                      state: ACTIVE
                      type: snapshot-upload
                    id: cb986e08-f6be-4d08-8de2-4352c2cfaf1f
                    privateAddress: 10.0.0.1
                    publicAddress: 50.0.0.1
                id: 77b5a4e1-c422-4a78-b551-d8fa5c42ad95
                name: example-cluster
      operationId: getClusterManagementV2DataSourcesApplicationsValkeyClustersV2ByClusterIdListBackupsV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/data-sources/applications/valkey/compatible-node-sizes/v2/:
    get:
      tags:
      - Valkey Provisioning V2
      summary: List compatible node sizes for Valkey
      responses:
        '200':
          description: Successfully retrieved compatible node sizes for Valkey.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CloudProviderNodeSizesListV2'
      operationId: getClusterManagementV2DataSourcesApplicationsValkeyCompatibleNodeSizesV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/data-sources/applications/valkey/versions/v2/:
    get:
      tags:
      - Valkey Provisioning V2
      summary: List all Valkey versions
      responses:
        '200':
          description: Successfully retrieved versions of Valkey.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationVersionListV2'
      operationId: getClusterManagementV2DataSourcesApplicationsValkeyVersionsV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/operations/applications/valkey/clusters/v2/{clusterId}/certificate/v2/:
    parameters:
    - name: clusterId
      in: path
      description: ID of the cluster
      required: true
      style: simple
      explode: false
      schema:
        type: string
    get:
      tags:
      - Valkey Provisioning V2
      summary: Download Valkey cluster X.509 Certificate Authority certificates
      description: Valkey cluster certificates are returned as a .zip file. The file contains an X.509 cluster Certificate Authority certificate in JKS file, an X.509 cluster Certificate Authority certificate in PEM-encoded (ASCII) format, and an X.509 cluster Certificate Authority certificate in DER-encoded (binary) format.
      responses:
        '200':
          description: Successfully create the Valkey cluster's certificate
          content:
            application/zip:
              schema:
                type: string
                format: binary
      operationId: getClusterManagementV2OperationsApplicationsValkeyClustersV2ByClusterIdCertificateV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/operations/applications/valkey/clusters/v2/{clusterId}/trigger-backup/v2/:
    parameters:
    - name: clusterId
      in: path
      description: ID of the cluster.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Valkey Provisioning V2
      summary: Manually trigger cluster backup
      responses:
        '202':
          description: Trigger cluster backup request accepted.
          content: {}
      operationId: postClusterManagementV2OperationsApplicationsValkeyClustersV2ByClusterIdTriggerBackupV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/operations/applications/valkey/restore/v2:
    post:
      tags:
      - Valkey Provisioning V2
      summary: Trigger a Valkey Cluster Restore
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterRestoreV2'
        required: true
      responses:
        '202':
          description: Valkey Cluster Restore requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterRestoreV2'
              example:
                cdcConfigs:
                - cdcId: a8c32b20-c8f0-11e7-abc4-cec278b6b50a
                  customVpcSettings:
                    network: 10.0.0.0/16
                    vpcId: vpc-002512aa
                  restoreMode: CUSTOM_VPC
                clusterId: c0e5e2ff-affe-444c-bdca-707c7b48aaad
                pointInTime: 1420070400000
                restoredClusterId: b8a32a20-d8e0-11a7-def4-sdc278a6a50b
                restoredClusterName: my-restored-cluster
      x-codegen-request-body-name: body
      operationId: postClusterManagementV2OperationsApplicationsValkeyRestoreV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/valkey/clusters/v2:
    x-terraform-resource-name: valkey_cluster_v2
    post:
      tags:
      - Valkey Provisioning V2
