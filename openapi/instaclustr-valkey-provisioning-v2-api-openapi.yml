        nodes:
          type: array
          description: List of non-deleted nodes in the data centre
          readOnly: true
          items:
            $ref: '#/components/schemas/NodeDetailsV2'
        cloudProvider:
          $ref: '#/components/schemas/CloudProviderEnumV2'
        azureSettings:
          maxItems: 1
          type: array
          description: Azure specific settings for the Data Centre. Cannot be provided with AWS or GCP settings.
          items:
            $ref: '#/components/schemas/ProviderAzureSettingsV2'
          x-insta-comment: See x-insta-comment on awsSettings
          x-insta-unchangeable: true
          x-terraform-computed: true
        masterNodes:
          maximum: 500
          minimum: 3
          type: integer
          description: Total number of master nodes in the Data Centre. In order to maintain quorum on the cluster, you must specify an odd number of master nodes.
          example: 3
        name:
          type: string
          description: A logical name for the data centre within a cluster. These names must be unique in the cluster.
          example: US_EAST_1_DC
          x-insta-unchangeable: true
        replicaNodes:
          maximum: 1000
          minimum: 0
          type: integer
          description: Total number of replica nodes in the Data Centre.
          example: 3
          x-terraform-computed: true
        id:
          type: string
          description: ID of the Cluster Data Centre.
          readOnly: true
          example: 4650aa98-e894-4675-9614-558915d5837a
        region:
          type: string
          description: Region of the Data Centre. See the description for node size for a compatible Data Centre for a given node size.
          example: US_EAST_1
          x-insta-unchangeable: true
        privateLink:
          type: array
          description: Create a PrivateLink enabled cluster, see [PrivateLink](https://www.instaclustr.com/support/documentation/useful-information/privatelink/).
          items:
            $ref: '#/components/schemas/PrivateLinkSettingsV2'
        providerAccountName:
          type: string
          description: For customers running in their own account. Your provider account can be found on the Create Cluster page on the Instaclustr Console, or the "Provider Account" property on any existing cluster. For customers provisioning on Instaclustr's cloud provider accounts, this property may be omitted.
          x-insta-unchangeable: true
          x-terraform-computed: true
        status:
          type: string
          description: Status of the Data Centre.
          readOnly: true
          example: RUNNING
      description: ''
    CloudProviderEnumV2:
      type: string
      description: Name of a cloud provider service.
      example: AWS_VPC
      enum:
      - AWS_VPC
      - GCP
      - AZURE
      - AZURE_AZ
      - ONPREMISES
      x-insta-unchangeable: true
    CustomVpcSettingsRestoreV2:
      required:
      - network
      - vpcId
      type: object
      properties:
        vpcId:
          type: string
          description: Custom VPC ID to which the restored cluster will be allocated.
        network:
          type: string
          description: CIDR block in which the cluster will be allocated for a custom VPC
      description: Definition of Custom VPC Settings to be applied to Cluster Data Centre
    CommonClusterRestoreModeEnumV2:
      type: string
      description: "Determines the target VPC for restored cluster. Accepted values are:\n<ul> \n<li>NEW_VPC - restores the cluster to a new VPC.</li> \n<li>SAME_VPC - restores the cluster to the same VPC as the original cluster, for customers running in their own account.</li>\n  <ul><li>AWS - restore to a new Cidr within the CDC's network</li> <li>GCP - For customer-managed network, if the source cluster specifies a host project, it will be restored to that project.  If the source cluster specifies a custom subnet, it will be restored to that custom subnet. If nothing is specified, it will restore to a new Cidr within the CDC network.</li> <li>Azure - currently not supported.</li></ul> <li>CUSTOM_VPC - restores the cluster to a custom VPC for customers running in their own account. Customers need to specify the customVpcSettings including network and vpcId.</li>\n  <ul><li>AWS - restores the cluster to the network Cidr and vpc specified by the customer</li> <li>GCP - For customer-managed network, if the vpcId field contains the projects/ pattern, it will be restored to that project.  If the vpcId field contains the subnetworks/ pattern, it will be restored to that custom subnet. If nothing is specified, it will restore to a new Cidr within the CDC network.</li> <li>Azure - restores the cluster to the network Cidr and VNet specified by the customer.</li></ul>\n CUSTOM_VPC and SAME_VPC options are available only for customers running in their own account."
      enum:
      - NEW_VPC
      - SAME_VPC
      - CUSTOM_VPC
      x-terraform-write-only: true
    ValkeyClusterV2:
      required:
      - clientToNodeEncryption
      - dataCentres
      - name
      - passwordAndUserAuth
      - pciComplianceMode
      - privateNetworkCluster
      - slaTier
      - valkeyVersion
      type: object
      properties:
        clientToNodeEncryption:
          type: boolean
          description: Enables Client ⇄ Node Encryption.
          example: true
          x-terraform-force-new: true
        pciComplianceMode:
          type: boolean
          description: Creates a PCI compliant cluster, see [PCI Compliance](https://www.instaclustr.com/support/documentation/useful-information/pci-compliance/).
          example: true
          x-terraform-force-new: true
        valkeyVersion:
          pattern: '[0-9]+\.[0-9]+\.[0-9]+'
          type: string
          description: 'Version of Valkey to run on the cluster. Available versions: <ul> </ul>'
          example: 1.2.3
          x-terraform-force-new: true
        description:
          type: string
          description: A description of the cluster
          example: Cluster managed by the integration team.
          x-terraform-computed: true
        twoFactorDelete:
          maxItems: 1
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/TwoFactorDeleteSettingsV2'
          x-terraform-computed: true
        dataCentres:
          maxItems: 2
          minItems: 1
          type: array
          description: List of data centre settings.
          items:
            $ref: '#/components/schemas/ValkeyDataCentreV2'
          x-terraform-field-name: data_centre
          x-terraform-ignore-order: true
        currentClusterOperationStatus:
          $ref: '#/components/schemas/CurrentClusterOperationStatusV2'
        privateNetworkCluster:
          type: boolean
          description: Creates the cluster with private network only, see [Private Network Clusters](https://www.instaclustr.com/support/documentation/useful-information/private-network-clusters/).
          example: true
          x-terraform-force-new: true
        passwordAndUserAuth:
          type: boolean
          description: Enables Password Authentication and User Authorization.
          example: true
          x-terraform-force-new: true
        name:
          maxLength: 48
          minLength: 3
          pattern: '[a-zA-Z0-9][a-zA-Z0-9_-]*'
          type: string
          description: Name of the cluster.
          example: exampleCluster
          x-terraform-force-new: true
        resizeSettings:
          maxItems: 1
          type: array
          description: Settings to determine how resize requests will be performed for the cluster.
          items:
            $ref: '#/components/schemas/ResizeSettingsV2'
          x-terraform-write-only: true
        id:
          type: string
          description: ID of the cluster.
          readOnly: true
          example: 4650aa98-e894-4675-9614-558915d5837a
        slaTier:
          $ref: '#/components/schemas/SlaTierV2'
        status:
          type: string
          description: Status of the cluster.
          readOnly: true
          example: RUNNING
      description: Definition of a managed Valkey cluster that can be provisioned in Instaclustr.
      example:
        clientToNodeEncryption: true
        dataCentres:
        - cloudProvider: AWS_VPC
          masterNodes: 3
          name: AWS_VPC_US_EAST_1
          network: 10.0.0.0/16
          nodeSize: r6g.large-100-r
          region: US_EAST_1
          replicaNodes: 3
        name: MyTestCluster
        passwordAndUserAuth: true
        pciComplianceMode: false
        privateNetworkCluster: false
        slaTier: PRODUCTION
        valkeyVersion: '[x.y.z]'
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
