      x-codegen-request-body-name: body
      x-terraform-resource-timeout: 99999m
      operationId: postClusterManagementV2ResourcesApplicationsValkeyClustersV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/valkey/clusters/v2/{clusterId}:
    parameters:
    - name: clusterId
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Valkey Provisioning V2
      summary: Get Valkey cluster details
      responses:
        '200':
          description: Valkey cluster details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValkeyClusterV2'
