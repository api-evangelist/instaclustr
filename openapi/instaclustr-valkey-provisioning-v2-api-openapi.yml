components:
  schemas:
    ProviderAzureSettingsV2:
      type: object
      properties:
        resourceGroup:
          type: string
          description: The name of the Azure Resource Group into which the Data Centre will be provisioned.
          x-insta-unchangeable: true
        customVirtualNetworkId:
          type: string
          description: VNet ID into which the Data Centre will be provisioned. The VNet must have an available address space for the Data Centre's network allocation to be appended to the VNet. Currently supported for PostgreSQL clusters only.
          example: /subscriptions/{subscription-id}/resourceGroups/{resource-group-name}/providers/Microsoft.Network/virtualNetworks/{virtual-network-name}
          x-insta-unchangeable: true
        storageNetwork:
          type: string
          description: 'The private network address block to be used for the storage network. This is only used for certain node sizes, currently limited to those which use Azure NetApp Files: for all other node sizes, this field should not be provided. The network must have a prefix length between /16 and /28, and must be part of a private address range.'
          example: 192.168.1.0/24
          x-insta-unchangeable: true
      description: ''
    ClusterDataCentreRestoreConfigV2:
      required:
      - cdcId
      - restoreMode
      type: object
      properties:
        customVpcSettings:
          $ref: '#/components/schemas/CustomVpcSettingsRestoreV2'
        restoreMode:
          $ref: '#/components/schemas/CommonClusterRestoreModeEnumV2'
        cdcId:
          type: string
          description: Cluster Data Centre ID
          format: uuid
      description: Definition of a Cluster Data Centre to Cluster Restore
    ClusterRestoreV2:
      required:
      - clusterId
      type: object
      properties:
        cdcConfigs:
          type: array
          description: 'An optional list of Cluster Data Centres to determine their VPC in the restored cluster.


            Data centres not included will default to being restored to a new VPC.'
          items:
            $ref: '#/components/schemas/ClusterDataCentreRestoreConfigV2'
        pointInTime:
          type: string
          description: 'Timestamp in milliseconds since epoch or ISO formatted date and time (example - 2023-11-05T13:15:30Z). All backed up data will be restored for this point in time.


            Defaults to the current date and time.'
        restoredClusterName:
          maxLength: 48
          minLength: 3
          pattern: '[a-zA-Z0-9][a-zA-Z0-9_-]*'
          type: string
          description: 'The display name of the restored cluster.


            By default, the restored cluster will be created with its current name appended with “restored” and the date & time it was requested to be restored.'
        restoredClusterId:
          type: string
          description: ID of the restored cluster
          format: uuid
          readOnly: true
        clusterId:
          type: string
          description: ID of the cluster
          format: uuid
          x-terraform-force-new: true
      description: Definition of a Restore to be applied to a cluster
      example:
        cdcConfigs:
        - cdcId: a8c32b20-c8f0-11e7-abc4-cec278b6b50a
          customVpcSettings:
            network: 10.0.0.0/16
            vpcId: vpc-002512aa
          restoreMode: CUSTOM_VPC
        clusterId: c0e5e2ff-affe-444c-bdca-707c7b48aaad
        pointInTime: 1420070400000
        restoredClusterName: my-restored-cluster
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    NodeDetailsV2:
      type: object
      properties:
        nodeRoles:
          type: array
          description: The roles or purposes of the node. Useful for filtering for nodes that have a specific role.
          readOnly: true
          items:
            $ref: '#/components/schemas/NodeRolesV2'
        rack:
          type: string
          description: Rack name in which the node is located.
          readOnly: true
        nodeSize:
          type: string
          description: Size of the node.
          readOnly: true
        privateAddress:
          type: string
          description: Private IP address of the node.
          readOnly: true
          example: 10.131.60.142
        deletionTime:
          type: string
          description: Deletion time of the node as a UTC timestamp
          readOnly: true
          example: '2019-08-24T14:15:22Z'
        publicAddress:
          type: string
          description: Public IP address of the node.
          readOnly: true
          example: 52.0.5.140
        startTime:
          type: string
          description: Start time of the node as a UTC timestamp
          readOnly: true
          example: '2019-08-24T14:15:22Z'
        id:
          type: string
          description: ID of the node.
          readOnly: true
          example: 9a27373a-0451-4121-94ba-873fc441f313
        status:
          type: string
          description: Provisioning status of the node.
          readOnly: true
          example: RUNNING
      description: ''
    ProviderTagV2:
      required:
      - key
      type: object
      properties:
        value:
          type: string
          description: Value of the custom tag.
          example: myTagValue
        key:
          type: string
          description: Key of the custom tag.
          example: myTagKey
          x-insta-unchangeable: true
      description: Custom tag for cloud provider resources.
    TwoFactorDeleteSettingsV2:
      required:
      - confirmationEmail
      type: object
      properties:
        confirmationPhoneNumber:
          pattern: ^(?![\s])[\-\s\(\)\+0-9]*$
          type: string
          description: The phone number which will be contacted when the cluster is requested to be delete.
          x-terraform-computed: true
        confirmationEmail:
          pattern: ^(([\s]*[^<>()\[\]\\.,;:@\s"]+(\.[^<>()\[\]\\.,;:\s@"]+)*))@((\[\d{1,3}(\.\d{1,3}){3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}[\s]*))$
          type: string
          description: The email address which will be contacted when the cluster is requested to be deleted.
          x-terraform-computed: true
      description: ''
    ResizeSettingsV2:
      type: object
      properties:
        notifySupportContacts:
          type: boolean
          description: Setting this property to `true` will notify the Instaclustr Account's designated support contacts on resize completion.
          x-terraform-write-only: true
        downsizeAcknowledged:
          type: boolean
          description: Set to `true` when the user has acknowledged that this resize reduces resource capacity and may cause node instability.
          x-terraform-write-only: true
        concurrency:
          type: integer
          description: Number of concurrent nodes to resize during a resize operation.
          x-terraform-write-only: true
      description: Settings to determine how resize requests will be performed for the cluster.
    SlaTierV2:
      type: string
      description: SLA Tier of the cluster. Non-production clusters may receive lower priority support and reduced SLAs. Production tier is not available when using Developer class nodes. See [SLA Tier](https://www.instaclustr.com/support/documentation/useful-information/sla-tier/) for more information.
      example: NON_PRODUCTION
      enum:
      - PRODUCTION
      - NON_PRODUCTION
      x-terraform-force-new: true
    CommonClusterBackupEventsV2:
      title: Root Type for CommonClusterBackupEventV2
      type: object
      properties:
        clusterDataCentres:
          type: array
          description: List of data centres in the cluster
          items:
            $ref: '#/components/schemas/CommonClusterBackupEventDataCentreV2'
        name:
          type: string
          description: Name of the cluster
          example: example-cluster
        id:
          type: string
          description: ID of the Cluster
          example: 77b5a4e1-c422-4a78-b551-d8fa5c42ad95
      description: ''
      example:
        clusterDataCentres:
        - id: a8c32b20-c8f0-11e7-abc4-cec278b6b50a
          name: AWS_VPC_US_EAST_1
          nodes:
          - events:
            - end: 1510585212265
              progress: 0.5
              start: 1510585212265
              state: ACTIVE
              type: snapshot-upload
            id: cb986e08-f6be-4d08-8de2-4352c2cfaf1f
            privateAddress: 10.0.0.1
            publicAddress: 50.0.0.1
        id: 77b5a4e1-c422-4a78-b551-d8fa5c42ad95
        name: example-cluster
    ApplicationVersionsV2:
      type: object
      properties:
        application:
          $ref: '#/components/schemas/ApplicationEnumV2'
        versions:
          type: array
          description: List of sematic versions.
          example:
          - 1.0.0
          - 1.0.1
          items:
            pattern: '[0-9]+\.[0-9]+\.[0-9]+'
            type: string
      description: Object containing a single application and its available versions.
    CloudProviderNodeSizesListV2:
      type: object
      properties:
        cloudProviderNodeSizes:
          type: array
          description: List of all compatible cloud provider node sizes.
          items:
            $ref: '#/components/schemas/CloudProviderNodeSizesV2'
      description: Object containing list of node sizes grouped by cloud provider.
    CommonClusterBackupEventNodeEventV2:
      title: Root Type for CommonClusterBackupNodeEventV2
      type: object
      properties:
        start:
          type: number
          description: Timestamp of when the event was triggered
          example: 0.5
        progress:
          type: number
          description: Event progress [0..1]
          format: float
          example: 0.5
        end:
          type: number
          description: Timestamp of when the event was completed. Can be null.
          example: 1510585212265
        state:
          type: string
          description: State of the event
          example: ACTIVE
          enum:
          - ACTIVE
          - COMPLETED
          - FAILED
        type:
          type: string
          description: Type of event
          example: snapshot-upload
      description: ''
      example:
        end: 1510585212265
        progress: 0.5
        start: 1510585212265
        state: ACTIVE
        type: snapshot-upload
    CurrentClusterOperationStatusV2:
      type: string
      description: Indicates if the cluster is currently performing any restructuring operation such as being created or resized
      example: OPERATION_IN_PROGRESS
      enum:
      - NO_OPERATION
      - OPERATION_IN_PROGRESS
      - OPERATION_FAILED
      x-insta-tf-import-hidden: true
