        '415':
          description: 'Unsupported media type: returned when the payload is in an unsupported format.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: 'Too many requests: returned when more than 35 requests per second are being received by your user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout
      deprecated: false
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    BundleUserDeleteRequest:
      required:
      - username
      type: object
      properties:
        username:
          maxLength: 255
          minLength: 1
          type: string
          example: yourUserName
    GenericResponse:
      type: object
      properties:
        message:
          type: string
          description: message content
    BundleUserCreateRequest:
      required:
      - password
      - username
      type: object
      properties:
        username:
          maxLength: 255
          minLength: 1
          type: string
          example: yourUserName
        password:
          maxLength: 2147483647
          minLength: 8
          type: string
          description: Bundle user password
          example: yourPassword
        options:
          type: object
          description: 'A collection of optional bundle-specific user options - the options available to be set differ depending on the bundle type.</h3><table style="width:100%;word-break:break-word;font-size:0.8em">

            <tr><th>Bundle</th><th>Option</th><th>Allowable values</th></tr>

            <tr><td>Kafka</td><td>"sasl-scram-mechanism"</td><td>"SCRAM-SHA-256" (Default), "SCRAM-SHA-512"</td></tr>

            <tr><td>Kafka</td><td>"override-existing-user"</td><td>true (Default), false</td></tr>

            </table>'
          example:
            override-existing-user: true
            sasl-scram-mechanism: SCRAM-SHA-512
        initial-permissions:
          type: string
          description: Permissions upon user creation
          writeOnly: true
          example: standard
          enum:
          - standard
          - read-only
          - limited-admin
          - none
    BundleUserResetPasswordRequest:
      required:
      - password
      - username
      type: object
      properties:
        username:
          maxLength: 255
          minLength: 1
          type: string
          example: yourUserName
        password:
          maxLength: 2147483647
          minLength: 8
          type: string
          description: Password to apply
          example: yourNewPassword
        options:
          type: object
          description: 'A collection of optional bundle-specific user options - the options available to be set differ depending on the bundle type.</h3><table style="width:100%;word-break:break-word;font-size:0.8em">

            <tr><th>Bundle</th><th>Option</th><th>Allowable values</th></tr>

            <tr><td>Kafka</td><td>"sasl-scram-mechanism"</td><td>"SCRAM-SHA-256" (Default), "SCRAM-SHA-512"</td></tr>

            </table>'
          example:
            sasl-scram-mechanism: SCRAM-SHA-512
    ErrorMessage:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        errorDetails:
          type: object
        code:
          type:
          - integer
          - 'null'
          format: int32
        link:
          type:
          - string
          - 'null'
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
