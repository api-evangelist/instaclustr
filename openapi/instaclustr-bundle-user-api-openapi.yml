openapi: 3.2.0
info:
  title: Instaclustr Bundle User API
  version: Deprecated
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Bundle User across 2 of this provider''s published API definitions: instaclustr-deprecated-openapi.json, instaclustr-deprecated-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Bundle User
  description: Operations related to users in a bundle.
  x-insta-tag-group: Provisioning V1
paths:
  /provisioning/v1/{clusterId}/{bundle}/users:
    get:
      tags:
      - Bundle User
      summary: Get a list of bundle users
      description: Retrieve a list of bundle users currently enabled in the given cluster.
      operationId: listUsers
      parameters:
      - name: clusterId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        example: 64223f17-7c9b-4986-8e2e-a44a91a26635
      - name: bundle
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: kafka
      responses:
        '200':
          description: Successfully returned a JSON list of bundle users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
              - ickafka
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not Authorized
          content:
            application/json: {}
        '403':
          description: Missing permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '415':
          description: 'Unsupported media type: returned when the payload is in an unsupported format.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: 'Too many requests: returned when more than 35 requests per second are being received by your user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout
      deprecated: false
    post:
      tags:
      - Bundle User
      summary: Add a bundle user
      description: Add a new bundle user to the given cluster with read write access to all topics
      operationId: createUser
      parameters:
      - name: clusterId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        example: 64223f17-7c9b-4986-8e2e-a44a91a26635
      - name: bundle
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: kafka
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BundleUserCreateRequest'
      responses:
        '201':
          description: Bundle user successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                message: User test1 created.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not Authorized
          content:
            application/json: {}
        '403':
          description: Missing permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '415':
          description: 'Unsupported media type: returned when the payload is in an unsupported format.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: 'Too many requests: returned when more than 35 requests per second are being received by your user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout
      deprecated: false
    delete:
      tags:
      - Bundle User
      summary: Delete a bundle user
      description: Delete bundle user for a given username
      operationId: deleteUser
      parameters:
      - name: clusterId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        example: 64223f17-7c9b-4986-8e2e-a44a91a26635
      - name: bundle
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: kafka
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BundleUserDeleteRequest'
      responses:
        '200':
          description: Bundle user successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                message: User test1 has been deleted.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not Authorized
          content:
            application/json: {}
        '403':
          description: Missing permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '415':
          description: 'Unsupported media type: returned when the payload is in an unsupported format.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: 'Too many requests: returned when more than 35 requests per second are being received by your user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout
      deprecated: false
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /provisioning/v1/{clusterId}/{bundle}/users/reset-password:
    post:
      tags:
      - Bundle User
      summary: Change bundle user password
      description: Reset bundle user password for a given username
      operationId: resetPasswordForUser
      parameters:
      - name: clusterId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        example: 64223f17-7c9b-4986-8e2e-a44a91a26635
      - name: bundle
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: kafka
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BundleUserResetPasswordRequest'
      responses:
        '200':
          description: Password successfully reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
              example:
                message: Updated password for user test1.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not Authorized
          content:
            application/json: {}
        '403':
          description: Missing permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
