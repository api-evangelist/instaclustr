tags:
- name: Cluster Exclusion Window V2
  description: Cluster exclusion window
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/data-sources/cluster/{clusterId}/exclusion-windows/v2:
    parameters:
    - name: clusterId
      in: path
      description: ID of the cluster
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    x-terraform-resource-name: exclusion_windows_v2
    get:
      tags:
      - Cluster Exclusion Window V2
      summary: List cluster exclusion windows
      description: Lists all exclusion windows (times when maintenance events cannot be performed) for the cluster
      responses:
        '200':
          description: Successfully retrieved exclusion windows for cluster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClusterExclusionWindowsV2'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
        '401':
          description: Not Authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '415':
          description: 'Unsupported media type: returned when the payload is in an unsupported format'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
      operationId: getClusterManagementV2DataSourcesClusterByClusterIdExclusionWindowsV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/exclusion-windows/v2:
    x-terraform-resource-name: cluster_exclusion_window_v2
    post:
      tags:
      - Cluster Exclusion Window V2
      summary: Create cluster exclusion window
      description: Creates a new exclusion window (time when maintenance events cannot be performed) for the cluster
      requestBody:
        description: Details of the cluster exclusion window
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterExclusionWindowV2'
        required: true
      responses:
        '202':
          description: Successfully created exclusion window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterExclusionWindowV2'
              example:
                clusterId: cf4fccf3-2ac0-494b-9f40-e95288dd752d
                dayOfWeek: TUESDAY
                durationInHours: 6
                id: af4fccf3-2ac0-494b-9f40-e95288dd752d
                startHour: 14
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
        '401':
          description: Not Authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '415':
          description: 'Unsupported media type: returned when the payload is in an unsupported format'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
      x-codegen-request-body-name: body
      operationId: postClusterManagementV2ResourcesExclusionWindowsV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/exclusion-windows/v2/{windowId}:
    parameters:
    - name: windowId
      in: path
      description: ID of the Exclusion window
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Cluster Exclusion Window V2
      summary: Get cluster exclusion window details
      responses:
        '200':
          description: Retrieve the details of the cluster exclusion window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterExclusionWindowV2'
              example:
                clusterId: cf4fccf3-2ac0-494b-9f40-e95288dd752d
                dayOfWeek: TUESDAY
                durationInHours: 6
                id: af4fccf3-2ac0-494b-9f40-e95288dd752d
                startHour: 14
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
        '401':
          description: Not Authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '415':
          description: 'Unsupported media type: returned when the payload is in an unsupported format'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
      operationId: getClusterManagementV2ResourcesExclusionWindowsV2ByWindowId
      x-operation-id-source: derived
    delete:
      tags:
      - Cluster Exclusion Window V2
      summary: Delete cluster exclusion window
      description: Removes an exclusion window for the cluster
      responses:
        '204':
          description: Successfully deleted exclusion window
          content: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
        '401':
          description: Not Authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '415':
          description: 'Unsupported media type: returned when the payload is in an unsupported format'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseV2'
        '429':
          description: 'Too many requests: returned when more than 750 requests per minute are being received by your user'
          content: {}
      operationId: deleteClusterManagementV2ResourcesExclusionWindowsV2ByWindowId
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    ClusterExclusionWindowV2:
      required:
      - clusterId
      - dayOfWeek
      - durationInHours
      - startHour
      type: object
      properties:
        dayOfWeek:
          type: string
          description: The day of the week that this exclusion window starts on
          example: TUESDAY
          enum:
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
          - SATURDAY
          - SUNDAY
        startHour:
          maximum: 23
          minimum: 0
          type: integer
          description: The hour of the day that this exclusion window starts on
          format: int32
          example: 14
        durationInHours:
          minimum: 1
          type: integer
          description: The duration (in hours) of this exclusion window
          format: int32
          example: 6
        clusterId:
          type: string
          description: Cluster Id for the cluster that this exclusion window relates to
          format: uuid
          example: 71e4380e-32ac-4fa7-ab42-c165fe35aa55
        id:
          type: string
          description: ID of the Cluster exclusion window
          format: uuid
          readOnly: true
          example: 71e4380e-32ac-4fa7-ab42-c165fe35aa55
      description: Definition to Cluster exclusion window
      example:
        clusterId: cf4fccf3-2ac0-494b-9f40-e95288dd752d
        dayOfWeek: TUESDAY
        durationInHours: 6
        startHour: 14
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    ClusterExclusionWindowsV2:
      type: object
      properties:
        exclusionWindows:
          type: array
          description: List of cluster exclusion windows
          readOnly: true
          items:
            $ref: '#/components/schemas/ClusterExclusionWindowV2'
        clusterId:
          type: string
          description: ID of the cluster
          readOnly: true
          x-terraform-id: true
      description: Definition to the Cluster exclusion windows
      example:
        clusterId: cf4fccf3-2ac0-494b-9f40-e95288dd752d
        exclusionWindows:
        - clusterId: cf4fccf3-2ac0-494b-9f40-e95288dd752d
          dayOfWeek: TUESDAY
          durationInHours: 7
          id: af4fccf3-2ac0-494b-9f40-e95288dd752d
          startHour: 5
        - clusterId: cf4fccf3-2ac0-494b-9f40-e95288dd752d
          dayOfWeek: MONDAY
          durationInHours: 38
          id: af4fccf3-2ac0-494b-9f40-e95288dd753a
          startHour: 4
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
