openapi: 3.2.0
info:
  title: Instaclustr Apache Kafka ACL V3 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Apache Kafka ACL V3 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Apache Kafka ACL V3
  description: ''
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/resources/applications/kafka/acls/v3/:
    x-terraform-resource-name: kafka_acl_v3
    post:
      tags:
      - Apache Kafka ACL V3
      summary: Create a Kafka ACL
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KafkaAclListV3'
        required: true
      responses:
        '202':
          description: Kafka ACL creation requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaAclListV3'
              example:
                acls:
                - host: '*'
                  operation: DESCRIBE
                  patternType: LITERAL
                  permissionType: ALLOW
                  principal: User:test
                  resourceName: kafka-cluster
                  resourceType: CLUSTER
                - host: '*'
                  operation: CREATE
                  patternType: PREFIXED
                  permissionType: ALLOW
                  principal: User:test
                  resourceName: kafka-topic
                  resourceType: TOPIC
                clusterId: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
                currentOperationStatus: OPERATION_IN_PROGRESS
                id: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37_test
                userQuery: test
          x-terraform-resource-poll-completed-statuses: NO_OPERATION
          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: OPERATION_IN_PROGRESS
      x-codegen-request-body-name: body
      operationId: postClusterManagementV2ResourcesApplicationsKafkaAclsV3
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/kafka/acls/v3/{kafkaAclId}/:
    parameters:
    - name: kafkaAclId
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: string
    get:
      tags:
      - Apache Kafka ACL V3
      summary: Get list of Kafka ACLs for a given principal
      description: Get list of Kafka ACLs for a principal.
      responses:
        '200':
          description: Kafka ACL details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaAclListV3'
      operationId: getClusterManagementV2ResourcesApplicationsKafkaAclsV3ByKafkaAclId
      x-operation-id-source: derived
    put:
      tags:
      - Apache Kafka ACL V3
      summary: Update ACL list for a principal
      description: Update ACL list for a specific principal in a Kafka cluster.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KafkaAclListV3'
        required: true
      responses:
        '202':
          description: Updated list of ACLs for the given kafkaAclId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaAclListV3'
          x-terraform-resource-poll-completed-statuses: NO_OPERATION
          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: OPERATION_IN_PROGRESS
      x-codegen-request-body-name: body
      operationId: putClusterManagementV2ResourcesApplicationsKafkaAclsV3ByKafkaAclId
      x-operation-id-source: derived
    delete:
      tags:
      - Apache Kafka ACL V3
      summary: Delete all ACLs associated with a principal
      description: Delete all ACLs associated with the given kafkaAclId.
      responses:
        '204':
          description: Kafka ACL delete requested.
          content: {}
      operationId: deleteClusterManagementV2ResourcesApplicationsKafkaAclsV3ByKafkaAclId
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    CurrentOperationStatus:
      type: string
      description: Indicates if the cluster is currently performing any operation such as being created, updated, or deleted
      example: OPERATION_IN_PROGRESS
      enum:
      - NO_OPERATION
      - OPERATION_IN_PROGRESS
      - OPERATION_FAILED
      x-insta-tf-import-hidden: true
      x-terraform-field-status: true
    KafkaAclListV3:
      required:
      - acls
      - clusterId
      - userQuery
      type: object
      properties:
        currentOperationStatus:
          $ref: '#/components/schemas/CurrentOperationStatus'
        acls:
          type: array
          description: List of ACLs for the given principal.
          items:
            $ref: '#/components/schemas/KafkaAclV2'
          x-terraform-field-name: acl
          x-terraform-ignore-order: true
        userQuery:
          type: string
          description: This is the principal without the `User:` prefix.
          x-terraform-force-new: true
        clusterId:
          type: string
          description: UUID of the Kafka cluster.
          format: uuid
          x-terraform-force-new: true
        id:
          type: string
          description: 'Instaclustr identifier for the ACL list for a principal. The value of this property has the form: [clusterId]_[principalUserQuery]

            The user query is the principal value without the leading `User:`.'
          readOnly: true
          x-terraform-force-new: true
          x-terraform-id: true
      description: List of access control lists for a Kafka cluster.
      example:
        acls:
        - host: '*'
          operation: DESCRIBE
          patternType: LITERAL
          permissionType: ALLOW
          principal: User:test
          resourceName: kafka-cluster
          resourceType: CLUSTER
        - host: '*'
          operation: CREATE
          patternType: PREFIXED
          permissionType: ALLOW
          principal: User:test
          resourceName: kafka-topic
          resourceType: TOPIC
        clusterId: c1af59c6-ba0e-4cc2-a0f3-65cee17a5f37
        userQuery: test
    KafkaAclV2:
      title: Root Type for KafkaAclV2
      required:
      - host
      - operation
      - patternType
      - permissionType
      - principal
      - resourceName
      - resourceType
      type: object
      properties:
        principal:
          pattern: ^User:[a-zA-Z0-9][a-zA-Z0-9_-]*$
          type: string
          description: Specifies the users(s) for which this ACL applies and can include the wildcard `*`. Valid values must start with "User:" including the wildcard.
        permissionType:
          type: string
          description: Specifies whether to allow or deny the operation.
          enum:
          - ALLOW
          - DENY
        host:
          type: string
          description: The IP address to which this ACL applies. It takes any string including the wildcard `*` for all IP addresses.
        patternType:
          type: string
          description: Indicates the resource-pattern-type
          enum:
          - LITERAL
          - PREFIXED
        resourceName:
          type: string
          description: Any string that fits the resource name, e.g. topic name if the resource type is TOPIC
        operation:
          type: string
          description: The operation that will be allowed or denied.
          enum:
          - ALL
          - READ
          - WRITE
          - CREATE
          - DELETE
          - ALTER
          - DESCRIBE
          - CLUSTER_ACTION
          - DESCRIBE_CONFIGS
          - ALTER_CONFIGS
          - IDEMPOTENT_WRITE
        resourceType:
          type: string
          description: Specifies the type of resource.
          enum:
          - CLUSTER
          - TOPIC
          - GROUP
          - DELEGATION_TOKEN
          - TRANSACTIONAL_ID
      description: Definition of a Kafka access control list.
      example:
        host: '*'
        operation: DESCRIBE
        patternType: LITERAL
        permissionType: ALLOW
        principal: User:test
        resourceName: kafka-cluster
        resourceType: CLUSTER
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
