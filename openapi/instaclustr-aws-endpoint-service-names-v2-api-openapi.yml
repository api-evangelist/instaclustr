openapi: 3.2.0
info:
  title: Instaclustr AWS Endpoint Service Names V2 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged AWS Endpoint Service Names V2 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: AWS Endpoint Service Names V2
  description: Operations related to AWS endpoint service names.
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/data-sources/cluster_data_center/{clusterDataCenterId}/aws-endpoint-service-names/v2/:
    parameters:
    - name: clusterDataCenterId
      in: path
      description: ID of the Cluster Data Center.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    x-terraform-resource-name: aws_endpoint_service_names_v2
    get:
      tags:
      - AWS Endpoint Service Names V2
      summary: List all Endpoint service names on a specific cluster data center
      description: List all Endpoint service names on a specific cluster data center.
      responses:
        '200':
          description: Retrieved Endpoint Service Names.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AwsEndpointServiceNamesV2'
        '404':
          description: Cluster Data Center not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: getClusterManagementV2DataSourcesClusterDataCenterByClusterDataCenterIdAwsEndpointServiceNamesV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    AwsEndpointServiceNameV2:
      type: object
      properties:
        clusterDataCenterId:
          type: string
          description: The ID of the cluster data center.
          format: uuid
          x-terraform-force-new: true
        endPointServiceId:
          type: string
          description: The Instaclustr ID of the AWS endpoint service
          readOnly: true
        endPointServiceName:
          type: string
          description: The Endpoint Service Name.
          readOnly: true
          x-terraform-force-new: true
      description: Definition of an Endpoint Service Name being used for privateLink cluster.
      example:
        clusterDataCenterId: f3eab841-6952-430d-ba90-1bfc3f15da10
        endPointServiceId: 763dfdd3-9633-4c8f-957b-35450ad61c48
        endPointServiceName: com.amazonaws.vpce.us-east-1.vpce-svc-051664e1a78a31ce1
    AwsEndpointServiceNamesV2:
      type: object
      properties:
        clusterDataCenterId:
          type: string
          description: ID of the cluster data center
          x-terraform-id: true
        awsEndpointServiceNames:
          type: array
          description: AWS Endpoint Service Names.
          readOnly: true
          items:
            $ref: '#/components/schemas/AwsEndpointServiceNameV2'
      description: List of AWS endpoint service names for a cluster data center
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
