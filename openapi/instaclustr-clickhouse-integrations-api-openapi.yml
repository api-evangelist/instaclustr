components:
  schemas:
    ClickHouseIntegrationS3Private:
      required:
      - buckets
      - clusterId
      type: object
      properties:
        kmsKeyArns:
          minItems: 0
          type: array
          description: List of KMS key ARNs.
          items:
            type: string
            description: ARN of a KMS key
            example: arn:aws:kms:us-west-2:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab
        buckets:
          minItems: 1
          type: array
          description: S3 buckets for the Private S3 Integration.
          items:
            type: object
            properties:
              readOnly:
                type: boolean
                description: Boolean recording whether the S3 bucket is read-only.
              arn:
                type: string
                description: ARN for the S3 bucket
                example: arn:aws:s3:::example-s3-bucket
            description: ''
        clusterId:
          type: string
          description: ID of the ClickHouse cluster
          example: 12aq0751-a169-8732-287a-21aedc6d23fd
          x-terraform-force-new: true
        id:
          type: string
          description: ID of the Private S3 Integration.
          readOnly: true
          example: privateS3-12aq0751-a169-8732-287a-21aedc6d23fd
        status:
          type: string
          description: Status of the Private S3 integration.
          readOnly: true
          example: APPLIED
          x-terraform-field-status: true
      description: ClickHouse integration with Private S3 buckets - enables access.
      example:
        buckets:
        - arn: arn:aws:s3:::example-s3-bucket
          readOnly: false
        - arn: arn:aws:s3:::example-s3-bucket2
          readOnly: true
        clusterId: 71e4380e-32ac-4fa7-ab42-c165fe35aa55
        kmsKeyArns:
        - arn:aws:kms:us-west-1:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab
    ClickHouseIntegrationS3Fsxn:
      required:
      - clusterId
      - fsxnFilesystem
      type: object
      properties:
        fsxnFilesystem:
          required:
          - fsxnId
          type: object
          properties:
            accessKeyId:
              type: string
              description: S3 access key ID.
              format: password
              x-terraform-sensitive: true
              x-terraform-write-only: true
            secretAccessKey:
              type: string
              description: S3 secret access key.
              format: password
              x-terraform-sensitive: true
              x-terraform-write-only: true
            endpointAddress:
              type: string
              description: S3 endpoint address.
              example: 10.3.5.123
              x-terraform-computed: true
            fsxnId:
              type: string
              description: AWS ID of the FSx ONTAP file system.
              example: fs-0c315066d18074b67
              x-terraform-force-new: true
            httpsEnabled:
              type: boolean
              description: Whether HTTPS is enabled for communication with the FSxN S3 endpoint. Defaults to true when not specified.
            vpcId:
              type: string
              description: AWS VPC ID where the FSx ONTAP file system is located.
              example: vpc-0bb1c79de3EXAMPLE
              x-terraform-computed: true
            endpointDns:
              type: string
              description: S3 endpoint DNS.
              example: svm-07efef4ffe0d242f5.fs-028e3bb45a3c6bbab.fsx.us-east-1.amazonaws.com
              x-terraform-computed: true
            region:
              type: string
              description: AWS region where the FSx ONTAP file system is located.
              example: us-east-1
              x-terraform-computed: true
            caCertificate:
              type: string
              description: PEM-encoded root CA certificate for the FSxN SVM endpoint. Required when httpsEnabled is true.
            providerAccountName:
              type: string
              description: Provider account name where the FSx ONTAP file system is located. Not required when selfManagedNetwork is true.
              example: AWS-RIYOA
              x-terraform-computed: true
            selfManagedNetwork:
              type: boolean
              description: When true, the customer manages all cross-account network connectivity (VPC peering, route tables, FSxN-side security group).
              x-terraform-computed: true
              x-terraform-force-new: true
          description: FSx ONTAP file system for the S3 FSxN integration.
        namedCollection:
          type: string
          description: A convenience named collection for query use.
          readOnly: true
          example: fsxn_fs_03b0dec5533476086
        clusterId:
          type: string
          description: ID of the ClickHouse cluster.
          format: uuid
          x-terraform-force-new: true
        id:
          type: string
          description: ID of the S3 FSxN integration.
          format: uuid
          readOnly: true
        status:
          type: string
          description: Status of the S3 FSxN Integration.
          readOnly: true
          example: APPLIED
          x-terraform-field-status: true
      description: ClickHouse integration with FSx ONTAP file system.
      example:
        clusterId: 12aq0751-a169-8732-287a-21aedc6d23fd
        fsxnFilesystem:
          accessKeyId: REDACTED_AWS_ACCESS_KEY_ID
          endpointAddress: 10.9.3.145
          endpointDns: svm-07efef4ffe0d242f5.fs-028e3bb45a3c6bbab.fsx.us-east-1.amazonaws.com
          fsxnId: fs-0c315066d18074b67
          providerAccountName: AWS-RIYOA
          region: US_EAST_1
          secretAccessKey: wJalrXUtnFEMI_K7MDENG_bPxRfiCYEXAMPLEKEY
          vpcId: vpc-07efef4ffe0d242f5
    ClickHouseIntegrationKafkaList:
      required:
      - integrations
      type: object
      properties:
        integrations:
          type: array
          description: All Kafka integrations for the ClickHouse cluster.
          items:
            $ref: '#/components/schemas/ClickHouseIntegrationKafka'
      description: List of all ClickHouse integrations with Kafka Clusters for a cluster.
    ClickHouseIntegrationS3:
      type: object
      properties:
        regions:
          minItems: 1
          type: array
          description: List of S3 Regions to integrate with.
          items:
            required:
            - target
            type: object
            properties:
              status:
                type: string
                description: Status of the S3 Region Integration.
                readOnly: true
                example: RUNNING
              target:
                type: string
                description: Target S3 Region for the integration (or 'ALL_REGIONS' for all regions).
                example: US-EAST-1
            description: ''
          x-terraform-field-name: region
          x-terraform-ignore-order: true
        clusterId:
          type: string
          description: ID of the ClickHouse cluster.
          example: 12aq0751-a169-8732-287a-21aedc6d23fd
          x-terraform-force-new: true
        id:
          type: string
          description: ID of the S3 Integration
          readOnly: true
          example: s3-12aq0751-a169-8732-287a-21aedc6d23fd
      description: ClickHouse integration with S3 Region - enables access
      example:
        clusterId: 71e4380e-32ac-4fa7-ab42-c165fe35aa55
        regions:
        - target: US-EAST-1
        - target: US-WEST-1
    ClickHouseIntegrationDomain:
      type: object
      properties:
        domains:
          type: array
          description: List of domains to integrate with.
          items:
            required:
            - target
            type: object
            properties:
              status:
                type: string
                description: Status of the Domain Integration.
                readOnly: true
                example: RUNNING
              target:
                type: string
                description: Target for the Domain Integration.
                example: www.example.com
            description: ''
          x-terraform-field-name: domain
          x-terraform-ignore-order: true
        clusterId:
          type: string
          description: ID of the ClickHouse cluster
          example: 12aq0751-a169-8732-287a-21aedc6d23fd
          x-terraform-force-new: true
        id:
          type: string
          description: ID of the Domain Integration.
          readOnly: true
          example: domain-12aq0751-a169-8732-287a-21aedc6d23fd
      description: ClickHouse integration with Domain - enables access.
      example:
        clusterId: 71e4380e-32ac-4fa7-ab42-c165fe35aa55
        domains:
        - target: www.example.com
        - target: www.anotherexample.com
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    ClickHouseIntegrationS3FsxnList:
      required:
      - integrations
      type: object
      properties:
        integrations:
          type: array
          description: All S3 FSxN Integrations for the cluster.
          items:
            $ref: '#/components/schemas/ClickHouseIntegrationS3Fsxn'
      description: List of all S3 FSxN Integrations for a given cluster.
    ClickHouseIntegrationKafka:
      required:
      - clusterId
      - kafkaCluster
      type: object
      properties:
        namedCollection:
          type: string
          description: 'Name of of named collection used for the Kafka table integration config. Format: kafka-cluster-<integration-id>_topic_<topic-name>'
          readOnly: true
          example: kafka-cluster-15gb5751-a184-8298-627a-29aedc6d23tg
        clusterId:
          type: string
          description: ID of the ClickHouse cluster
          example: 12aq0751-a169-8732-287a-21aedc6d23fd
          x-terraform-force-new: true
        id:
          type: string
          description: ID of the Kafka Integration.
          readOnly: true
          example: kafka-12340751-a169-8732-287a-21aedc6d23fd
        kafkaCluster:
          type: object
          properties:
            format:
              type: string
              description: Format of the Kafka message
              example: Avro
            topicName:
              type: string
              description: Name of the Kafka topic.
              example: topic-name-example
            id:
              type: string
              description: ID of the Kafka cluster.
              example: 12aq0751-a169-8732-287a-21aedc6d23fc
          description: Kafka cluster for the Kafka Integration.
        status:
          type: string
          description: Status of the Kafka Integration.
          readOnly: true
          example: APPLIED
          x-terraform-field-status: true
      description: ClickHouse Integration with Kafka clusters - enables access.
      example:
        clusterId: 12aq0751-a169-8732-287a-21aedc6d23fd
        kafkaCluster:
          format: Avro
          id: 12aq0751-a169-8732-287a-21aedc6d23fc
          topicName: kafka-topic
    ErrorResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      description: ''
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
