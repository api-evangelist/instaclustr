      description: Instaclustr API
  /v1/maintenance-events/exclusion-windows:
    get:
      tags:
      - Maintenance Events API
      summary: List exclusion windows
      description: Lists all exclusion windows (times when maintenance events cannot be performed) for the given cluster
      operationId: getExclusionWindowsForCluster
      parameters:
      - name: clusterId
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
        example: 0c7067d6-c70a-11ea-87d0-0242ac130003
      responses:
