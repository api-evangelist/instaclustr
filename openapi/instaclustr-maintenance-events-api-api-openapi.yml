  /v1/maintenance-events/events/{scheduleId}:
    put:
      tags:
      - Maintenance Events API
      summary: Reschedule a maintenance event schedule
      description: Reschedules a maintenance event schedule to the given start time.
      operationId: modifyMaintenanceEventSchedule
      parameters:
      - name: scheduleId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: 2c7067d6-c70a-11ea-87d0-0242ac130003
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMaintenanceEventScheduleRequest'
        required: true
      responses:
        '200':
          description: Successfully updated maintenance event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceEventScheduleResponse'
        '400':
          description: Bad Request
