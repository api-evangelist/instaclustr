      description: Instaclustr API
  /v1/maintenance-events/exclusion-windows/{windowId}:
    delete:
      tags:
      - Maintenance Events API
      summary: Delete exclusion window
      description: Removes an exclusion window
      operationId: deleteExclusionWindow
      parameters:
      - name: windowId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: 3c7067d6-c70a-11ea-87d0-0242ac130003
