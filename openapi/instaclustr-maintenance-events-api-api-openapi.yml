      deprecated: false
    post:
      tags:
      - Maintenance Events API
      summary: Create exclusion window
      description: Creates a new exclusion window (time when maintenance events cannot be performed) for the given cluster
      operationId: createExclusionWindow
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExclusionWindowRequest'
        required: true
      responses:
        '200':
          description: Successfully created exclusion window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateExclusionWindowResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
