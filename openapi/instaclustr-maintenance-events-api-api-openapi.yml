tags:
- name: Maintenance Events API
  description: Operations related to managing maintenance events on Instaclustr clusters.
  x-insta-tag-group: Provisioning V1
paths:
  /v1/maintenance-events/events:
    get:
      tags:
      - Maintenance Events API
      summary: List maintenance events
      description: Lists all upcoming maintenance events for the given cluster
      operationId: getUpcomingMaintenanceEventsForCluster
      parameters:
      - name: clusterId
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
        example: 0c7067d6-c70a-11ea-87d0-0242ac130003
      responses:
        '200':
          description: Successfully retrieved maintenance events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceEventsScheduleResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Not Authorized
          content:
            application/json: {}
        '403':
          description: Forbidden
          content:
            application/json: {}
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '415':
          description: 'Unsupported media type: returned when the payload is in an unsupported format.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: 'Too many requests: returned when more than 35 requests per second are being received by your user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      deprecated: false
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
