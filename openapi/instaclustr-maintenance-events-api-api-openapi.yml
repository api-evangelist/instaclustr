components:
  schemas:
    MaintenanceEventsResponse:
      type: object
      properties:
        maintenanceEvents:
          type: array
          description: List of maintenance events for the given cluster
          items:
            $ref: '#/components/schemas/MaintenanceEventResponse'
    MaintenanceEventsScheduleResponse:
      type: object
      properties:
        maintenanceEvents:
          type: array
          description: List of all uncompleted maintenance events for the given cluster
          items:
            $ref: '#/components/schemas/MaintenanceEventScheduleResponse'
    ExclusionWindowsResponse:
      type: object
      properties:
        exclusionWindows:
          type: array
          description: List of exclusion windows for the given cluster
          items:
            $ref: '#/components/schemas/WindowResponse'
    CreateExclusionWindowRequest:
      type: object
      properties:
        clusterId:
          type: string
          description: Cluster Id for the cluster that this exclusion window relates to
          example: cf4fccf3-2ac0-494b-9f40-e95288dd752d
        dayOfWeek:
          type: string
          description: The day of the week that this exclusion window starts on
          example: TUESDAY
        startHour:
          type: integer
          description: The hour of the day that this exclusion window starts on
          format: int32
          example: 14
        durationInHours:
          type: integer
          description: The duration (in hours) of this exclusion window
          format: int32
          example: 6
        validationMessages:
          type: object
          additionalProperties:
            type: string
    UpdateMaintenanceEventScheduleRequest:
      type: object
      properties:
        scheduledStartTime:
          type: string
          description: The time this maintenance event should be rescheduled to start at (in UTC time)
          example: '2021-12-21T11:00:00Z'
        validationMessages:
          type: object
          additionalProperties:
            type: string
    MaintenanceEventResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique Id for this maintenance event
          example: ff4fccf3-2ac0-494b-9f40-e95288dd752d
        clusterId:
          type: string
          description: Unique Id for the cluster that this maintenance event relates to
          example: af4fccf3-2ac0-494b-9f40-e95288dd752d
        description:
          type: string
          description: A text description of the activities being performed in this maintenance event
          example: Upgrade Debian on nodes to 11.3
        startTime:
          type: string
          description: The time work on this maintenance event started in UTC time
          example: '2021-12-21T11:03:32Z'
        endTime:
          type: string
          description: The time work on this maintenance event ended in UTC time
          example: '2021-12-21T11:03:32Z'
        outcome:
          type: string
          description: Maintenance outcome
          enum:
          - COMPLETED
          - FAILED
          - PARTIAL
          - CANCELLED
      description: List of maintenance events for the given cluster
    ErrorMessage:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        errorDetails:
          type: object
        code:
          type:
          - integer
          - 'null'
          format: int32
        link:
          type:
          - string
          - 'null'
    MaintenanceEventScheduleResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique Id for this maintenance event
          example: ff4fccf3-2ac0-494b-9f40-e95288dd752d
        clusterId:
          type: string
          description: Unique Id for the cluster that this maintenance event relates to
          example: af4fccf3-2ac0-494b-9f40-e95288dd752d
        description:
          type: string
          description: A text description of the activities being performed in this maintenance event
          example: Upgrade Debian on nodes to 11.3
        scheduledStartTime:
          type: string
          description: The time this maintenance event is scheduled to start in UTC time
          example: '2021-12-21T11:00:00Z'
        scheduledEndTime:
          type: string
          description: The time this maintenance event is scheduled to end by in UTC time
          example: '2021-12-21T13:00:00Z'
        scheduledStartTimeMin:
          type: string
          description: The earliest limit for the scheduled start time in UTC time, i.e., scheduled start time will be after this value
          example: '2021-12-21T11:00:00Z'
        scheduledStartTimeMax:
          type: string
          description: The latest limit for the scheduled start time in UTC time, i.e., scheduled start time will be before this value
          example: '2021-12-21T11:00:00Z'
        isFinalized:
          type: boolean
          description: Whether or not we can still allow the event to be rescheduled
          example: false
    WindowResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique Id for this exclusion windows
          example: af4fccf3-2ac0-494b-9f40-e95288dd752d
        clusterId:
          type: string
          description: Cluster Id for the cluster that this exclusion window relates to
          example: cf4fccf3-2ac0-494b-9f40-e95288dd752d
        dayOfWeek:
          type: string
          description: The day of the week that this exclusion window starts on
          example: TUESDAY
        startHour:
          type: integer
          description: The hour of the day that this exclusion window starts on
          format: int32
          example: 14
        durationInHours:
          type: integer
          description: The duration (in hours) of this exclusion window
          format: int32
          example: 6
      description: List of exclusion windows for the given cluster
    CreateExclusionWindowResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique Id for this exclusion windows
          example: af4fccf3-2ac0-494b-9f40-e95288dd752d
  securitySchemes:
    Basic_Authentication:
      type: http
      description: Most requests to the API must use Basic Authentication and contain a valid username and appropriate API key for the endpoint.<br><br>API keys can be retrieved any time from the <a href='https://console2.instaclustr.com/' target='_blank'>console</a>. To find the API key relevant to the endpoint, refer to the Authentication & Rate Limit section for the endpoint or the group of the endpoint.
      scheme: basic
    No_Authentication:
      type: http
      description: Certain endpoints are publicly available and does not need any authentication to access.
      scheme: none
