    CassandraClusterV2:
      required:
      - cassandraVersion
      - dataCentres
      - luceneEnabled
      - name
      - passwordAndUserAuth
      - pciComplianceMode
      - privateNetworkCluster
      - slaTier
      type: object
      properties:
        pciComplianceMode:
          type: boolean
          description: Creates a PCI compliant cluster, see [PCI Compliance](https://www.instaclustr.com/support/documentation/useful-information/pci-compliance/).
          example: true
          x-terraform-force-new: true
        description:
          type: string
          description: A description of the cluster
          example: Cluster managed by the integration team.
          x-terraform-computed: true
        twoFactorDelete:
          maxItems: 1
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/TwoFactorDeleteSettingsV2'
          x-terraform-computed: true
        defaultUserPassword:
          type: string
          description: Password of the default user created for the Cassandra cluster.
          readOnly: true
          x-terraform-sensitive: true
        dataCentres:
          minItems: 1
          type: array
          description: List of data centre settings.
          items:
            $ref: '#/components/schemas/CassandraDataCentreV2'
          x-terraform-field-name: data_centre
          x-terraform-ignore-order: true
        currentClusterOperationStatus:
          $ref: '#/components/schemas/CurrentClusterOperationStatusV2'
        privateNetworkCluster:
          type: boolean
          description: Creates the cluster with private network only, see [Private Network Clusters](https://www.instaclustr.com/support/documentation/useful-information/private-network-clusters/).
          example: true
          x-terraform-force-new: true
        cassandraVersion:
          pattern: '[0-9]+\.[0-9]+\.[0-9]+'
          type: string
          description: 'Version of Cassandra to run on the cluster. Available versions: <ul> <li>`4.0.19`</li> <li>`4.1.12`</li> <li>`4.1.10`</li> <li>`4.0.21`</li> <li>`5.0.9`</li> <li>`5.0.6`</li> </ul>'
          example: 1.2.3
          x-terraform-force-new: true
        luceneEnabled:
          type: boolean
          description: Adds Apache Lucene to the Cassandra cluster.
          example: true
          x-terraform-force-new: true
        passwordAndUserAuth:
          type: boolean
          description: Enables Password Authentication and User Authorization.
          example: true
          x-terraform-force-new: true
        name:
          maxLength: 48
          minLength: 3
          pattern: '[a-zA-Z0-9][a-zA-Z0-9_-]*'
          type: string
          description: Name of the cluster.
          example: exampleCluster
          x-terraform-force-new: true
        bundledUseOnly:
          type: boolean
          description: Provision this cluster for [Bundled Use only](https://www.instaclustr.com/support/documentation/cadence/getting-started-with-cadence/bundled-use-only-cluster-deployments/).
          example: true
          x-terraform-computed: true
          x-terraform-force-new: true
        resizeSettings:
          maxItems: 1
          type: array
          description: Settings to determine how resize requests will be performed for the cluster.
          items:
            $ref: '#/components/schemas/ResizeSettingsV2'
          x-terraform-write-only: true
        id:
          type: string
          description: ID of the cluster.
          readOnly: true
          example: 4650aa98-e894-4675-9614-558915d5837a
        slaTier:
          $ref: '#/components/schemas/SlaTierV2'
        status:
          type: string
          description: Status of the cluster.
          readOnly: true
          example: RUNNING
      description: Definition of a managed Cassandra cluster that can be provisioned in Instaclustr.
      example:
        cassandraVersion: '[x.y.z]'
        dataCentres:
        - clientToClusterEncryption: true
          cloudProvider: AWS_VPC
          continuousBackup: true
          name: MyTestDataCentre1
          network: 10.0.0.0/16
          nodeSize: CAS-PRD-m6g.large-120
          numberOfNodes: 3
          privateIpBroadcastForDiscovery: true
          region: US_EAST_1
          replicationFactor: 3
        - clientToClusterEncryption: true
          cloudProvider: AWS_VPC
          continuousBackup: true
          debezium:
          - kafkaCdcId: d363b575-3d22-4235-80ad-7699bed3123c
            kafkaTopicPrefix: MyTopicPrefix
            kafkaVpcType: VPC_PEERED
            version: '[x.y.z]'
          name: MyTestDataCentre2
          network: 10.1.0.0/16
          nodeSize: CAS-PRD-m6g.large-120
          numberOfNodes: 3
          privateIpBroadcastForDiscovery: true
          region: US_EAST_2
          replicationFactor: 3
        luceneEnabled: true
        name: MyTestCluster
        passwordAndUserAuth: true
        pciComplianceMode: false
        privateNetworkCluster: false
        slaTier: PRODUCTION
        twoFactorDelete:
        - confirmationEmail: test@email.com
