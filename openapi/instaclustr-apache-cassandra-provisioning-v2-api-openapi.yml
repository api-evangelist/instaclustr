        id:
          type: string
          description: ID of the Cluster Data Centre.
          readOnly: true
          example: 4650aa98-e894-4675-9614-558915d5837a
        clusterDns:
          type: boolean
          description: Enable cluster DNS for the data centre. When enabled, a DNS entry is created for this CDC pointing to cluster nodes, with additional addresses per node purpose. Incompatible with Private Link clusters. Cannot be disabled once enabled.
          example: true
          x-terraform-computed: true
          x-terraform-field-name: cluster_dns
        privateLink:
          type: boolean
          description: Create a PrivateLink enabled cluster, see [PrivateLink](https://www.instaclustr.com/support/documentation/useful-information/privatelink/).
          example: false
          x-insta-unchangeable: true
          x-terraform-computed: true
        continuousBackup:
          type: boolean
          description: Enables commitlog backups and increases the frequency of the default snapshot backups.
          example: false
          x-insta-unchangeable: true
        awsSettings:
          maxItems: 1
          type: array
          description: AWS specific settings for the Data Centre. Cannot be provided with GCP or Azure settings.
          items:
            $ref: '#/components/schemas/ProviderAwsSettingsV2'
          x-insta-comment: due to a bug with the terraform provider openapi plugin this has to be a list instead of a nested object. Also has to be computed because terraform defaults lists to empty arrays when skipped, whereas the API returns null
          x-insta-unchangeable: true
          x-terraform-computed: true
        tagManagementEnabled:
          type: boolean
          description: (Optional) Enable tag management for the data centre, allowing you to create, update and delete custom tags on the data centre via Instaclustr Terraform Provider v2, Cluster Management API or Management Console. Tag management is only available for RIYOA clusters and cannot be disabled once enabled. If not specified, the current value will remain unchanged.
          x-terraform-computed: true
          x-terraform-field-name: tag_management_enabled
        clusterDnsZones:
          type: array
          description: 'Cluster DNS hosted zones for this data centre: each entry is a DNS domain with the VPCs associated for private zone resolution.'
          readOnly: true
          items:
            $ref: '#/components/schemas/ClusterDnsZoneDetailsV2'
        shotoverProxy:
          maxItems: 1
          type: array
          description: Details of the Shotover Proxy nodes provisioned for Private Link.
          example: ''
          items:
            $ref: '#/components/schemas/ShotoverProxyDetailsV2'
          x-terraform-computed: true
        customSubjectAlternativeNames:
          type: array
          description: List of Subject Alternate Names FQDNs as per RFC 1035.  Used by the applications with self signed certificates in keystores of nodes in the datacenter.
          example: '["www.abc.com.au", "www.instaclustr.com"]'
          items:
            type: string
          x-terraform-computed: true
        privateIpBroadcastForDiscovery:
          type: boolean
          description: Enables broadcast of private IPs for auto-discovery.
          example: true
          x-insta-unchangeable: true
        tags:
          type: array
          description: 'List of tags to apply to the Data Centre. Tags are metadata labels which allow you to identify, categorize and filter clusters. This can be useful for grouping together clusters into applications, environments, or any category that you require. Note: Tags will be returned sorted by key in alphabetical order regardless of input order. Terraform users: `tag` is not supported in terraform lifecycle `ignore_changes`.'
          items:
            $ref: '#/components/schemas/ProviderTagV2'
          x-terraform-field-name: tag
          x-terraform-ignore-order: true
        gcpSettings:
          maxItems: 1
          type: array
          description: GCP specific settings for the Data Centre. Cannot be provided with AWS or Azure settings.
          items:
            $ref: '#/components/schemas/ProviderGcpSettingsV2'
          x-insta-comment: See x-insta-comment on awsSettings
          x-insta-unchangeable: true
          x-terraform-computed: true
        nodes:
          type: array
          description: List of non-deleted nodes in the data centre
          readOnly: true
          items:
            $ref: '#/components/schemas/NodeDetailsV2'
        privateConnectivity:
          maxItems: 1
          type: array
          description: Configuration required for connecting to a PrivateLink or Private Service Connect enabled cluster.
          items:
            $ref: '#/components/schemas/CassandraPrivateConnectivitySettingsV2'
          x-insta-comment: due to a bug with the terraform provider openapi plugin this has to be a list instead of a nested object. Also has to be computed because terraform defaults lists to empty arrays when skipped, whereas the API returns null
          x-insta-unchangeable: true
          x-terraform-computed: true
        azureSettings:
          maxItems: 1
          type: array
          description: Azure specific settings for the Data Centre. Cannot be provided with AWS or GCP settings.
          items:
            $ref: '#/components/schemas/ProviderAzureSettingsV2'
          x-insta-comment: See x-insta-comment on awsSettings
          x-insta-unchangeable: true
          x-terraform-computed: true
        name:
          type: string
          description: A logical name for the data centre within a cluster. These names must be unique in the cluster.
          example: US_EAST_1_DC
          x-insta-unchangeable: true
        region:
          type: string
          description: Region of the Data Centre. See the description for node size for a compatible Data Centre for a given node size.
          example: US_EAST_1
          x-insta-unchangeable: true
        providerAccountName:
          type: string
          description: For customers running in their own account. Your provider account can be found on the Create Cluster page on the Instaclustr Console, or the "Provider Account" property on any existing cluster. For customers provisioning on Instaclustr's cloud provider accounts, this property may be omitted.
          x-insta-unchangeable: true
          x-terraform-computed: true
        status:
          type: string
          description: Status of the Data Centre.
          readOnly: true
          example: RUNNING
      description: ''
