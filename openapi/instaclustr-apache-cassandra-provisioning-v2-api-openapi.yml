      tags:
      - Apache Cassandra Provisioning V2
      summary: Trigger a Cassandra Cluster Restore
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CassandraClusterRestoreV2'
        required: true
      responses:
        '202':
          description: Cassandra Cluster Restore requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CassandraClusterRestoreV2'
              example:
                cdcConfigs:
                - cdcId: a8c32b20-c8f0-11e7-abc4-cec278b6b50a
                  customVpcSettings:
                    network: 10.0.0.0/16
                    vpcId: vpc-002512aa
                  restoreMode: CUSTOM_VPC
                clusterId: c0e5e2ff-affe-444c-bdca-707c7b48aaad
                clusterNetwork: 10.0.0.0/16
                keyspaceTables: keyspace1.test1,keyspace1.test2
                pointInTime: 1420070400000
                restoredClusterId: b8a32a20-d8e0-11a7-def4-sdc278a6a50b
                restoredClusterName: my-restored-cluster
