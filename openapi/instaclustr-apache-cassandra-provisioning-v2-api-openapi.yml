openapi: 3.2.0
info:
  title: Instaclustr Apache Cassandra Provisioning V2 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Apache Cassandra Provisioning V2 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Apache Cassandra Provisioning V2
  description: ''
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/data-sources/applications/cassandra/clusters/v2/{clusterId}/list-backups/v2:
    parameters:
    - name: clusterId
      in: path
      description: ID of the cluster.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Apache Cassandra Provisioning V2
      summary: List recent cluster backup events
      description: List backups and restores for each node in a given Cassandra cluster, for the last 7 days.
      operationId: listCassandraClusterBackupsV2
      responses:
        '200':
          description: List backups and restores for each node in a given cluster, for the last 7 days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonClusterBackupEventsV2'
              example:
                clusterDataCentres:
                - id: a8c32b20-c8f0-11e7-abc4-cec278b6b50a
                  name: AWS_VPC_US_EAST_1
                  nodes:
                  - events:
                    - end: 1510585212265
                      progress: 0.5
                      start: 1510585212265
                      state: ACTIVE
                      type: snapshot-upload
                    id: cb986e08-f6be-4d08-8de2-4352c2cfaf1f
                    privateAddress: 10.0.0.1
                    publicAddress: 50.0.0.1
                id: 77b5a4e1-c422-4a78-b551-d8fa5c42ad95
                name: example-cluster
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/data-sources/applications/cassandra/clusters/v2/{clusterId}/private-service-connect-rack-info/v2:
    parameters:
    - name: clusterId
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Apache Cassandra Provisioning V2
      summary: Get Cassandra GCP Private Service Connect rack information
      responses:
        '200':
          description: Cassandara GCP Private Service Connect rack information for all data centers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CassandraPrivateServiceConnectRackInfoByDataCenterV2'
              example:
              - dataCenterName: GCP_us-central1
                rackInfo:
                - advertisedIps:
                  - 10.1.0.0/20
                  - 10.1.0.1/20
                  - 10.1.0.2/20
                  rackName: us-central1-b
                  serviceAttachmentId: 9c698c94-dde9-4733-85cb-35086420a76d
                  serviceAttachmentName: sa-psc-b-4650aa98-e894-4675-9614-558915d5837a
                  serviceAttachmentNetwork: 10.6.0.0/18
                region: us-central1
        '404':
          description: GCP Private Service Connect rack information is not found for this cluster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      operationId: getClusterManagementV2DataSourcesApplicationsCassandraClustersV2ByClusterIdPrivateServiceConnectRackInfoV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/data-sources/applications/cassandra/compatible-node-sizes/v2/:
    parameters:
    - name: sparkRequired
      in: query
      description: Specifies whether node sizes are also compatible with Spark.
      required: false
      style: form
      explode: true
      schema:
        type: boolean
    - name: cassandraVersion
      in: query
      description: A version of Cassandra to further filter compatible node sizes.
      required: false
      style: form
      explode: true
      schema:
        pattern: '[0-9]+\.[0-9]+\.[0-9]+'
        type: string
    get:
      tags:
      - Apache Cassandra Provisioning V2
      summary: List compatible node sizes for Cassandra and any specified addon applications
      responses:
        '200':
          description: Successfully retrieved compatible node sizes for Cassandra.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CloudProviderNodeSizesListV2'
      operationId: getClusterManagementV2DataSourcesApplicationsCassandraCompatibleNodeSizesV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/data-sources/applications/cassandra/compatible-versions/v2/{version}:
    parameters:
    - name: version
      in: path
      description: A Cassandra version.
      required: true
      style: simple
      explode: false
      schema:
        pattern: '[0-9]+\.[0-9]+\.[0-9]+'
        type: string
    get:
      tags:
      - Apache Cassandra Provisioning V2
      summary: List all versions of applications compatible with a Cassandra version
      responses:
        '200':
          description: Successfully retrieved versions of applications compatible with a Cassandra version.
