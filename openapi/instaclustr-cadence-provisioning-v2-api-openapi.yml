    CadenceClusterV2:
      required:
      - cadenceVersion
      - dataCentres
      - name
      - pciComplianceMode
      - privateNetworkCluster
      - slaTier
      - useCadenceWebAuth
      type: object
      properties:
        pciComplianceMode:
          type: boolean
          description: Creates a PCI compliant cluster, see [PCI Compliance](https://www.instaclustr.com/support/documentation/useful-information/pci-compliance/).
          example: true
          x-terraform-force-new: true
        targetPrimaryCadence:
          maxItems: 1
          type: array
          description: Supporting Primary Cadence info for Multi region Cadence.
          items:
            $ref: '#/components/schemas/CadenceDependencyV2'
          x-terraform-computed: true
        sharedProvisioning:
          maxItems: 1
          type: array
          description: Settings for SHARED provisioning. Must not be defined with STANDARD provisioning options. Can only use node sizes with prefix `CAD-SI`.
          example: ''
          items:
            $ref: '#/components/schemas/CadenceSharedProvisioningV2'
          x-terraform-force-new: true
        useHttpApi:
          type: boolean
          description: Enable Cadence HTTP API
          example: true
          x-terraform-computed: true
          x-terraform-force-new: true
        description:
          type: string
          description: A description of the cluster
          example: Cluster managed by the integration team.
          x-terraform-computed: true
        twoFactorDelete:
          maxItems: 1
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/TwoFactorDeleteSettingsV2'
          x-terraform-computed: true
        targetSecondaryCadence:
          maxItems: 1
          type: array
          description: Supporting Secondary Cadence info for Multi region Cadence.
          readOnly: true
          items:
            $ref: '#/components/schemas/CadenceDependencyV2'
        useCadenceWebAuth:
          type: boolean
          description: Enable Authentication for Cadence Web
          example: true
          x-terraform-force-new: true
        dataCentres:
          type: array
          description: List of data centre settings.
          items:
            $ref: '#/components/schemas/CadenceDataCentreV2'
          x-terraform-field-name: data_centre
          x-terraform-ignore-order: true
        currentClusterOperationStatus:
          $ref: '#/components/schemas/CurrentClusterOperationStatusV2'
        cadenceVersion:
          pattern: '[0-9]+\.[0-9]+\.[0-9]+'
          type: string
          description: 'Version of Cadence to run on the cluster. Available versions: <ul> <li>`1.3.6`</li> </ul>'
          example: 1.2.2
          x-terraform-force-new: true
        standardProvisioning:
          maxItems: 1
          type: array
          description: Settings for STARDARD provisioning. Must not be defined with SHARED provisioning options. Can not use node sizes with prefix `CAD-SI`.
          example: ''
          items:
            $ref: '#/components/schemas/CadenceStandardProvisioningV2'
          x-terraform-force-new: true
        privateNetworkCluster:
          type: boolean
          description: Creates the cluster with private network only, see [Private Network Clusters](https://www.instaclustr.com/support/documentation/useful-information/private-network-clusters/).
          example: true
          x-terraform-force-new: true
        name:
          maxLength: 48
          minLength: 3
          pattern: '[a-zA-Z0-9][a-zA-Z0-9_-]*'
          type: string
          description: Name of the cluster.
          example: exampleCluster
          x-terraform-force-new: true
        resizeSettings:
          maxItems: 1
          type: array
          description: Settings to determine how resize requests will be performed for the cluster.
          items:
            $ref: '#/components/schemas/ResizeSettingsV2'
          x-terraform-write-only: true
        id:
          type: string
          description: ID of the cluster.
          readOnly: true
          example: 4650aa98-e894-4675-9614-558915d5837a
        slaTier:
          $ref: '#/components/schemas/SlaTierV2'
        awsArchival:
          maxItems: 1
          type: array
          description: Cadence AWS Archival settings
          example: ''
          items:
            $ref: '#/components/schemas/AwsArchivalV2'
          x-terraform-force-new: true
        status:
          type: string
          description: Status of the cluster.
          readOnly: true
          example: RUNNING
      description: Definition of a managed Cadence cluster that can be provisioned in Instaclustr.
      example:
        cadenceVersion: 1.2.2
        dataCentres:
        - clientToClusterEncryption: false
          cloudProvider: AWS_VPC
          name: AWS_VPC_US_EAST_1
          network: 10.2.0.0/16
          nodeSize: CAD-PRD-m7g.large-50
          numberOfNodes: 3
          region: US_EAST_1
        name: MyCadenceCluster
        pciComplianceMode: false
        privateNetworkCluster: false
        slaTier: PRODUCTION
        standardProvisioning:
        - advancedVisibility:
          - targetKafka:
              dependencyCdcId: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
              dependencyVpcType: VPC_PEERED
            targetOpenSearch:
              dependencyCdcId: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
              dependencyVpcType: VPC_PEERED
          targetCassandra:
            dependencyCdcId: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
            dependencyVpcType: VPC_PEERED
        useCadenceWebAuth: true
        useHttpApi: false
