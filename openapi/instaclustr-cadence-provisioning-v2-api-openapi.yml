      - targetOpenSearch
      type: object
      properties:
        targetKafka:
          $ref: '#/components/schemas/CadenceDependencyV2'
        targetOpenSearch:
          $ref: '#/components/schemas/CadenceDependencyV2'
      description: Settings for enable advanced visibility
