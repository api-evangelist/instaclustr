openapi: 3.2.0
info:
  title: Instaclustr Cadence Provisioning V2 API
  version: Current
  x-logo:
    altText: Instaclustr Logo
    backgroundColor: '#FFFFFF'
    url: https://console2.instaclustr.com/assets/logos/instaclustr_logo_for_redocly.svg
  description: 'Operations tagged Cadence Provisioning V2 across 2 of this provider''s published API definitions: instaclustr-current-openapi.json, instaclustr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instaclustr.com
  description: Instaclustr API
security:
- Basic Authentication: []
tags:
- name: Cadence Provisioning V2
  description: ''
  x-insta-tag-group: Cluster Management V2
paths:
  /cluster-management/v2/data-sources/applications/cadence/compatible-node-sizes/v2/:
    get:
      tags:
      - Cadence Provisioning V2
      summary: List compatible node sizes for Cadence
      responses:
        '200':
          description: Successfully retrieved compatible node sizes for Cadence.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CloudProviderNodeSizesListV2'
      operationId: getClusterManagementV2DataSourcesApplicationsCadenceCompatibleNodeSizesV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/data-sources/applications/cadence/versions/v2/:
    get:
      tags:
      - Cadence Provisioning V2
      summary: List all Cadence versions
      responses:
        '200':
          description: Successfully retrieved versions of Cadence.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationVersionListV2'
      operationId: getClusterManagementV2DataSourcesApplicationsCadenceVersionsV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/operations/applications/cadence/clusters/v2/{clusterId}/certificate/v2/:
    parameters:
    - name: clusterId
      in: path
      description: ID of the cluster
      required: true
      style: simple
      explode: false
      schema:
        type: string
    get:
      tags:
      - Cadence Provisioning V2
      summary: Download Cadence cluster X.509 Certificate Authority certificates
      description: Cadence cluster certificates are returned as a .zip file. The file contains an X.509 cluster Certificate Authority certificate in JKS file, an X.509 cluster Certificate Authority certificate in PEM-encoded (ASCII) format, and an X.509 cluster Certificate Authority certificate in DER-encoded (binary) format.
      responses:
        '200':
          description: Successfully create the Cadence cluster's certificate
          content:
            application/zip:
              schema:
                type: string
                format: binary
      operationId: getClusterManagementV2OperationsApplicationsCadenceClustersV2ByClusterIdCertificateV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/cadence/clusters/v2/:
    x-terraform-resource-name: cadence_cluster_v2
    post:
      tags:
      - Cadence Provisioning V2
      summary: Create a Cadence cluster
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadenceClusterV2'
        required: true
      responses:
        '202':
          description: Cadence Cluster provisioning requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadenceClusterV2'
              example:
                cadenceVersion: 1.2.2
                currentClusterOperationStatus: OPERATION_IN_PROGRESS
                dataCentres:
                - clientToClusterEncryption: false
                  cloudProvider: AWS_VPC
                  id: 4650aa98-e894-4675-9614-558915d5837a
                  name: AWS_VPC_US_EAST_1
                  network: 10.2.0.0/16
                  nodeSize: CAD-PRD-m7g.large-50
                  nodes:
                  - id: 94c1ad54-c6f1-4f2e-8634-be9f5fb47fad
                    nodeRoles:
                    - CADENCE
                    nodeSize: CAD-PRD-m7g.large-50
                    privateAddress: 10.0.5.23
                    publicAddress: 24.135.55.176
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: cc317853-be79-4100-898f-c12e4610a892
                    nodeRoles:
                    - CADENCE
                    nodeSize: CAD-PRD-m7g.large-50
                    privateAddress: 10.0.128.45
                    publicAddress: 193.146.159.238
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: b401b5bb-8a6f-4aa7-99c4-12fe445941c3
                    nodeRoles:
                    - CADENCE
                    nodeSize: CAD-PRD-m7g.large-50
                    privateAddress: 10.0.200.78
                    publicAddress: 108.21.43.134
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  numberOfNodes: 3
                  region: US_EAST_1
                  status: RUNNING
                id: 4650aa98-e894-4675-9614-558915d5837a
                name: MyCadenceCluster
                pciComplianceMode: false
                privateNetworkCluster: false
                slaTier: PRODUCTION
                standardProvisioning:
                - advancedVisibility:
                  - targetKafka:
                      dependencyCdcId: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
                      dependencyVpcType: VPC_PEERED
                    targetOpenSearch:
                      dependencyCdcId: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
                      dependencyVpcType: VPC_PEERED
                  targetCassandra:
                    dependencyCdcId: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
                    dependencyVpcType: VPC_PEERED
                status: RUNNING
                useCadenceWebAuth: true
                useHttpApi: false
          x-terraform-resource-poll-completed-statuses: NO_OPERATION
          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: OPERATION_IN_PROGRESS
      x-codegen-request-body-name: body
      x-terraform-resource-timeout: 99999m
      operationId: postClusterManagementV2ResourcesApplicationsCadenceClustersV2
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
  /cluster-management/v2/resources/applications/cadence/clusters/v2/{clusterId}:
    parameters:
    - name: clusterId
      in: path
      description: Id of the active cluster
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Cadence Provisioning V2
      summary: Get Cadence cluster details
      operationId: getCadenceClusterV2
      responses:
        '200':
          description: Cadence cluster details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadenceClusterV2'
              example:
                cadenceVersion: 1.2.2
                currentClusterOperationStatus: OPERATION_IN_PROGRESS
                dataCentres:
                - clientToClusterEncryption: false
                  cloudProvider: AWS_VPC
                  id: 4650aa98-e894-4675-9614-558915d5837a
                  name: AWS_VPC_US_EAST_1
                  network: 10.2.0.0/16
                  nodeSize: CAD-PRD-m7g.large-50
                  nodes:
                  - id: 94c1ad54-c6f1-4f2e-8634-be9f5fb47fad
                    nodeRoles:
                    - CADENCE
                    nodeSize: CAD-PRD-m7g.large-50
                    privateAddress: 10.0.5.23
                    publicAddress: 24.135.55.176
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: cc317853-be79-4100-898f-c12e4610a892
                    nodeRoles:
                    - CADENCE
                    nodeSize: CAD-PRD-m7g.large-50
                    privateAddress: 10.0.128.45
                    publicAddress: 193.146.159.238
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: b401b5bb-8a6f-4aa7-99c4-12fe445941c3
                    nodeRoles:
                    - CADENCE
                    nodeSize: CAD-PRD-m7g.large-50
                    privateAddress: 10.0.200.78
                    publicAddress: 108.21.43.134
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  numberOfNodes: 3
                  region: US_EAST_1
                  status: RUNNING
                id: 4650aa98-e894-4675-9614-558915d5837a
                name: MyCadenceCluster
                pciComplianceMode: false
                privateNetworkCluster: false
                slaTier: PRODUCTION
                standardProvisioning:
                - advancedVisibility:
                  - targetKafka:
                      dependencyCdcId: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
                      dependencyVpcType: VPC_PEERED
                    targetOpenSearch:
                      dependencyCdcId: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
                      dependencyVpcType: VPC_PEERED
                  targetCassandra:
                    dependencyCdcId: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
                    dependencyVpcType: VPC_PEERED
                status: RUNNING
                useCadenceWebAuth: true
                useHttpApi: false
    put:
      tags:
      - Cadence Provisioning V2
      summary: Update a Cadence cluster
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadenceClusterUpdateV2'
        required: true
      responses:
        '202':
          description: Cadence cluster update request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadenceClusterV2'
              example:
                cadenceVersion: 1.2.2
                currentClusterOperationStatus: OPERATION_IN_PROGRESS
                dataCentres:
                - clientToClusterEncryption: false
                  cloudProvider: AWS_VPC
                  id: 4650aa98-e894-4675-9614-558915d5837a
                  name: AWS_VPC_US_EAST_1
                  network: 10.2.0.0/16
                  nodeSize: CAD-PRD-m7g.large-50
                  nodes:
                  - id: 94c1ad54-c6f1-4f2e-8634-be9f5fb47fad
                    nodeRoles:
                    - CADENCE
                    nodeSize: CAD-PRD-m7g.large-50
                    privateAddress: 10.0.5.23
                    publicAddress: 24.135.55.176
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: cc317853-be79-4100-898f-c12e4610a892
                    nodeRoles:
                    - CADENCE
                    nodeSize: CAD-PRD-m7g.large-50
                    privateAddress: 10.0.128.45
                    publicAddress: 193.146.159.238
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  - id: b401b5bb-8a6f-4aa7-99c4-12fe445941c3
                    nodeRoles:
                    - CADENCE
                    nodeSize: CAD-PRD-m7g.large-50
                    privateAddress: 10.0.200.78
                    publicAddress: 108.21.43.134
                    rack: us-east-1c
                    startTime: '2024-10-03T00:58:27.587Z'
                    status: RUNNING
                  numberOfNodes: 3
                  region: US_EAST_1
                  status: RUNNING
                id: 4650aa98-e894-4675-9614-558915d5837a
                name: MyCadenceCluster
                pciComplianceMode: false
                privateNetworkCluster: false
                slaTier: PRODUCTION
                standardProvisioning:
                - advancedVisibility:
                  - targetKafka:
                      dependencyCdcId: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
                      dependencyVpcType: VPC_PEERED
                    targetOpenSearch:
                      dependencyCdcId: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
                      dependencyVpcType: VPC_PEERED
                  targetCassandra:
                    dependencyCdcId: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
                    dependencyVpcType: VPC_PEERED
                status: RUNNING
                useCadenceWebAuth: true
                useHttpApi: false
          x-terraform-resource-poll-completed-statuses: NO_OPERATION
          x-terraform-resource-poll-enabled: true
          x-terraform-resource-poll-pending-statuses: OPERATION_IN_PROGRESS
        '404':
          description: Cadence cluster not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorListResponseV2'
      x-codegen-request-body-name: body
      x-terraform-resource-timeout: 99999m
      operationId: putClusterManagementV2ResourcesApplicationsCadenceClustersV2ByClusterId
      x-operation-id-source: derived
    delete:
      tags:
      - Cadence Provisioning V2
      summary: Delete cluster
      description: Delete an active cluster
      responses:
        '204':
          description: Cluster delete requested.
          content: {}
      x-terraform-resource-poll-enabled: true
      operationId: deleteClusterManagementV2ResourcesApplicationsCadenceClustersV2ByClusterId
      x-operation-id-source: derived
    servers:
    - url: https://api.instaclustr.com
      description: Instaclustr API
components:
  schemas:
    ProviderAzureSettingsV2:
      type: object
      properties:
        resourceGroup:
          type: string
          description: The name of the Azure Resource Group into which the Data Centre will be provisioned.
          x-insta-unchangeable: true
        customVirtualNetworkId:
          type: string
          description: VNet ID into which the Data Centre will be provisioned. The VNet must have an available address space for the Data Centre's network allocation to be appended to the VNet. Currently supported for PostgreSQL clusters only.
          example: /subscriptions/{subscription-id}/resourceGroups/{resource-group-name}/providers/Microsoft.Network/virtualNetworks/{virtual-network-name}
          x-insta-unchangeable: true
        storageNetwork:
          type: string
          description: 'The private network address block to be used for the storage network. This is only used for certain node sizes, currently limited to those which use Azure NetApp Files: for all other node sizes, this field should not be provided. The network must have a prefix length between /16 and /28, and must be part of a private address range.'
          example: 192.168.1.0/24
          x-insta-unchangeable: true
      description: ''
    VpcTypeV2:
      type: string
      description: ''
      example: SEPARATE_VPC
      enum:
      - TARGET_VPC
      - VPC_PEERED
      - SEPARATE_VPC
    ResizeOperationInfosV2:
      type: object
      properties:
        operations:
          type: array
          description: ''
          readOnly: true
          items:
            $ref: '#/components/schemas/ResizeOperationInfoV2'
      description: ''
    ResizeOperationInfoV2:
      type: object
      properties:
        concurrentResizes:
          type: integer
          description: Number of nodes that can be concurrently resized at a given time.
          readOnly: true
          example: 2
        replaceOperations:
          type: array
          description: ''
          readOnly: true
          items:
            $ref: '#/components/schemas/ReplaceOperationInfoV2'
        created:
          type: string
          description: Timestamp of the creation of the operation
          readOnly: true
          example: '2019-08-24T14:15:22Z'
        completed:
          type: string
          description: Timestamp of the completion of the operation.
          readOnly: true
          example: '2019-08-24T14:15:22Z'
        id:
          type: string
          description: ID of the operation.
          format: uuid
          readOnly: true
          example: 657d1cec-1eb8-449f-8be4-467ab1f2b856
        newNodeSize:
          type: string
          description: New size of the node.
          readOnly: true
          example: CAS-DEV-t4g.small-30
        instaclustrSupportAlerted:
          type: string
          description: Timestamp of when Instaclustr Support has been alerted to the resize operation.
          readOnly: true
          example: '2019-08-24T14:15:22Z'
        nodePurpose:
          type: string
          description: Purpose of the node
          readOnly: true
          example: CASSANDRA
        status:
          type: string
          description: Status of the operation
          readOnly: true
          example: COMPLETED
          enum:
          - COMPLETED
          - FAILED
          - DELETED
          - IN_PROGRESS
          - UNKNOWN
      description: ''
    NodeDetailsV2:
      type: object
      properties:
        nodeRoles:
          type: array
          description: The roles or purposes of the node. Useful for filtering for nodes that have a specific role.
          readOnly: true
          items:
            $ref: '#/components/schemas/NodeRolesV2'
        rack:
          type: string
          description: Rack name in which the node is located.
          readOnly: true
        nodeSize:
          type: string
          description: Size of the node.
          readOnly: true
        privateAddress:
          type: string
          description: Private IP address of the node.
          readOnly: true
          example: 10.131.60.142
        deletionTime:
          type: string
          description: Deletion time of the node as a UTC timestamp
          readOnly: true
          example: '2019-08-24T14:15:22Z'
        publicAddress:
          type: string
          description: Public IP address of the node.
          readOnly: true
          example: 52.0.5.140
        startTime:
          type: string
          description: Start time of the node as a UTC timestamp
          readOnly: true
          example: '2019-08-24T14:15:22Z'
        id:
          type: string
          description: ID of the node.
          readOnly: true
          example: 9a27373a-0451-4121-94ba-873fc441f313
        status:
          type: string
          description: Provisioning status of the node.
          readOnly: true
          example: RUNNING
      description: ''
    ErrorListResponseV2:
      title: Root Type for ErrorResponse
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseV2'
      description: ''
    ProviderTagV2:
      required:
      - key
      type: object
      properties:
        value:
          type: string
          description: Value of the custom tag.
          example: myTagValue
        key:
          type: string
          description: Key of the custom tag.
          example: myTagKey
          x-insta-unchangeable: true
      description: Custom tag for cloud provider resources.
    TwoFactorDeleteSettingsV2:
      required:
      - confirmationEmail
      type: object
      properties:
        confirmationPhoneNumber:
          pattern: ^(?![\s])[\-\s\(\)\+0-9]*$
          type: string
          description: The phone number which will be contacted when the cluster is requested to be delete.
          x-terraform-computed: true
        confirmationEmail:
          pattern: ^(([\s]*[^<>()\[\]\\.,;:@\s"]+(\.[^<>()\[\]\\.,;:\s@"]+)*))@((\[\d{1,3}(\.\d{1,3}){3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}[\s]*))$
          type: string
          description: The email address which will be contacted when the cluster is requested to be deleted.
          x-terraform-computed: true
      description: ''
    ResizeSettingsV2:
      type: object
      properties:
        notifySupportContacts:
          type: boolean
          description: Setting this property to `true` will notify the Instaclustr Account's designated support contacts on resize completion.
          x-terraform-write-only: true
        downsizeAcknowledged:
          type: boolean
          description: Set to `true` when the user has acknowledged that this resize reduces resource capacity and may cause node instability.
          x-terraform-write-only: true
        concurrency:
          type: integer
          description: Number of concurrent nodes to resize during a resize operation.
          x-terraform-write-only: true
      description: Settings to determine how resize requests will be performed for the cluster.
    SlaTierV2:
      type: string
      description: SLA Tier of the cluster. Non-production clusters may receive lower priority support and reduced SLAs. Production tier is not available when using Developer class nodes. See [SLA Tier](https://www.instaclustr.com/support/documentation/useful-information/sla-tier/) for more information.
      example: NON_PRODUCTION
      enum:
      - PRODUCTION
      - NON_PRODUCTION
      x-terraform-force-new: true
    ApplicationVersionsV2:
      type: object
      properties:
        application:
          $ref: '#/components/schemas/ApplicationEnumV2'
        versions:
          type: array
          description: List of sematic versions.
          example:
          - 1.0.0
          - 1.0.1
          items:
            pattern: '[0-9]+\.[0-9]+\.[0-9]+'
            type: string
      description: Object containing a single application and its available versions.
    CloudProviderNodeSizesListV2:
      type: object
      properties:
        cloudProviderNodeSizes:
          type: array
          description: List of all compatible cloud provider node sizes.
          items:
            $ref: '#/components/schemas/CloudProviderNodeSizesV2'
      description: Object containing list of node sizes grouped by cloud provider.
    CadenceStandardProvisioningV2:
      required:
      - targetCassandra
      type: object
      properties:
        advancedVisibility:
          maxItems: 1
          type: array
          description: Cadence advanced visibility settings
          example: ''
          items:
            $ref: '#/components/schemas/CadenceAdvancedVisibilityV2'
          x-terraform-force-new: true
        targetCassandra:
          $ref: '#/components/schemas/CadenceDependencyV2'
      description: Settings for STARDARD provisioning
    DeleteNodeOperationInfoV2:
      type: object
      properties:
        created:
          type: string
          description: Timestamp of the creation of the operation
          readOnly: true
          example: ''
        modified:
          type: string
          description: Timestamp of the last modification of the operation
          readOnly: true
          example: ''
        id:
          type: string
          description: Operation id
          format: uuid
          readOnly: true
          example: 8012715f-9e7d-405c-9325-ab67becd60db
        nodeId:
          type: string
          description: ID of the node being replaced.
          format: uuid
          readOnly: true
          example: 657d1cec-1eb8-449f-8be4-467ab1f2b856
        status:
          $ref: '#/components/schemas/OperationStatusV2'
      description: ''
    CurrentClusterOperationStatusV2:
      type: string
      description: Indicates if the cluster is currently performing any restructuring operation such as being created or resized
      example: OPERATION_IN_PROGRESS
      enum:
      - NO_OPERATION
      - OPERATION_IN_PROGRESS
      - OPERATION_FAILED
      x-insta-tf-import-hidden: true
      x-terraform-field-status: true
    CadenceDependencyV2:
      required:
      - dependencyCdcId
      - dependencyVpcType
      type: object
      properties:
        dependencyCdcId:
          type: string
          description: ID of the supporting Cluster's Cluster Data Centre
          format: uuid
          example: aabc665c-8916-40ae-978c-96d39a3a1364
          x-terraform-force-new: true
        dependencyVpcType:
          $ref: '#/components/schemas/VpcTypeV2'
      description: ''
    CurrentOperationsV2:
      type: object
      properties:
        deleteNodes:
          maxItems: 1
          type: array
          description: Latest active delete nodes operation
          readOnly: true
          items:
            $ref: '#/components/schemas/DeleteNodesOperationInfoV2'
        resize:
          maxItems: 1
          type: array
          description: Active node resize operations
          readOnly: true
          items:
            $ref: '#/components/schemas/ResizeOperationInfosV2'
      description: Active operations in the data centre.
    CadenceClusterUpdateV2:
      required:
      - dataCentres
      type: object
      properties:
        dataCentres:
          maxItems: 1
          minItems: 1
          type: array
          description: List of data centre settings.
          items:
            $ref: '#/components/schemas/CadenceDataCentreV2'
        description:
          type: string
          description: A description of the cluster
          example: Cluster managed by the integration team.
          x-terraform-computed: true
        twoFactorDelete:
          maxItems: 1
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/TwoFactorDeleteSettingsV2'
          x-terraform-computed: true
        resizeSettings:
          maxItems: 1
          type: array
          description: Settings to determine how resize requests will be performed for the cluster.
          items:
            $ref: '#/components/schemas/ResizeSettingsV2'
          x-terraform-write-only: true
      description: ''
    CloudProviderNodeSizesV2:
      type: object
      properties:
        nodeSizes:
          type: array
          description: List of node size names.
          example:
          - m5xl-400-v2
          - r5xl-2000-v2
          items:
            type: string
        cloudProvider:
          $ref: '#/components/schemas/CloudProviderEnumV2'
        document:
          type: string
          description: Cloud provider documentation of the virtual machine instances.
      description: Object containing list of compatible node sizes in a cloud provider.
    PrivateLinkSettingsV2:
      required:
      - advertisedHostname
      type: object
      properties:
        endPointServiceId:
          type: string
          description: The Instaclustr ID of the AWS endpoint service
          readOnly: true
        advertisedHostname:
          minLength: 3
          type: string
          description: The hostname to be used to connect to the PrivateLink cluster.
          example: test.com
          x-insta-unchangeable: true
        endPointServiceName:
          type: string
          description: Name of the created endpoint service
          readOnly: true
      description: Settings required for PrivateLink to be enabled on a cluster.
    DeleteNodesOperationInfoV2:
      type: object
      properties:
        numberOfNodesToDelete:
          type: integer
