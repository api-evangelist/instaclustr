          type: string
          description: ID of the Cluster Data Centre.
          readOnly: true
          example: 4650aa98-e894-4675-9614-558915d5837a
        region:
          type: string
          description: Region of the Data Centre. See the description for node size for a compatible Data Centre for a given node size.
          example: US_EAST_1
          x-insta-unchangeable: true
        privateLink:
          maxItems: 1
          type: array
          description: Create a PrivateLink enabled cluster, see [PrivateLink](https://www.instaclustr.com/support/documentation/useful-information/privatelink/).
