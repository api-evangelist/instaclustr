aid: instaclustr

name: Instaclustr

image: https://www.instaclustr.com/wp-content/uploads/Insta_Website_Social-Share-Thumbnail_rebrand.png

description: NetApp Instaclustr is a managed platform for open source data infrastructure, running and supporting Apache Kafka, Kafka Connect,
  Apache Cassandra, PostgreSQL, OpenSearch, ClickHouse, Valkey and Cadence clusters in its own cloud accounts or in a customer's cloud (Bring
  Your Own Cloud). Its public Instaclustr API at api.instaclustr.com provides cluster management (provisioning, firewall rules, peering, users,
  backups, maintenance events), monitoring metrics, user/organization management with SCIM 2.0, and an MCP Gateway product for AI agents. Instaclustr
  is part of NetApp.

