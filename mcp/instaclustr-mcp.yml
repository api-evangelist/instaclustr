name: Instaclustr API Server MCP Backend (NetApp Instaclustr MCP Gateway)
status: documented
note: 'Instaclustr sells MCP Gateway as a managed cluster type; each customer provisions an MCP Gateway cluster and attaches a platform-managed "Instaclustr API" backend whose tools proxy read-only Instaclustr
  API operations. There is no single public endpoint: the virtual-server URL is per customer cluster, so no endpoint is recorded. Tool names are as DOCUMENTED on the provider page, not observed from a live
  tools/list. api.instaclustr.com/mcp answered 401 to an anonymous probe (pre-flight, opaque).'
deployment:
  mode: none
  auth: api-key
  verified: searched
  note: Provider-managed but per-customer-provisioned (MCP Gateway cluster); no fixed endpoint an arbitrary agent can POST to.
auth:
  type: api-key
  description: MCP Gateway calls the Instaclustr API as a selected account user or Service User; Cluster Management tools need a Read Only Provisioning API key, Monitoring tools need a Monitoring API key.
